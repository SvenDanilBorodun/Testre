# Dependabot version updates (2026-11-09).
#
# Why this file exists: a private repository loses GitHub's automatic
# dependency PRs and secret scanning, so this file and the Dependabot alerts
# (Settings → Code security, which the owner turns back on after the flip) are
# the compensating control for known-vulnerable dependencies.
#
# The policy, and why it is this narrow:
# - GitHub Actions weekly, every update in ONE grouped PR. Every action is
#   pinned by commit SHA (zizmor); Dependabot moves the SHA and its `# vX`
#   comment together. tests/test_trainer_image_shape.py pins three action SHAs
#   by value, so an actions PR moves those pins in the same PR.
# - npm, pip and Docker monthly, grouped, at most 3 open PRs per ecosystem.
#   Major versions are never proposed: each is a migration (Blockly, eslint,
#   tailwind, vite and React majors all needed code changes here before).
# - EVERY dependency the repository pins on purpose is ignored, because a lone
#   bump of one site breaks a lockstep the tests or CLAUDE.md enforce:
#     * Rule §5: the LeRobot pin, torch/torchvision, numpy (1.26.4 in every
#       server image), scipy (<1.18), and the generated training lock
#       (modal_training/training-lock.txt, regenerated by make_training_lock.py,
#       never edited; it is not a requirements file Dependabot reads).
#     * CI's own pins equal to the cloud API's requirements.txt and the server
#       image (ci.yml::python-tests): huggingface_hub, cryptography, boto3/
#       botocore, fastapi/httpx/uvicorn/aiohttp, pyarrow, av.
#     * modal (">=1.6,<2", reviewed by hand before any change).
#     * opencv 4.10.0.84 (the Pi agent, the server image and the Cloud-Inferenz
#       image carry the same version).
#     * pythonnet (one deliberate release candidate).
#     * three 0.184.0 + urdf-loader 0.12.7, codemirror + @codemirror/* +
#       @lezer/* (exact pins, eslint-fenced importers), react-icons (the icon
#       registry is pinned to its trees), espree 9.6.1 (the glyph fence).
#     * Base images: the ROBOTIS bases and the self-built arm64 bases
#       (base-version-guard + bump-upstream-digests.sh own them), ros, ubuntu
#       (wsl_rootfs: any change forces a ROOTFS_VERSION bump and a destructive
#       re-import on every PC), python (the trainer's digest is the training
#       lock's; the cloud API's 3.11 → 3.12 move is its own change),
#       eclipse-temurin (the code runner's JDK 21, test-pinned), nginx (the
#       Origin-gate behaviour was measured on 1.27.5; patches only). The Modal
#       images (nvidia/cuda, debian_slim) are declared in Python and invisible
#       to Dependabot; they move with their manual `modal deploy`.
# - Every ecosystem waits 7 days after a release before proposing it
#   (`cooldown`): a hijacked package version is usually caught and pulled
#   within days, before it would reach a PR here.
# Dependabot ALERTS still name an ignored dependency with a known
# vulnerability; the fix is then a deliberate lockstep change by hand.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /physical_ai_tools/physical_ai_manager
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: three
      - dependency-name: urdf-loader
      - dependency-name: codemirror
      - dependency-name: "@codemirror/*"
      - dependency-name: "@lezer/*"
      - dependency-name: react-icons
      - dependency-name: espree

  - package-ecosystem: pip
    directories:
      - /robotis_ai_setup/cloud_training_api
      - /robotis_ai_setup/gui
      - /robotis_ai_setup/pi_agent
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: lerobot
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: numpy
      - dependency-name: scipy
      - dependency-name: aiohttp
      - dependency-name: huggingface_hub
      - dependency-name: huggingface-hub
      - dependency-name: pyarrow
      - dependency-name: av
      - dependency-name: fastapi
      - dependency-name: httpx
      - dependency-name: uvicorn
      - dependency-name: modal
      - dependency-name: cryptography
      - dependency-name: boto3
      - dependency-name: botocore
      - dependency-name: opencv-python-headless
      - dependency-name: pythonnet

  - package-ecosystem: docker
    directories:
      - /physical_ai_tools/physical_ai_manager
      - /physical_ai_tools/physical_ai_server
      - /robotis_ai_setup/cloud_training_api
      - /robotis_ai_setup/docker/code_runner
      - /robotis_ai_setup/docker/open_manipulator
      - /robotis_ai_setup/docker/physical_ai_server
      - /robotis_ai_setup/runpod_training
      - /robotis_ai_setup/wsl_rootfs
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: robotis/ros
      - dependency-name: robotis/physical-ai-server
      - dependency-name: robotis/open-manipulator
      - dependency-name: ros
      - dependency-name: ubuntu
      - dependency-name: python
      - dependency-name: eclipse-temurin
      - dependency-name: nginx
        update-types: ["version-update:semver-minor"]
