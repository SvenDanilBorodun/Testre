# Dependabot version updates (2026-11-09).
#
# Why this file exists: a private repository loses GitHub's automatic
# dependency PRs and secret scanning, so this file, the Dependabot alerts and
# the Dependabot security updates (Settings → Advanced Security, which the owner
# turns back on after the flip) are the compensating control for
# known-vulnerable dependencies.
#
# The policy, and why it is this narrow:
# - GitHub Actions weekly, every update in ONE grouped PR, majors included.
#   Every action is pinned by commit SHA (zizmor); Dependabot moves the SHA and
#   its `# vX` comment in every workflow at once. Majors are proposed because
#   an action's major is mostly its runner runtime, and an old one ends in a
#   runtime GitHub retires; CI runs on the PR like on any other.
#   tests/test_trainer_image_shape.py compares the trainer workflow's three
#   action pins with the same actions' pins in the other workflows, never with
#   a literal, so a grouped actions PR stays green.
# - npm, pip and Docker monthly, grouped, at most 3 open PRs per ecosystem.
#   Major versions are never proposed for them: each is a migration (Blockly,
#   eslint, tailwind, vite and React majors all needed code changes here before).
# - The internet-facing cloud API stack gets PATCH releases and security fixes
#   (owner decision 2026-11-09): fastapi, httpx, uvicorn, cryptography, boto3,
#   botocore, huggingface_hub, PyJWT (the local token check, 2026-11-10) (and
#   aiohttp, which no manifest read here pins today: its pins are the server
#   Dockerfile, ci.yml and the generated training lock, so it still moves by
#   hand). Their entries ignore only minor releases; majors
#   are ignored for every pip dependency by the "*" entry. An `ignore` that
#   names `update-types` never applies to Dependabot SECURITY updates (GitHub
#   changelog 2021-05-21; dependabot-core's IgnoreCondition#ignored_versions
#   honours only `versions` for them), so a security fix still arrives as its
#   own PR, at the minimum patched version even when that is a minor or major
#   release. A bare `dependency-name` entry (every other entry below) is sent
#   as `>= 0` and blocks security updates too.
#   The accepted price: ci.yml installs the same versions by hand, so such a PR
#   is red until ci.yml's pins move in the same PR
#   (tests/test_ci_supply_chain_pins.py::CloudApiPinsFollowRequirements and
#   cloud_training_api/app/tests/test_hf_publish_real_hub.py fence it).
#   Security PRs also need the repository setting "Dependabot security updates"
#   switched on beside the alerts (Settings → Advanced Security).
# - EVERY other dependency the repository pins on purpose is ignored, because
#   a lone bump of one site breaks a lockstep the tests or CLAUDE.md enforce:
#     * Rule §5: the LeRobot pin, torch/torchvision, numpy (1.26.4 in every
#       server image), scipy (<1.18), and the generated training lock
#       (modal_training/training-lock.txt, regenerated by make_training_lock.py,
#       never edited; it is not a requirements file Dependabot reads).
#     * CI's own pins equal to the server image (ci.yml::python-tests):
#       pyarrow, av, numpy and opencv-contrib-python-headless (2026-11-10:
#       every package that job installs is pinned; pytest, pyyaml and pip are
#       test tooling in no manifest Dependabot reads, so they move by hand).
#     * modal (">=1.6,<2", reviewed by hand before any change).
#     * opencv 4.10.0.84 (the Pi agent, the server image and the Cloud-Inferenz
#       image carry the same version).
#     * pythonnet (one deliberate release candidate).
#     * three 0.184.0 + urdf-loader 0.12.7, codemirror + @codemirror/* +
#       @lezer/* (exact pins, eslint-fenced importers), react-icons (the icon
#       registry is pinned to its trees), espree 9.6.1 (the glyph fence).
#   The one exact npm pin deliberately NOT ignored (2026-11-14): the token
#   encryption's @noble/curves, @noble/hashes and @noble/ciphers. A
#   cryptography library's fixes must arrive; the grouped npm PR moves the
#   three together (curves pins hashes exactly), and the known answers in
#   hfTokenCrypto.test.js and physical_ai_server's test_hf_token_crypto.py
#   judge any bump.
#     * Base images: the ROBOTIS bases and the self-built arm64 bases
#       (base-version-guard + bump-upstream-digests.sh own them), ros, ubuntu
#       (wsl_rootfs: any change forces a ROOTFS_VERSION bump and a destructive
#       re-import on every PC), python (the trainer's digest is the training
#       lock's; the cloud API's python:3.12.x-slim digest moves by hand too),
#       eclipse-temurin (the code runner's JDK 21, test-pinned), nginx (the
#       Origin-gate behaviour was measured on 1.27.5; patches only). The Modal
#       images (nvidia/cuda, debian_slim) are declared in Python and invisible
#       to Dependabot; they move with their manual `modal deploy`.
# - Every ecosystem waits 7 days after a release before proposing a version
#   update (`cooldown`, which security updates ignore): a hijacked package
#   version is usually caught and pulled within days, before it would reach a
#   PR here.
# Dependabot ALERTS still name an ignored dependency with a known
# vulnerability; the fix is then a deliberate lockstep change by hand.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /physical_ai_tools/physical_ai_manager
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: three
      - dependency-name: urdf-loader
      - dependency-name: codemirror
      - dependency-name: "@codemirror/*"
      - dependency-name: "@lezer/*"
      - dependency-name: react-icons
      - dependency-name: espree

  - package-ecosystem: pip
    directories:
      - /robotis_ai_setup/cloud_training_api
      - /robotis_ai_setup/gui
      - /robotis_ai_setup/pi_agent
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      pip:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: lerobot
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: numpy
      - dependency-name: scipy
      - dependency-name: pyarrow
      - dependency-name: av
      - dependency-name: modal
      - dependency-name: opencv-python-headless
      - dependency-name: opencv-contrib-python-headless
      - dependency-name: pythonnet
      # The cloud API stack: patches and security fixes, never a minor (see the top).
      - dependency-name: fastapi
        update-types: ["version-update:semver-minor"]
      - dependency-name: httpx
        update-types: ["version-update:semver-minor"]
      - dependency-name: uvicorn
        update-types: ["version-update:semver-minor"]
      - dependency-name: cryptography
        update-types: ["version-update:semver-minor"]
      - dependency-name: boto3
        update-types: ["version-update:semver-minor"]
      - dependency-name: botocore
        update-types: ["version-update:semver-minor"]
      - dependency-name: huggingface_hub
        update-types: ["version-update:semver-minor"]
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-minor"]
      - dependency-name: aiohttp
        update-types: ["version-update:semver-minor"]
      - dependency-name: pyjwt
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: docker
    directories:
      - /physical_ai_tools/physical_ai_manager
      - /physical_ai_tools/physical_ai_server
      - /robotis_ai_setup/cloud_training_api
      - /robotis_ai_setup/docker/code_runner
      - /robotis_ai_setup/docker/open_manipulator
      - /robotis_ai_setup/docker/physical_ai_server
      - /robotis_ai_setup/runpod_training
      - /robotis_ai_setup/wsl_rootfs
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: robotis/ros
      - dependency-name: robotis/physical-ai-server
      - dependency-name: robotis/open-manipulator
      - dependency-name: ros
      - dependency-name: ubuntu
      - dependency-name: python
      - dependency-name: eclipse-temurin
      - dependency-name: nginx
        update-types: ["version-update:semver-minor"]
