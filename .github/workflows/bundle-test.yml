name: bundle-test

# Dispatch-only: build the OFFLINE bundle (launcher EduBotics_Setup_Full.exe +
# companion EduBotics_Setup_Full.dat) for an EXISTING image tag and upload it to
# an R2 *test* path, so the P4 Windows-rig pilot can validate the offline install
# WITHOUT cutting a production release.
#
# It reuses the real installer build (release-installer.yml) so the inner
# installer carries the CURRENT branch's load_images.ps1 / stage_bundle.ps1
# logic, then runs the SAME bundle steps as release.yml's `bundle` job — but
# writes to `test/EduBotics_Setup_Full_<tag>.{exe,dat}` (never the production
# object).
#
# Result: download BOTH of these into one folder, then double-click the .exe:
#   <R2_PUBLIC_BASE_URL>/test/EduBotics_Setup_Full_<tag>.exe
#   <R2_PUBLIC_BASE_URL>/test/EduBotics_Setup_Full_<tag>.dat
#
# This is NOT in the golden order and is never triggered by a push/tag.

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Image tag to bundle: 'latest' or 'vX.Y.Z' (must exist on Docker Hub)."
        required: false
        default: "latest"
        type: string

permissions: {}

jobs:
  # Normalise the input so the inner installer's baked versions.env tag and the
  # bundle's docker-save tag CANNOT diverge.
  prep:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      image_tag: ${{ steps.r.outputs.image_tag }}
      installer_tag: ${{ steps.r.outputs.installer_tag }}
    steps:
      - id: r
        env:
          INPUT_TAG: ${{ inputs.version_tag }}
        run: |
          REF="${INPUT_TAG:-latest}"; REF="${REF#v}"
          case "$REF" in
            [0-9]*.[0-9]*.[0-9]*) echo "image_tag=$REF" >> "$GITHUB_OUTPUT"; echo "installer_tag=v$REF" >> "$GITHUB_OUTPUT" ;;
            *)                    echo "image_tag=latest" >> "$GITHUB_OUTPUT"; echo "installer_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

  # Build the inner installer from THIS ref (current main) — carries the new
  # offline-load logic. versions.env is pinned to installer_tag. The GH-Release
  # attach inside release-installer is gated on a tag push, so a branch dispatch
  # never touches a Release.
  installer:
    name: Build inner installer
    needs: [prep]
    permissions:
      contents: write  # release-installer.yml declares it; caller must superset
    uses: ./.github/workflows/release-installer.yml
    with:
      version_tag: ${{ needs.prep.outputs.installer_tag }}
    secrets: inherit

  bundle:
    name: Build + upload TEST bundle to R2
    needs: [prep, installer]
    if: always() && needs.installer.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read   # download the inner-installer artifact from this run
    env:
      REGISTRY: nettername
      IMAGE_TAG: ${{ needs.prep.outputs.image_tag }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Checkout (installer/stub launcher source)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Preflight — is the bundle configured?
        id: pre
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          ready=true
          for f in robotis_ai_setup/installer/stub/main.c \
                   robotis_ai_setup/installer/stub/edb_payload.c \
                   robotis_ai_setup/installer/stub/edb_payload.h \
                   robotis_ai_setup/installer/stub/pack_payload.py; do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f"
              ready=false
            fi
          done
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_KEY" ]; then
            echo "::error::R2_* secrets not set."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          # bundle-test is an operator tool whose whole point is to PRODUCE a test
          # bundle, so a green run with no artifact is a footgun. Hard-fail when
          # unconfigured (unlike release.yml's bundle LEAF, which skips green).
          [ "$ready" = true ] || { echo "::error::bundle-test cannot run unconfigured (missing stub source or R2_* secrets)."; exit 1; }

      - name: Free disk space
        if: steps.pre.outputs.ready == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Docker Hub login
        if: steps.pre.outputs.ready == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download inner installer (.exe)
        if: steps.pre.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: EduBotics_Setup
          path: inner

      - name: Pull, save per image, checksum, collect digests
        if: steps.pre.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p sfx_root/images
          digests="{}"
          for repo in open-manipulator physical-ai-server physical-ai-manager; do
            ref="${REGISTRY}/${repo}:${IMAGE_TAG}"
            echo "::group::$ref"
            list_digest="$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/ {print $2; exit}')"
            if [[ ! "$list_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::bad/empty manifest-list digest for $ref: '$list_digest'"; exit 1
            fi
            docker pull "$ref"
            docker save "$ref" | gzip -1 > "sfx_root/images/${repo}.tar.gz"
            ( cd sfx_root/images && sha256sum "${repo}.tar.gz" > "${repo}.tar.gz.sha256" )
            docker image rm "$ref" >/dev/null 2>&1 || true
            digests="$(echo "$digests" | jq --arg k "$ref" --arg v "$list_digest" '. + {($k): $v}')"
            echo "::endgroup::"
          done
          echo "$digests" | jq . > sfx_root/bundled_digests.json
          cp inner/EduBotics_Setup.exe sfx_root/EduBotics_Setup.exe
          echo "── bundle size (amd64 CUDA-slimmed) ──"; du -h sfx_root/images/*.tar.gz; du -sh sfx_root
          cat sfx_root/bundled_digests.json; df -h /

      - name: Build launcher + pack payload (two-file offline bundle)
        if: steps.pre.outputs.ready == 'true'
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            sudo apt-get update && \
              sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 && break
            echo "apt-get retry $i/3"; sleep $((i * 5))
          done
          ( cd robotis_ai_setup/installer/stub && \
            x86_64-w64-mingw32-windres launcher.rc launcher_res.o )
          x86_64-w64-mingw32-gcc -O2 -municode -mwindows -std=c11 \
            -finput-charset=UTF-8 -fwide-exec-charset=UTF-16LE \
            -o EduBotics_Setup_Full.exe \
            robotis_ai_setup/installer/stub/main.c \
            robotis_ai_setup/installer/stub/edb_payload.c \
            robotis_ai_setup/installer/stub/launcher_res.o \
            -lcomctl32 -lshell32 -luser32 -lkernel32
          file EduBotics_Setup_Full.exe | grep -q 'PE32+ executable .*x86-64' \
            || { echo "::error::launcher is not a 64-bit Windows PE"; exit 1; }
          python3 robotis_ai_setup/installer/stub/pack_payload.py pack \
            sfx_root EduBotics_Setup_Full.dat
          ls -lh EduBotics_Setup_Full.exe EduBotics_Setup_Full.dat

      - name: Upload TEST bundle to R2 (multipart) + verify
        if: steps.pre.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          upload() {  # $1 = local file, $2 = R2 key
            aws s3 cp "$1" "s3://${R2_BUCKET}/$2" \
              --endpoint-url "$endpoint" \
              --content-type application/octet-stream \
              --content-disposition "attachment; filename=$(basename "$2")"
          }
          exe_key="test/EduBotics_Setup_Full_${IMAGE_TAG}.exe"
          dat_key="test/EduBotics_Setup_Full_${IMAGE_TAG}.dat"
          upload EduBotics_Setup_Full.exe "$exe_key"
          upload EduBotics_Setup_Full.dat "$dat_key"
          aws s3api head-object --bucket "$R2_BUCKET" --key "$exe_key" --endpoint-url "$endpoint"
          aws s3api head-object --bucket "$R2_BUCKET" --key "$dat_key" --endpoint-url "$endpoint"
          echo "TEST bundle ready for P4 — download BOTH into one folder, run the .exe:"
          echo "  ${R2_PUBLIC_BASE_URL:-<R2_PUBLIC_BASE_URL>}/${exe_key}"
          echo "  ${R2_PUBLIC_BASE_URL:-<R2_PUBLIC_BASE_URL>}/${dat_key}"
