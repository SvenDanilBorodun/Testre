name: CI

# Triggered on every push + PR to main. Runs Python unit tests, syntax-
# checks every shell + compose file, and validates that the overlay
# patch script's regex still matches upstream shape.
#
# Does NOT build images or run the full docker-compose (needs privileged
# + hardware). That still happens on the maintainer's workstation via
# `robotis_ai_setup/docker/build-images.sh`, but CI catches drift early.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # PR force-pushes should cancel the in-flight run for that PR; main
  # pushes can't be cancelled because there's no PR number in the key
  # (each main push gets its own unique group via github.ref), and we
  # need every main push's CI result for the merge ledger.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # pyyaml: the validator jobs below. numpy + opencv-contrib-python-headless
          # + pytest: the Roboter Studio workflow/IK test suite (pure-Python, no
          # ROS — the workflow modules import pupil_apriltags/rclpy lazily;
          # calibration uses cv2.aruco which is the contrib build; headless
          # avoids GUI libs on the runner).
          python -m pip install pyyaml pytest numpy opencv-contrib-python-headless
      - name: Syntax-check Python modules
        # ZERO-FILE FLOOR, the repo's standing rule for scan-based guards (the
        # four ps_* guards and the three lockstep tests all carry one).
        # `compileall` prints "Can't list <dir>" and still exits 0, so a renamed
        # or moved root made this step vacuously green — it would report success
        # having compiled nothing. Every root is asserted to exist and to hold at
        # least one .py BEFORE compileall runs, so the failure names the root
        # instead of appearing as a later, unrelated import error.
        run: |
          set -euo pipefail
          ROOTS=(
            robotis_ai_setup/gui
            robotis_ai_setup/scripts
            robotis_ai_setup/pi_agent
            robotis_ai_setup/cloud_training_api
            robotis_ai_setup/modal_training
            physical_ai_tools/physical_ai_server/physical_ai_server
            robotis_ai_setup/docker/physical_ai_server/patches
          )
          for root in "${ROOTS[@]}"; do
            if [ ! -d "$root" ]; then
              echo "::error::compileall root '$root' does not exist — renamed or moved?"
              exit 1
            fi
            n=$(find "$root" -name '*.py' -type f | wc -l)
            if [ "$n" -eq 0 ]; then
              echo "::error::compileall root '$root' contains no .py files"
              exit 1
            fi
            echo "$root: $n .py files"
          done
          python -m compileall -q "${ROOTS[@]}"
      - name: Unit tests
        run: |
          cd robotis_ai_setup
          python -m unittest discover -s tests -v

      - name: Cloud API unit tests (workgroups + dataset sweep + jetson)
        # Tests stub fastapi/supabase/huggingface_hub via sys.modules so
        # they run without the heavy deps. They cover the workgroup
        # helper, dataset-sweep parsers, audit-table fallback logic,
        # and (migration 019) the jetson route helpers + lock sweeper.
        # Integration tests against a real Supabase branch are a
        # follow-up when test infrastructure is in place — see plan
        # Part 5 §3 (concurrency check).
        run: |
          cd robotis_ai_setup/cloud_training_api
          # Inject env required by app/main.py's startup validators
          # (validates these are set, but the test target doesn't import
          # main.py so this is just defensive consistency).
          export SUPABASE_URL=http://ci.test
          export SUPABASE_SERVICE_ROLE_KEY=ci_test
          export MODAL_TOKEN_ID=ci_test
          export MODAL_TOKEN_SECRET=ci_test
          python -m unittest discover -s app/tests -v

      - name: Jetson agent unit tests (migration 019 client side)
        # Cross-platform — every subprocess/socket/Cloud-API call is
        # mocked, so this runs on the same ubuntu-latest runner as the
        # rest. Catches regressions in the F67/F68/F69 auto-pull port,
        # the docker manifest parsing, and the compose image discovery.
        run: |
          cd robotis_ai_setup/jetson_agent
          python -m unittest discover -s tests -v

      - name: Orange Pi agent unit tests (Phase 2 host-side lifecycle)
        # Cross-platform — every subprocess/docker/socket/HTTP call is
        # mocked (deps-free), so this runs on the same ubuntu-latest runner
        # as the rest. Covers the pi_agent port of the GUI config-generator
        # + docker-manager (ARM64 digest pre-check, targeted robot-tier
        # lifecycle, no-`compose down` rule) and the management HTTP API
        # (arm-scan / camera roles / Host+Origin allowlist / netzwerk-check).
        # pi_agent/tests has NO __init__.py — it follows the GUI-tests
        # convention (each test file does its own sys.path.insert of
        # robotis_ai_setup, then imports via the `pi_agent.` package), which is
        # why `discover` works here without a package marker. (jetson_agent/tests
        # DOES have __init__.py; pi_agent deliberately does not.)
        run: |
          cd robotis_ai_setup/pi_agent
          python -m unittest discover -s tests -v

      - name: Roboter Studio workflow + IK unit tests (pure-Python, no ROS)
        # numpy + opencv only (workflow modules import ROS/onnx/pupil lazily).
        # Covers the closed-form IK round-trip + base_yaw, the AprilTag
        # tag-pose/yaw math (the SOLE automated guard for the orientation chain —
        # the IK self-check is position-only), the object catalog schema, the
        # motion/named-object grasp handlers, calibration, projection, the
        # interpreter, and the trajectory builder. These are pytest-style
        # (monkeypatch/tmp_path/pytest.approx fixtures), so this is a pytest run,
        # NOT unittest discover. Previously this dir was compileall-checked only.
        run: |
          cd physical_ai_tools/physical_ai_server
          python -m pytest test/ -q

  shell-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          # Lint every *.sh file but tolerate known upstream shell quirks
          # via -e. Fail the job on error-level findings only.
          shellcheck -S error \
            robotis_ai_setup/docker/build-images.sh \
            robotis_ai_setup/docker/open_manipulator/entrypoint_omx.sh \
            robotis_ai_setup/wsl_rootfs/build_rootfs.sh \
            robotis_ai_setup/wsl_rootfs/start-dockerd.sh \
            robotis_ai_setup/jetson_agent/setup.sh \
            robotis_ai_setup/pi_agent/setup.sh \
            robotis_ai_setup/pi_agent/systemd/edubotics-pi-firstboot.sh \
            physical_ai_tools/physical_ai_manager/scripts/railway-deploy.sh

  rootfs-version-guard:
    # The installer's upgrade gate (import_edubotics_wsl.ps1 +
    # robotis_ai_setup.iss::ShouldImportDistro, 2026-06-05) skips the
    # destructive distro re-import when wsl_rootfs/ROOTFS_VERSION matches
    # the marker baked into the existing distro. A rootfs change shipped
    # WITHOUT a version bump would therefore never install on upgrades —
    # the inverse failure of the silent-volume-wipe bug the gate fixed.
    # Fail any change under wsl_rootfs/ that doesn't touch ROOTFS_VERSION.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assert ROOTFS_VERSION bumped when wsl_rootfs/ changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # First push to a branch / rewritten history: fall back to the
          # parent commit, or the empty tree for a single-commit repo.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          # Exclude *.md: docs under wsl_rootfs/ (README.md) are maintainer notes
          # that do NOT ship in the rootfs tarball, so a doc-only edit must not
          # force a ROOTFS_VERSION bump (which would trigger a destructive distro
          # re-import on every student's upgrade). Only rootfs CONTENT needs a bump.
          CHANGED="$(git diff --name-only "$BASE" HEAD -- robotis_ai_setup/wsl_rootfs/ | grep -v 'ROOTFS_VERSION$' | grep -viE '\.md$' || true)"
          BUMPED="$(git diff --name-only "$BASE" HEAD -- robotis_ai_setup/wsl_rootfs/ROOTFS_VERSION || true)"
          if [ -n "$CHANGED" ] && [ -z "$BUMPED" ]; then
            echo "::error::wsl_rootfs/ changed without bumping ROOTFS_VERSION — the installer upgrade gate would skip shipping the new rootfs:"
            echo "$CHANGED"
            exit 1
          fi
          echo "rootfs-version-guard OK"

  base-version-guard:
    # The self-built server BASE images are NOT built by CI. No workflow sets
    # BUILD_BASE_ARM64 or BUILD_BASE_OPI — a maintainer hand-builds each base
    # once (`BUILD_BASE_OPI=1 PLATFORM=opi ./build-images.sh`) and pushes it,
    # and every CI build thereafter just resolves the already-PUBLISHED tag
    # pinned in build-images.sh via `docker manifest inspect`.
    #
    # So editing Dockerfile.arm64cpu / Dockerfile.arm64 does nothing on its own
    # — and does it QUIETLY. The release goes green while shipping the previous
    # base, and the edit looks landed because the file is in git. Rule §5 sends
    # people into exactly these files to bump LeRobot pins, which is what makes
    # the trap load-bearing rather than theoretical. It is the same failure
    # shape rootfs-version-guard fences (a change that can never reach a rig),
    # so it gets the same fence: if a base Dockerfile changed materially, the
    # tag identifying its published image must move in the same commit.
    #
    # COMMENT-ONLY edits are exempt on purpose. They cannot change the built
    # image, and demanding a ~30-minute base rebuild + republish to land a
    # comment fix is how a guard earns a reputation for being worth routing
    # around. The diff below is filtered to added/removed lines that are
    # neither blank nor pure `#` comments.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assert a self-built base tag moves with its base Dockerfile
        # Env indirection rather than inline ${{ }} in the run block (zizmor
        # template-injection); all three are runner-provided, not user text.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi
          # First push to a branch / rewritten history: fall back to the parent
          # commit, or the empty tree for a single-commit repo (mirrors
          # rootfs-version-guard).
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi

          BUILD_SH=robotis_ai_setup/docker/build-images.sh

          # True iff the file has >=1 added/removed line that is neither blank
          # nor a pure comment. -U0 keeps context lines out of the diff; the
          # +++/--- headers are dropped explicitly. Results are captured into a
          # variable rather than piped into `grep -q`: -q exits early, which
          # SIGPIPEs the upstream sed, which under `pipefail` would return 141
          # and invert the answer.
          #
          # The header filter matches the FULL header shape (`--- a/…`,
          # `+++ b/…`, `--- /dev/null`), not just a `---`/`+++` prefix. A bare
          # prefix also eats a real deleted line whose own text begins with
          # `-- ` at column 0 — git renders that as `--- <text>` — which would
          # let the guard wave through a Dockerfile edit as "no code change".
          # No such line exists in either base Dockerfile today; this keeps the
          # guard from quietly acquiring the blind spot it exists to prevent.
          has_code_change() {
            local changed
            changed="$(git diff -U0 "$BASE" HEAD -- "$1" \
              | grep -E '^[+-]' \
              | grep -Ev '^(--- (a/|/dev/null)|\+\+\+ (b/|/dev/null))' \
              | sed -E 's/^[+-]//' \
              | grep -Ev '^[[:space:]]*(#.*)?$' || true)"
            [ -n "$changed" ]
          }

          # The tag pinned for a base repo, read out of build-images.sh at a
          # given ref. Empty when the assignment is absent/renamed.
          pin_tag() {
            git show "$1:$BUILD_SH" 2>/dev/null \
              | sed -nE "s|^[[:space:]]*PAS_BASE_IMAGE=.*/$2:([A-Za-z0-9._-]+).*|\1|p" \
              | head -1
          }

          # True iff the pinned tag VALUE actually differs between BASE and HEAD.
          # Comparing the value — not "was the pin line touched" — is deliberate:
          # a `grep '^+.*PAS_BASE_IMAGE'` is satisfied by any cosmetic edit to
          # that line (a trailing comment, a reflow), which would wave through the
          # exact mistake this guard exists to catch. An EMPTY `after` (the
          # assignment was renamed or deleted) reports as "not moved" so the check
          # below fails loudly rather than silently passing.
          pin_moved() {
            local before after
            before="$(pin_tag "$BASE" "$1")"
            after="$(pin_tag HEAD "$1")"
            [ -n "$after" ] && [ "$before" != "$after" ]
          }

          rc=0
          check() {
            local dockerfile="$1" base_repo="$2" rebuild_cmd="$3"
            if ! has_code_change "$dockerfile"; then
              echo "OK: ${dockerfile} — no non-comment changes, nothing to enforce."
              return 0
            fi
            if pin_moved "$base_repo"; then
              echo "OK: ${dockerfile} changed AND its ${base_repo} pin moved."
              return 0
            fi
            echo "::error file=${dockerfile}::${dockerfile} changed, but the ${base_repo} tag in ${BUILD_SH} did not. This base is NOT built by CI — the build resolves the tag already published in the registry, so your edit would ship NOTHING while the release still goes green. Rebuild and push the base with '${rebuild_cmd}', then bump PAS_BASE_IMAGE to the new tag in this same commit. Comment-only edits are exempt."
            rc=1
          }

          check physical_ai_tools/physical_ai_server/Dockerfile.arm64cpu \
                physical-ai-server-opi-base \
                'BUILD_BASE_OPI=1 PLATFORM=opi ./build-images.sh'
          check physical_ai_tools/physical_ai_server/Dockerfile.arm64 \
                physical-ai-server-jetson-base \
                'BUILD_BASE_ARM64=1 PLATFORM=arm64 ./build-images.sh'

          [ "$rc" = "0" ] || exit 1
          echo "base-version-guard OK"

  powershell-encoding:
    # Windows PowerShell 5.1 (the default shell on Win10/Win11 used by the
    # installer's [Run] steps) decodes .ps1 files using the system code page
    # (CP1252 on German Windows) UNLESS a UTF-8 BOM is present. The student
    # PCs run German Windows, and the German UI strings + em-dashes in our
    # scripts are multi-byte UTF-8. Without a BOM, the parser sees mojibake
    # and chokes with "Die schließende '}' fehlt im Anweisungsblock" — the
    # exact failure mode that broke the v2.3.4 "usbipd reparieren" flow
    # because bind_devices.ps1 + configure_usbipd.ps1 shipped sans BOM.
    #
    # PowerShell 7.x (pwsh) defaults to UTF-8 even without BOM, but we cannot
    # assume pwsh on student PCs — they run the bundled Windows PowerShell.
    # Enforce BOM here so the regression cannot recur.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Assert every .ps1 file has a UTF-8 BOM
        run: |
          fail=0
          while IFS= read -r f; do
            head -c 3 "$f" | od -An -tx1 | tr -d ' \n' > /tmp/bom_check
            actual=$(cat /tmp/bom_check)
            if [ "$actual" != "efbbbf" ]; then
              echo "::error file=$f::PowerShell script missing UTF-8 BOM (first 3 bytes: $actual). Windows PowerShell 5.1 will mis-decode non-ASCII chars on student PCs."
              fail=1
            fi
          done < <(find robotis_ai_setup physical_ai_tools -name '*.ps1' -type f)
          if [ "$fail" -eq 1 ]; then
            echo
            echo "Fix locally with:"
            echo "  for f in <missing.ps1>; do"
            echo "    tmp=\"\$f.bomtmp\""
            echo "    printf '\\xEF\\xBB\\xBF' > \"\$tmp\""
            echo "    cat \"\$f\" >> \"\$tmp\""
            echo "    mv \"\$tmp\" \"\$f\""
            echo "  done"
            exit 1
          fi

  powershell-native-stderr:
    # Windows PowerShell 5.1 promotes a NATIVE command's stderr to a TERMINATING
    # NativeCommandError under a file-level $ErrorActionPreference='Stop' — for
    # every redirection form (2>&1, 2>$null, *>$null), and EVEN ON SUCCESS
    # (`docker info` prints "WARNING: No swap limit support" to stderr on a healthy
    # daemon; `docker image inspect <missing>` prints "No such image"). That
    # silently aborted the offline installer: import_edubotics_wsl.ps1's
    # dockerd-readiness poll threw on iteration 1, the import "failed", and Inno
    # skipped the offline `docker load` (the 2026-06-09 pilot bug). The proven-safe
    # pattern is EAP=Continue + explicit $LASTEXITCODE checks (verify_system.ps1).
    # This guard rejects any .ps1 that pairs a file-level EAP=Stop with a native
    # wsl/docker call whose stderr is captured. Static text lint → Linux, no Win rig.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Lint installer .ps1 for native-stderr-under-EAP=Stop
        run: python3 .github/scripts/ps_native_stderr_lint.py

  powershell-install-guards:
    # The four ps_* install-hardening guards, run DIRECTLY so their
    # `::error file=…,line=…` / `::warning` annotations land on the diff.
    #
    # They are also exercised by python-tests via
    # tests/test_ps_guard_scripts.py::TestGuardsCleanOnRealTree — but that path
    # runs them under subprocess.run(capture_output=True), which swallows every
    # annotation: a failure showed up only as "returncode != 0" inside a unittest
    # traceback, with no line marked in the PR. And ps_temp_path_normalize_lint
    # is ADVISORY (exit 0 with ::warning), so before this job its findings
    # reached nothing at all — no workflow referenced it.
    #
    # Both paths are kept on purpose: this job surfaces findings on the real
    # tree, the unittest pins the guards' BEHAVIOUR against synthetic fixtures
    # (the true-positive each was written for). A guard that only ever runs
    # against a green tree is not tested — ps_cleanup_exit_guard silently could
    # not catch its own documented regression for exactly that reason.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Readiness-probe retry guard (F3)
        run: python3 .github/scripts/ps_readiness_retry_lint.py
      - name: TEMP-path cmdlet try/catch guard (F2)
        run: python3 .github/scripts/ps_temp_cmdlet_lint.py
      - name: Cleanup exit-code fall-through guard
        run: python3 .github/scripts/ps_cleanup_exit_guard.py
      - name: TEMP-path construction advisory (warnings only)
        # Advisory: exits 0 on findings. Its ONE non-zero path is "scanned 0
        # .ps1 files", which is a configuration failure, not a finding.
        run: python3 .github/scripts/ps_temp_path_normalize_lint.py

  compose-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Assert .s6-keep mount target exists
        # Audit H29: compose mounts physical_ai_server/.s6-keep as an
        # RO bind. The file enables the s6 longrun service inside the
        # base image; deleting it accidentally would silently mean the
        # ROS node never starts (container reports healthy via the TCP
        # 9090 check but rosbridge is dead). docker compose config
        # validates structure, not bind-mount targets — so we assert it
        # exists explicitly here.
        run: |
          test -f robotis_ai_setup/docker/physical_ai_server/.s6-keep \
            || { echo "::error::.s6-keep missing — removing it disables the ROS node inside the container"; exit 1; }
      - name: docker compose config
        run: |
          cd robotis_ai_setup/docker
          # Feed fake .env values so variable substitution doesn't fail;
          # we only care about YAML + service-shape validation.
          cat > .env <<'EOF'
          FOLLOWER_PORT=/dev/ttyACM0
          LEADER_PORT=/dev/ttyACM1
          CAMERA_DEVICE_1=/dev/video0
          CAMERA_NAME_1=gripper
          CAMERA_DEVICE_2=/dev/video2
          CAMERA_NAME_2=scene
          ROS_DOMAIN_ID=30
          REGISTRY=nettername
          EOF
          docker compose --env-file .env config > /dev/null
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.gpu.yml config > /dev/null
      - name: Assert manager healthcheck uses 127.0.0.1 (not localhost)
        # Audit 2026-05-23: nginx:alpine's busybox wget resolves
        # `localhost` to ::1 first (NSS hosts file order) and does not
        # fall back to IPv4. nginx in the manager image listens IPv4-only,
        # so a `wget http://localhost/...` healthcheck always returns
        # "Connection refused" → perpetual unhealthy state that masks
        # real failures. Lock this against future regression — see
        # robotis_ai_setup/docker/docker-compose.yml::physical_ai_manager
        # healthcheck for the full rationale.
        run: |
          if ! grep -q '127\.0\.0\.1/version\.json' \
               robotis_ai_setup/docker/docker-compose.yml ; then
            echo "::error::physical_ai_manager healthcheck must use 127.0.0.1/version.json, not localhost"
            exit 1
          fi
          if grep -q 'localhost/version\.json' \
                 robotis_ai_setup/docker/docker-compose.yml ; then
            echo "::error::physical_ai_manager healthcheck still references localhost — busybox wget AAAA-first regression"
            exit 1
          fi
      - name: docker compose config (Jetson)
        # Migration 019: the Jetson agent ships its own compose file.
        # Same kind of validation — parses YAML, expands env, asserts
        # service-shape. The Jetson compose has no GPU layer because
        # the Orin Nano's integrated GPU goes through `runtime: nvidia`
        # which the YAML declares directly.
        run: |
          cd robotis_ai_setup/jetson_agent
          cat > .env <<'EOF'
          REGISTRY=nettername
          EDUBOTICS_HF_TOKEN=ci_test
          ROS_DOMAIN_ID=42
          EOF
          docker compose --env-file .env -f docker-compose.jetson.yml config > /dev/null
      - name: docker compose config (Orange Pi)
        # Phase 2: the Orange Pi 5 Pro agent ships a THIRD compose file — a
        # three-way merge of the student + Jetson composes plus the always-on
        # physical-ai-manager-opi service. It lives in the SAME docker/
        # directory as the student compose, so its ./physical_ai_server/.s6-keep
        # bind and the .env-driven references resolve exactly as the student
        # file does. Native ARM64: no `runtime: nvidia`, no GPU layer. Same
        # kind of validation — parse YAML, expand env, assert service-shape.
        # Feed a fake .env with the opi-specific keys (BIND_HOST / subnet /
        # gateway / follower flag) so substitution doesn't warn.
        run: |
          cd robotis_ai_setup/docker
          cat > .env.opi <<'EOF'
          FOLLOWER_PORT=/dev/ttyACM0
          LEADER_PORT=/dev/ttyACM1
          CAMERA_DEVICE_1=/dev/video0
          CAMERA_NAME_1=gripper
          CAMERA_DEVICE_2=/dev/video2
          CAMERA_NAME_2=scene
          ROS_DOMAIN_ID=30
          REGISTRY=nettername
          EDUBOTICS_BIND_HOST=0.0.0.0
          EDUBOTICS_ROS_NET_SUBNET=172.28.0.0/24
          EDUBOTICS_ROS_NET_GATEWAY=172.28.0.1
          EDUBOTICS_FOLLOWER_ONLY=0
          EOF
          docker compose --env-file .env.opi -f docker-compose.opi.yml config > /dev/null
      - name: Assert opi compose binds .s6-keep + manager healthcheck uses 127.0.0.1
        # The same two structural invariants as the student file, re-asserted
        # against the opi compose (docker compose config validates shape, not
        # bind-mount targets or healthcheck semantics):
        #   (1) the ./physical_ai_server/.s6-keep RO bind must be present, or
        #       the ROS node never starts while the container reports healthy
        #       (the TCP 9090 healthcheck passes but rosbridge is dead);
        #   (2) the physical-ai-manager-opi healthcheck must hit
        #       127.0.0.1/version.json — busybox wget resolves `localhost` to
        #       ::1 first and nginx listens IPv4-only → perpetual unhealthy.
        run: |
          if ! grep -q '\.s6-keep' \
               robotis_ai_setup/docker/docker-compose.opi.yml ; then
            echo "::error::docker-compose.opi.yml must bind ./physical_ai_server/.s6-keep — removing it disables the ROS node inside the container"
            exit 1
          fi
          if ! grep -q '127\.0\.0\.1/version\.json' \
               robotis_ai_setup/docker/docker-compose.opi.yml ; then
            echo "::error::physical-ai-manager-opi healthcheck must use 127.0.0.1/version.json, not localhost"
            exit 1
          fi
          if grep -q 'localhost/version\.json' \
                 robotis_ai_setup/docker/docker-compose.opi.yml ; then
            echo "::error::physical-ai-manager-opi healthcheck still references localhost — busybox wget AAAA-first regression"
            exit 1
          fi
      - name: docker compose config (Orange Pi — the copy that SHIPS)
        # WP-0: robotis_ai_setup/pi_agent/docker/docker-compose.opi.yml is a
        # byte-identical twin of the file validated above, and it is the copy
        # that actually reaches a fielded Pi — the release tarball packages
        # `pi_agent/` alone and the agent's self-update rsyncs `pi_agent/`
        # alone, so before the twin existed a compose change could never leave
        # the repo. The agent byte-compares the installed copy against this one
        # and repairs it (agent.py::_compose_drifted / _renew_compose), behind
        # its own `docker compose config -q` gate — a file that fails to parse
        # is REFUSED on the Pi, which would leave the fleet permanently
        # bannered on an un-appliable release. So validate the shipped copy
        # here too: pi-compose-twin-guard proves the two are equal, this proves
        # the one that ships is valid on its own terms. Relative bind-mount
        # targets are not resolved by `config`, so the twin's directory needing
        # no physical_ai_server/ sibling is fine (measured).
        #
        # The fake .env is written OUTSIDE the twin's directory, unlike the
        # steps above: that directory is packaged verbatim into the release
        # tarball, so nothing may ever be created inside it — a step that failed
        # between the write and a cleanup would leave a stray file in a shipped
        # tree.
        run: |
          envfile="$(mktemp)"
          cat > "$envfile" <<'EOF'
          FOLLOWER_PORT=/dev/ttyACM0
          LEADER_PORT=/dev/ttyACM1
          CAMERA_DEVICE_1=/dev/video0
          CAMERA_NAME_1=gripper
          CAMERA_DEVICE_2=/dev/video2
          CAMERA_NAME_2=scene
          ROS_DOMAIN_ID=30
          REGISTRY=nettername
          EDUBOTICS_BIND_HOST=0.0.0.0
          EDUBOTICS_ROS_NET_SUBNET=172.28.0.0/24
          EDUBOTICS_ROS_NET_GATEWAY=172.28.0.1
          EDUBOTICS_FOLLOWER_ONLY=0
          EOF
          docker compose --env-file "$envfile" \
            -f robotis_ai_setup/pi_agent/docker/docker-compose.opi.yml config > /dev/null
          rm -f "$envfile"

  pi-compose-twin-guard:
    # WP-0. `robotis_ai_setup/docker/docker-compose.opi.yml` is the SOURCE OF
    # TRUTH (what compose-validate validates, what setup.sh installs from a
    # source checkout, what every doc points at).
    # `robotis_ai_setup/pi_agent/docker/docker-compose.opi.yml` is the twin that
    # rides the release tarball, because the tarball packages `pi_agent/` alone
    # and the agent self-update rsyncs `pi_agent/` alone — it is the ONLY route
    # a compose change has to a fielded Orange Pi.
    #
    # A divergence is worse than the bug it replaced. Today a stale fielded
    # compose at least fails loudly at „Umgebung starten"; a drifted twin would
    # have the agent CONFIRM in German that it renewed the compose, having
    # written the wrong file. Nothing downstream could catch it: the agent's own
    # `docker compose config -q` gate proves the twin is VALID, not that it is
    # CURRENT. So the equality is fenced here, on every push, and again on the
    # built artifact in release.yml::pi-agent-tarball.
    #
    # A twin is used rather than a symlink because the delivery path is `tar`
    # (which would package the link, not the bytes) and `install -m 0644`, and
    # rather than a release-time copy because the versions.env precedent shows
    # generated files are easy to forget and impossible for a source reader to
    # see. `cmp` is what makes the duplication safe.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Assert the shipped pi_agent compose twin is byte-identical
        run: |
          set -euo pipefail
          pkg=robotis_ai_setup/pi_agent
          src=robotis_ai_setup/docker/docker-compose.opi.yml
          # The twin's path is DERIVED from the agent's own
          # SHIPPED_COMPOSE_RELPATH, never restated here. Same rule
          # release.yml::pi-agent-tarball already follows for SYSTEMD_UNIT_NAMES
          # / UDEV_RULE_NAMES, and its comment gives the reason verbatim: "a
          # second hardcoded list is a second thing to keep in sync, and a name
          # drifting out of sync is precisely the failure this gate exists to
          # catch." It bites harder here than it looks: the agent RESOLVES the
          # twin off that constant (agent.py::_shipped_compose_path), so a gate
          # pinned to a stale literal would fence a file nothing reads — green,
          # while the file every fielded Pi is repaired ONTO ships unchecked.
          #
          # Written to a FILE rather than captured in $( ): an ::error:: printed
          # inside a command substitution is CAPTURED, so the step would die with
          # a bare non-zero and no reason (the same lesson release.yml's derived
          # member list records).
          relfile="$(mktemp)"
          if ! python3 .github/scripts/pi_shipped_compose_relpath.py \
                 "${pkg}/constants.py" > "$relfile"; then
            echo "::error file=${pkg}/constants.py::could not derive SHIPPED_COMPOSE_RELPATH — see the diagnostic above"
            exit 1
          fi
          twin="${pkg}/$(cat "$relfile")"
          rm -f "$relfile"
          echo "Twin path derived from ${pkg}/constants.py: ${twin}"
          test -f "$twin" || {
            echo "::error file=${twin}::missing — without it no compose change in this release can reach a fielded Orange Pi (the release tarball and the agent self-update both carry pi_agent/ only)"
            exit 1
          }
          if ! cmp -s "$src" "$twin"; then
            echo "::error file=${twin}::differs from ${src} — the agent would repair every fielded Pi ONTO this file, so a stale twin silently ships stale orchestration while reporting success. Copy the source of truth over it:"
            echo "    cp ${src} ${twin}"
            diff -u "$src" "$twin" | head -60 || true
            exit 1
          fi
          echo "OK: ${twin} is byte-identical to ${src}"

  env-forwarding-guard:
    # Every EDUBOTICS_* env var referenced by a shipped source must be
    # forwarded by SOME shipped compose file. Without this guard the
    # 2026-05 raw_mjpeg-override bug recurs: the entrypoint reads an env
    # var that compose never injected into the container, the operator's
    # `.env` change is silently a no-op, and students hit the entrypoint's
    # hardcoded default forever. See finding #1 in the 2026-05-22 audit.
    #
    # READ THE SCOPE CAREFULLY — it is weaker than it looks, and the gap is
    # not theoretical. "Forwarded" is a UNION over all four compose files
    # (see the `forwarded=` grep below), reduced with `comm`. So this job
    # proves a key is forwarded SOMEWHERE. It cannot see:
    #   * a key present on ONE target only — the student compose satisfies
    #     it for the Orange Pi and the Jetson alike; and
    #   * a key on the WRONG SERVICE of the right file — compose injects a
    #     variable only into the service whose `environment:` lists it.
    # Both shipped at once: EDUBOTICS_ROBOT_TYPE sat on the opi compose but
    # only under `physical_ai_server`, so an Orange Pi's arm container never
    # saw the variable `entrypoint_omx.sh` branches on and ran the OMX
    # Dynamixel bringup against a Feetech bus, while the five
    # EDUBOTICS_EDU6_* rollback knobs reached a Pi not at all — with this
    # job green throughout (measured).
    #
    # Per-TARGET, per-SERVICE completeness is `compose-env-parity`'s job,
    # below. Neither replaces the other: this one is keyed off what the
    # SOURCES read (so a new env name cannot be forgotten by every compose at
    # once), that one is keyed off what the student compose FORWARDS (so the
    # Pi cannot fall behind Windows). Widening this one to per-file would
    # demand a Jetson parity audit nobody has scoped — hence the split.
    #
    # KNOWN RESIDUAL of that split, measured: a name forwarded ONLY by the
    # Jetson or gpu compose satisfies this job (it is in the union) AND
    # compose-env-parity (absent from student and opi alike, so they agree).
    # Such a key reaches neither Windows nor the Pi. Nothing today is in that
    # state; closing it means gating the Jetson, i.e. that audit.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Assert every EDUBOTICS_* in entrypoints + overlays is in compose
        run: |
          set -euo pipefail
          # Scan entrypoint shell scripts AND overlay Python modules for
          # any "EDUBOTICS_FOO..." reference. Extended 2026-05-23 to
          # include the physical_ai_server + open_manipulator overlay
          # trees — those modules read `os.environ.get('EDUBOTICS_*')`
          # at module import time, so a missing compose-forward leaves
          # the operator's .env override invisible to the container in
          # exactly the same way as a missing entrypoint forward did
          # in the 2026-05 raw_mjpeg-override regression.
          referenced=$(
            grep -rhoE 'EDUBOTICS_[A-Z0-9_]+' \
                --exclude-dir=__pycache__ \
                --include='*.py' --include='*.sh' \
                robotis_ai_setup/docker/open_manipulator/entrypoint_omx.sh \
                robotis_ai_setup/docker/open_manipulator/camera_ingest_node.py \
                robotis_ai_setup/docker/open_manipulator/edu6_arm_node.py \
                robotis_ai_setup/docker/open_manipulator/feetech_bus.py \
                robotis_ai_setup/wsl_rootfs/start-dockerd.sh \
                physical_ai_tools/physical_ai_server/physical_ai_server \
                robotis_ai_setup/docker/open_manipulator/overlays \
              2>/dev/null \
              | sort -u
          )
          if [ -z "$referenced" ]; then
            echo "No EDUBOTICS_* references found — guard is vacuously green."
            exit 0
          fi
          # The same names must appear on the LEFT of an `=` inside any
          # `environment:` list in any compose file we ship. This is a
          # UNION across the four files and it is deliberately NOT
          # per-target: a name reaching only one compose passes here. See
          # the job comment — `compose-env-parity` is the per-target check.
          # Uses POSIX [[:space:]] for portability across GNU + BSD sed.
          forwarded=$(
            grep -hoE '^[[:space:]]*-[[:space:]]*EDUBOTICS_[A-Z0-9_]+=' \
                robotis_ai_setup/docker/docker-compose.yml \
                robotis_ai_setup/docker/docker-compose.gpu.yml \
                robotis_ai_setup/docker/docker-compose.opi.yml \
                robotis_ai_setup/jetson_agent/docker-compose.jetson.yml \
              2>/dev/null \
              | sed -E 's/^[[:space:]]*-[[:space:]]*//;s/=.*//' \
              | sort -u
          )
          missing=$(comm -23 <(echo "$referenced") <(echo "$forwarded"))
          if [ -n "$missing" ]; then
            echo "::error::The following EDUBOTICS_* env vars are read by entrypoint scripts but NOT forwarded by ANY compose file:"
            echo "$missing" | sed 's/^/  - /'
            echo
            echo "Add each missing key to the relevant service's 'environment:' list with a sensible default."
            exit 1
          fi
          echo "All EDUBOTICS_* env vars are forwarded by at least one compose file"
          echo "(per-target, per-service parity is compose-env-parity's job):"
          echo "$referenced" | sed 's/^/  OK /'

  compose-env-parity:
    # The per-TARGET, per-SERVICE half that `env-forwarding-guard` above
    # structurally cannot provide: it unions all four compose files, so a
    # key present on one target satisfies it for every target, and a key on
    # the wrong service of the right file satisfies it too. Both happened at
    # once and shipped — an Orange Pi ran the OMX Dynamixel bringup against
    # a Feetech bus because EDUBOTICS_ROBOT_TYPE was on the opi compose but
    # only under `physical_ai_server`. Two verifiers MEASURED that the union
    # guard stays green with all six keys deleted from the opi compose.
    #
    # Compares docker-compose.yml against docker-compose.opi.yml service by
    # service. The Jetson compose is deliberately NOT a target (a smaller,
    # legitimately different product surface); the shipped pi_agent twin is
    # deliberately not re-checked (byte-identical, already fenced by
    # pi-compose-twin-guard here and by release.yml::pi-agent-tarball on the
    # built artifact). Both decisions are argued in the script's docstring.
    #
    # Gates on KEY PRESENCE; value differences are `::notice` only, because
    # one legitimate value divergence exists and must stay (the opi compose
    # pins EDUBOTICS_CAMERA_SOURCE=usb_cam where the student compose
    # interpolates).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Assert docker-compose.opi.yml matches docker-compose.yml per service
        run: python3 .github/scripts/compose_env_parity.py

  overlay-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Patch script self-check
        run: |
          # Prove the patch script still exits non-zero on a no-op.
          # Feed it a file that doesn't contain the substitution target —
          # patch should refuse with code 2 (fix 1 post-check failed).
          mkdir -p /tmp/fake
          cat > /tmp/fake/server_inference.py <<'EOF'
          # Intentionally unrelated file
          class X:
              def __init__(self):
                  self.unrelated = True
          EOF
          set +e
          python robotis_ai_setup/docker/physical_ai_server/patches/fix_server_inference.py \
              /tmp/fake/server_inference.py
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
              echo "Patch script should have exited non-zero on a file missing the patch target."
              exit 1
          fi
          echo "Patch script correctly rejected unrelated input (rc=$rc)"
      - name: Patch script success case
        # Audit H27: the no-op test above proves the patch fails loudly
        # on a missing target, but doesn't prove it actually applies on
        # a real target. Construct a synthetic upstream-shape file that
        # has both fixes to apply, run the patch, assert it succeeds
        # AND that the post-conditions hold. A future upstream rename
        # that slides the regex off the patch target will fail here
        # instead of silently shipping a broken overlay.
        #
        # The synthetic input must include the EXACT anchors that
        # patches/fix_server_inference.py looks for:
        #   - Fix 1 anchor: '        # Register the ping endpoint by default\n'
        #     (8-space indent; the patch inserts 'self._endpoints = {}'
        #     immediately before this comment).
        #   - Fix 2 anchor: 'self.socket.bind(...)' followed by '\n\n'
        #     followed by 8-space-indented
        #     'self.inference_manager = InferenceManager(\n
        #             policy_type=policy_type,\n
        #             policy_path=policy_path,\n
        #             device=device\n
        #         )\n' (the duplicate that gets removed).
        # Prior to the v2.3.0 audit fix this test used
        # 'self.inference = InferenceManager(...)' which the regex
        # never matched — overlay-guard had been red-shielded for
        # 10+ commits as a result.
        run: |
          set -e
          mkdir -p /tmp/real
          cat > /tmp/real/server_inference.py <<'EOF'
          import zmq


          class InferenceManager:
              def __init__(self, policy_type, policy_path, device):
                  pass


          class ServerInference:
              def __init__(self, policy_type, policy_path, device):
                  self.inference_manager = InferenceManager(
                      policy_type=policy_type,
                      policy_path=policy_path,
                      device=device,
                  )
                  self.context = zmq.Context()
                  self.socket = self.context.socket(zmq.REP)
                  self.socket.bind("tcp://*:5555")

                  self.inference_manager = InferenceManager(
                      policy_type=policy_type,
                      policy_path=policy_path,
                      device=device
                  )

                  # Register the ping endpoint by default
                  self.register_endpoint("ping", self._ping)
          EOF
          set +e
          python robotis_ai_setup/docker/physical_ai_server/patches/fix_server_inference.py \
              /tmp/real/server_inference.py
          rc=$?
          set -e
          if [ "$rc" != "0" ]; then
              echo "::error::Patch script failed on a known-good target (rc=$rc)."
              echo "Either upstream renamed something or the patch regex needs an update."
              cat /tmp/real/server_inference.py
              exit 1
          fi
          # Post-condition: self._endpoints should now be initialised
          # and the duplicate InferenceManager block should be gone.
          if ! grep -q 'self._endpoints = {}' /tmp/real/server_inference.py; then
              echo "::error::Patch did not initialise self._endpoints."
              cat /tmp/real/server_inference.py
              exit 1
          fi
          DUP=$(grep -c 'self\.inference_manager = InferenceManager(' /tmp/real/server_inference.py || true)
          if [ "$DUP" -gt 1 ]; then
              echo "::error::Patch failed to remove duplicate InferenceManager construction (count=$DUP)."
              cat /tmp/real/server_inference.py
              exit 1
          fi
          echo "Patch script applied correctly to a known-good target."

  modal-import-validate:
    # Imports both Modal apps to catch SDK API misuse at module load —
    # exactly the class of bug that bit us with vision_app.py using
    # `force_reinstall=True` (rejected by Modal SDK 1.4.2; the working
    # kwarg is `extra_options="--force-reinstall"`). `python -m compileall`
    # only parses; the Image.pip_install(...) call has to actually
    # *execute* for the bad kwarg to raise TypeError. Importing the
    # module triggers that execution because both apps build their
    # Image specs at module scope.
    #
    # Modal credentials are NOT required — Image specs and
    # Secret.from_name(...) are deferred references that don't reach
    # the Modal API until deploy time. We install the SDK from PyPI
    # and verify the modules import cleanly.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Install Modal SDK
        # Pin the major version we deploy with. A future SDK that
        # silently renames a kwarg back is exactly what we want this
        # job to catch.
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'modal>=1.4,<2'
      - name: Import every Modal app
        # Import each *.py under modal_training/ that defines a
        # modal.App. Failures during Image / function decoration
        # surface as ImportError/TypeError here and fail the build —
        # exactly the c56c012 vision_app.py near-miss with the bad
        # force_reinstall= kwarg.
        #
        # training_handler.py is intentionally NOT in this sweep —
        # it imports server-side runtime deps (supabase,
        # huggingface_hub.utils.HfHubHTTPError) that only exist inside
        # the Modal container's image. It's already syntax-checked by
        # python-tests via compileall.
        working-directory: robotis_ai_setup/modal_training
        run: |
          set -e
          for f in modal_app.py; do
            echo "== importing $f =="
            python -c "import importlib.util, sys; spec = importlib.util.spec_from_file_location('m', '$f'); mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); print('  OK: import succeeded')"
          done
      - name: Smoke-import cloud_training_api routes that touch Modal SDK
        # Audit H28: routes/training.py calls `modal.Function.from_name(...)`
        # and `.remote.aio(...)`. An SDK rename of either symbol would slip
        # past the modal_app import sweep (decoration-time only). Pull in just
        # enough cloud_training_api deps to materialise the route module and
        # prove the Modal SDK call sites still parse.
        run: |
          python -m pip install --quiet \
            'fastapi==0.115.12' 'pydantic==2.11.3' 'supabase==2.15.1' \
            'httpx==0.28.1' 'python-dotenv==1.1.0' 'huggingface_hub>=0.25.0'
          export SUPABASE_URL=http://ci.test
          export SUPABASE_SERVICE_ROLE_KEY=ci-fake
          export MODAL_TOKEN_ID=ci-fake
          export MODAL_TOKEN_SECRET=ci-fake
          export ALLOWED_ORIGINS=http://localhost
          export EDUBOTICS_SKIP_SCHEMA_CHECK=1
          cd robotis_ai_setup/cloud_training_api
          # Importing the route module triggers the module-scope `import
          # modal` and any function-decoration call paths. We do NOT
          # call main.app at FastAPI level — just import the modules so
          # an SDK contract regression surfaces here.
          python -c "from app.routes import training; print('OK')"

  teacher-web-build-validate:
    # Builds Dockerfile.web exactly the way Railway's `railway up
    # --path-as-root .` build does — with only physical_ai_manager/ as
    # the build context — so any path-scope regression surfaces in CI
    # instead of as a failed Railway deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Build physical_ai_manager via Dockerfile.web (Railway path)
        run: |
          docker build \
            --build-arg REACT_APP_SUPABASE_URL=https://CI_VALIDATE.supabase.co \
            --build-arg REACT_APP_SUPABASE_ANON_KEY=CI_VALIDATE_ANON_KEY \
            --build-arg REACT_APP_CLOUD_API_URL=https://CI_VALIDATE.api.example \
            --build-arg REACT_APP_BUILD_ID=ci-railway-validate \
            -t edubotics-teacher-web-validate \
            -f physical_ai_tools/physical_ai_manager/Dockerfile.web \
            physical_ai_tools/physical_ai_manager/
      - name: Assert placeholder secrets reached the bundle
        run: |
          # Path-agnostic: recursively grep the whole nginx html root for each
          # needle rather than a fixed bundle filename. CRA emitted
          # static/js/main.*.js; Vite emits static/js/index-*.js. Using
          # `grep -r` on the html root means a future bundler/output rename
          # never silently breaks this white-screen guard again.
          for needle in \
            'CI_VALIDATE.supabase.co' \
            'CI_VALIDATE_ANON_KEY' \
            'CI_VALIDATE.api.example' ; do
              if ! docker run --rm --entrypoint sh edubotics-teacher-web-validate -c \
                   "grep -q -r -F '$needle' /usr/share/nginx/html" ; then
                  echo "FAIL: '$needle' not found in built bundle"
                  exit 1
              fi
              echo "OK: '$needle' present"
          done

  manager-build-validate:
    # Catches the white-screen regression that shipped on 4 published
    # tags before we noticed: a build where REACT_APP_SUPABASE_URL etc.
    # weren't passed as build-args, so the React bundle inlined undefined,
    # supabaseClient.js threw at module load, and every student saw a
    # blank page. Build the manager image with placeholder secrets and
    # assert those exact strings made it into main.*.js — if they didn't,
    # Webpack didn't see the env vars and the image is broken.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Build physical_ai_manager with placeholder secrets
        run: |
          docker build \
            --build-arg REACT_APP_SUPABASE_URL=https://CI_VALIDATE.supabase.co \
            --build-arg REACT_APP_SUPABASE_ANON_KEY=CI_VALIDATE_ANON_KEY \
            --build-arg REACT_APP_CLOUD_API_URL=https://CI_VALIDATE.api.example \
            --build-arg REACT_APP_BUILD_ID=ci-validate \
            -t edubotics-manager-validate \
            -f physical_ai_tools/physical_ai_manager/Dockerfile \
            physical_ai_tools/physical_ai_manager/
      - name: Assert placeholder secrets reached the React bundle
        run: |
          # Each placeholder must appear as a string literal in the built JS.
          # If the bundler didn't inline process.env.REACT_APP_SUPABASE_URL,
          # the URL is absent and only the library's defensive throw
          # ("supabaseUrl is required") is in the bundle — exactly the
          # bug we're guarding against.
          #
          # Path-agnostic: recursively grep the whole nginx html root rather
          # than a fixed bundle filename. CRA emitted static/js/main.*.js;
          # Vite emits static/js/index-*.js. `grep -r` on the html root means
          # a future bundler/output rename never silently breaks this guard.
          for needle in \
            'CI_VALIDATE.supabase.co' \
            'CI_VALIDATE_ANON_KEY' \
            'CI_VALIDATE.api.example' ; do
              if ! docker run --rm --entrypoint sh edubotics-manager-validate -c \
                   "grep -q -r -F '$needle' /usr/share/nginx/html" ; then
                  echo "FAIL: '$needle' not found in built bundle — the bundler did not inline its env var."
                  echo "      Likely the Dockerfile dropped the ARG, or the React app stopped importing the var."
                  exit 1
              fi
              echo "OK: '$needle' found in bundle."
          done
      - name: Assert version.json is present + well-formed
        run: |
          docker run --rm --entrypoint sh edubotics-manager-validate -c \
            'cat /usr/share/nginx/html/version.json' | python3 -c \
            'import json,sys; d=json.load(sys.stdin); assert d["buildId"]=="ci-validate", d; print("version.json OK:", d)'

  manager-opi-build-validate:
    # The opi (Orange Pi) twin of manager-build-validate: the same
    # white-screen/secret-inlining guard, but against Dockerfile.opi — the
    # THIRD manager build (student Dockerfile / Railway Dockerfile.web /
    # Pi Dockerfile.opi). Dockerfile.opi takes the SAME build args as the
    # student Dockerfile (REACT_APP_SUPABASE_URL / _ANON_KEY /
    # _CLOUD_API_URL / _BUILD_ID; MODE + ALLOWED_POLICIES default in-file)
    # plus its own empty-arg guards, so a dropped ARG or a broken
    # env-inline ships a blank Pi SPA exactly like the amd64 bug did.
    # Built WITHOUT --platform: the node build stage + grep assertions are
    # arch-independent (node:22 and nginx:alpine are multi-arch), so
    # validating on the native amd64 runner avoids QEMU for no coverage
    # loss — the real arm64 build is exercised by docker-publish's opi leg.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Build physical_ai_manager via Dockerfile.opi with placeholder secrets
        run: |
          docker build \
            --build-arg REACT_APP_SUPABASE_URL=https://CI_VALIDATE.supabase.co \
            --build-arg REACT_APP_SUPABASE_ANON_KEY=CI_VALIDATE_ANON_KEY \
            --build-arg REACT_APP_CLOUD_API_URL=https://CI_VALIDATE.api.example \
            --build-arg REACT_APP_BUILD_ID=ci-opi-validate \
            -t edubotics-manager-opi-validate \
            -f physical_ai_tools/physical_ai_manager/Dockerfile.opi \
            physical_ai_tools/physical_ai_manager/
      - name: Assert placeholder secrets reached the React bundle
        run: |
          # Path-agnostic: recursively grep the whole nginx html root rather
          # than a fixed bundle filename (same rationale as the student job —
          # a bundler/output rename must never silently break this guard).
          for needle in \
            'CI_VALIDATE.supabase.co' \
            'CI_VALIDATE_ANON_KEY' \
            'CI_VALIDATE.api.example' ; do
              if ! docker run --rm --entrypoint sh edubotics-manager-opi-validate -c \
                   "grep -q -r -F '$needle' /usr/share/nginx/html" ; then
                  echo "FAIL: '$needle' not found in built opi bundle — the bundler did not inline its env var."
                  echo "      Likely Dockerfile.opi dropped the ARG, or the React app stopped importing the var."
                  exit 1
              fi
              echo "OK: '$needle' found in opi bundle."
          done
      - name: Assert version.json is present + well-formed
        # LOAD-BEARING on the Pi: useVersionCheck polls /version.json to
        # self-reload the SPA after an image update, and self-disables when
        # the baked buildId is the literal "dev" (see Dockerfile.opi).
        run: |
          docker run --rm --entrypoint sh edubotics-manager-opi-validate -c \
            'cat /usr/share/nginx/html/version.json' | python3 -c \
            'import json,sys; d=json.load(sys.stdin); assert d["buildId"]=="ci-opi-validate", d; print("version.json OK:", d)'
      - name: Assert /pi-mode.json marker is baked into the nginx template
        # The React PiModeProvider flips Pi mode ONLY on a valid JSON parse of
        # {"pi": true} from /pi-mode.json (the SPA catch-all otherwise returns
        # index.html, which must NOT flip it). The marker location lives in the
        # nginx template Dockerfile.opi bakes — assert the rendered config
        # would serve it. The template needs its single envsubst var; mirror
        # nginx:alpine's 20-envsubst-on-templates.sh with the in-image default.
        run: |
          docker run --rm --entrypoint sh edubotics-manager-opi-validate -c \
            'test -f /etc/nginx/templates/default.conf.template && grep -q "pi-mode.json" /etc/nginx/templates/default.conf.template' \
            || { echo "::error::Dockerfile.opi image is missing the /pi-mode.json nginx location — Pi mode would never activate."; exit 1; }
          echo "OK: nginx template carries the /pi-mode.json marker location."

  tutorials-validate:
    # Walks every public/tutorials/*.json and asserts schema:
    # id/title_de/level/steps present, each step has title/body/
    # allowed_blocks. Cross-checks every allowed_blocks entry against
    # the workflow runtime's dispatch tables so a tutorial can't
    # reference a block the server would reject.
    #
    # The 2026-05 stripdown removed the static ALLOWED_BLOCK_TYPES
    # frozenset from both the cloud validator and the interpreter
    # overlay — handler dispatch is now the gate. This job re-derives
    # the allowlist from STATEMENT_HANDLERS + VALUE_EVALUATORS keys
    # (handlers/__init__.py), HAT_BLOCK_TYPES (interpreter.py), and
    # the static set of Blockly built-ins the interpreter dispatches.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Validate tutorial JSON files
        run: |
          python3 - <<'PY'
          import glob, json, re, sys
          # Source of truth = the runtime dispatch tables. Extract the
          # dict keys from the handlers __init__ and the HAT_BLOCK_TYPES
          # frozenset from interpreter.py. Built-in Blockly types
          # dispatched in interpreter.py are listed explicitly here
          # since they're hardcoded in the interpreter's btype ladder.
          allowed: set[str] = set()
          handlers_src = open(
              'physical_ai_tools/physical_ai_server/physical_ai_server/workflow/handlers/__init__.py'
          ).read()
          for table in ('STATEMENT_HANDLERS', 'VALUE_EVALUATORS'):
              m = re.search(
                  rf"{table}\s*:\s*dict\[[^\]]+\]\s*=\s*\{{(.*?)^\}}",
                  handlers_src, re.S | re.M,
              )
              assert m, f'could not locate {table} in handlers/__init__.py'
              allowed |= set(re.findall(r"'([^']+)'\s*:", m.group(1)))
          interp_src = open(
              'physical_ai_tools/physical_ai_server/physical_ai_server/workflow/interpreter.py'
          ).read()
          m = re.search(
              r"HAT_BLOCK_TYPES[^=]*=\s*frozenset\(\{([^}]+)\}\)",
              interp_src, re.S,
          )
          assert m, 'could not locate HAT_BLOCK_TYPES in interpreter.py'
          allowed |= set(re.findall(r"'([^']+)'", m.group(1)))
          # Blockly built-ins the interpreter dispatches on btype.
          # Keep in sync with the btype ladder in interpreter.py.
          allowed |= {
              'controls_if', 'controls_repeat_ext', 'controls_whileUntil',
              'controls_for', 'controls_forEach',
              # Named-object loop — a CONTROL block dispatched by the interpreter
              # btype ladder (not the handler tables), so it must be listed here.
              'edubotics_while_visible',
              # Phase-2 quick-win CONTROL blocks — also dispatched by the
              # interpreter btype ladder (forever loop + generic wait-until),
              # so they live here, not in the handler tables.
              'edubotics_forever', 'edubotics_wait_until',
              'logic_boolean', 'logic_compare', 'logic_negate', 'logic_operation',
              'math_number', 'math_arithmetic', 'math_random_int',
              'math_constrain', 'math_modulo', 'math_round',
              # text_join — Blockly built-in string composition evaluated
              # directly in _eval_value_impl (not via VALUE_EVALUATORS).
              'text', 'text_join',
              'lists_create_with', 'lists_repeat', 'lists_length',
              'lists_isEmpty', 'lists_indexOf', 'lists_getIndex',
              'lists_setIndex', 'lists_getSublist',
              'variables_get', 'variables_set',
              'procedures_defnoreturn', 'procedures_defreturn',
              'procedures_callnoreturn', 'procedures_callreturn',
              'procedures_ifreturn',
              'edubotics_broadcast',
          }
          errs = []
          for path in sorted(glob.glob('physical_ai_tools/physical_ai_manager/public/tutorials/*.json')):
              try:
                  doc = json.load(open(path, encoding='utf-8'))
              except Exception as e:
                  errs.append(f'{path}: invalid JSON ({e})')
                  continue
              for field in ('id', 'title_de', 'level', 'steps'):
                  if field not in doc:
                      errs.append(f'{path}: missing field {field}')
              steps = doc.get('steps') or []
              if not isinstance(steps, list) or not steps:
                  errs.append(f'{path}: empty steps')
                  continue
              for i, step in enumerate(steps):
                  for field in ('title', 'body', 'allowed_blocks'):
                      if field not in step:
                          errs.append(f'{path} step {i+1}: missing {field}')
                  for blk in step.get('allowed_blocks') or []:
                      if blk not in allowed:
                          errs.append(f'{path} step {i+1}: block {blk!r} not in runtime dispatch tables')
          if errs:
              print('\n'.join(errs))
              sys.exit(1)
          print('Tutorials validate OK')
          PY

  interfaces-validate:
    # Sanity-checks every srv/msg file in physical_ai_interfaces:
    # exactly one --- separator per srv, every file listed in
    # CMakeLists.txt. No actual rosidl run (requires the full ROS
    # toolchain) but the file-level invariants catch typos.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Lint srv/msg files
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          errs = []
          srv_dir = 'physical_ai_tools/physical_ai_interfaces/srv'
          msg_dir = 'physical_ai_tools/physical_ai_interfaces/msg'
          cmake = open('physical_ai_tools/physical_ai_interfaces/CMakeLists.txt').read()
          for path in sorted(glob.glob(f'{srv_dir}/*.srv')):
              body = open(path, encoding='utf-8').read()
              # rosidl srv format: one line that is exactly '---'
              # separates request from response. Count those lines
              # (ignore '---' that appears inside comments or string
              # defaults).
              sep_lines = [
                  ln for ln in body.splitlines() if ln.strip() == '---'
              ]
              if len(sep_lines) != 1:
                  errs.append(f'{path}: expected exactly one ---, found {len(sep_lines)}')
              base = os.path.basename(path)
              if f'srv/{base}' not in cmake:
                  errs.append(f'{path}: not listed in CMakeLists.txt')
          for path in sorted(glob.glob(f'{msg_dir}/*.msg')):
              base = os.path.basename(path)
              if f'msg/{base}' not in cmake:
                  errs.append(f'{path}: not listed in CMakeLists.txt')
          if errs:
              print('\n'.join(errs))
              sys.exit(1)
          print('Interfaces validate OK')
          PY

  nginx-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Install nginx + envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx-light gettext-base
      - name: nginx -t on web template
        run: |
          # Render the template with a concrete $PORT (the only var the
          # template references). Drop our config into sites-enabled and
          # let nginx validate it the way it would at container start.
          # Catches bad add_header syntax, missing semicolons, malformed
          # location blocks etc. before they break the Railway web deploy.
          export PORT=8080
          envsubst '$PORT' \
            < physical_ai_tools/physical_ai_manager/nginx.web.conf.template \
            > /tmp/nginx.web.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo cp /tmp/nginx.web.conf /etc/nginx/sites-enabled/edubotics-web.conf
          sudo nginx -t
      - name: nginx -t on student template
        run: |
          # The student-mode nginx.conf is plain (no PORT envsubst), so
          # we drop it in directly. Same goal: catch syntax drift before
          # it hits the Docker image.
          sudo rm -f /etc/nginx/sites-enabled/edubotics-web.conf
          sudo cp physical_ai_tools/physical_ai_manager/nginx.conf \
            /etc/nginx/sites-enabled/edubotics-student.conf
          sudo nginx -t
      - name: nginx -t on opi template
        run: |
          # The opi (Orange Pi) manager nginx is a template with a single env
          # placeholder (${EDUBOTICS_ROS_NET_GATEWAY} — the docker gateway the
          # /api/system reverse proxy targets). Render it the way nginx:alpine's
          # 20-envsubst-on-templates.sh does — ONLY that one var, so nginx's own
          # runtime $vars ($host/$uri/$remote_addr/…) survive — then validate.
          # Catches syntax drift in the /api/system proxy + /pi-mode.json blocks
          # before they reach the Docker image (mirrors Dockerfile.opi's
          # NGINX_ENVSUBST_FILTER="^EDUBOTICS_ROS_NET_GATEWAY$").
          sudo rm -f /etc/nginx/sites-enabled/edubotics-student.conf
          export EDUBOTICS_ROS_NET_GATEWAY=172.28.0.1
          envsubst '$EDUBOTICS_ROS_NET_GATEWAY' \
            < physical_ai_tools/physical_ai_manager/nginx.opi.conf.template \
            > /tmp/nginx.opi.conf
          sudo cp /tmp/nginx.opi.conf /etc/nginx/sites-enabled/edubotics-opi.conf
          sudo nginx -t

  german-strings-lint:
    # Audit Tier-6: catch ae/oe/ue/ss transliterations inside any
    # [FEHLER] / [WARNUNG] / [STOPP] line in student-facing source.
    # CLAUDE.md §1.1 mandates literal ä/ö/ü/ß for every German string
    # the user reads; the drift accumulated silently across the
    # overlays + GUI + installer. This job is the regression fence.
    # Second step (2026-06-06): AST-scan the Cloud API's detail= /
    # error_message= strings for English + transliterations — the
    # surface the grep step never covered (which is how auth.py shipped
    # English until 788287e and main.py's 429 detail until today).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Scan student-facing German strings for transliterations
        run: |
          set -e
          # Restrict to surfaces the student/teacher actually reads:
          #   - overlay layer (logs the user sees in TaskStatus / browser)
          #   - GUI tkinter strings
          #   - installer PowerShell strings
          #   - Orange Pi agent (API error detail= / wizard-visible messages)
          # Skip code comments and docs (English/maintainer surfaces) by
          # only checking lines that contain a German marker prefix.
          # 'ss' false-positives on words like 'class' / 'pass' / 'less'
          # so we exclude common false-positives and only match obvious
          # German transliterations.
          OFFENDERS=$(grep -rnE \
            "(\[FEHLER\]|\[WARNUNG\]|\[STOPP\]).*\b(frueh|kuerzer|schliessen|Zeitluecken|Groesste|Luecken|Moegliche|ueber[a-z]|laeuft|haengt|pruefen|Pruefung|ueberschritten|Schueler|benoetigen|Oberflaeche|uebersprungen|enthaelt|zusaetzliche|Verfuegbar|geaendert|beschaedigt|koennte|faehige|Bildaufloesung)\b" \
            physical_ai_tools/physical_ai_server/physical_ai_server/ \
            robotis_ai_setup/gui/ \
            robotis_ai_setup/installer/ \
            robotis_ai_setup/pi_agent/ \
            2>/dev/null || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::German transliterations found in student-facing strings."
            echo "Use literal ä/ö/ü/ß instead of ae/oe/ue/ss (CLAUDE.md §1.1)."
            echo ""
            echo "$OFFENDERS"
            exit 1
          fi
          echo "German strings clean."
      - name: Cloud-API + Pi-agent German lint (AST)
        # Covers call keywords, dict literals and subscript assignments —
        # HTTPException detail= reaches React toasts; trainings-table
        # error_message is rendered raw by MyModels.js/TrainingLiveChart.js;
        # and the Orange-Pi agent's {"ok": ..., "message": ...} JSON payloads
        # are rendered raw by the React System tab (a student-facing surface
        # the grep step above never covered — it only matches
        # [FEHLER]/[WARNUNG]/[STOPP] lines). DB-error matchers ('... in msg')
        # are comparisons, not bindings, so they are structurally excluded
        # and stay English on purpose. `# english-ok` is the escape hatch.
        run: python3 .github/scripts/german_detail_lint.py

  enum-parity:
    # The TaskPhase/TaskCommand wire ints are hand-duplicated across FOUR
    # sources (SendCommand.srv + TaskStatus.msg on the ROS side,
    # taskCommand.js + taskPhases.js on the React side) PLUS literal
    # getattr() fallbacks in the server package (the pre-rebuild-compiled-
    # interfaces survival dance, see collision_monitor.py) and hardcoded
    # ints in the e-stop contract test. rosbridge ships raw ints, so an
    # enum added or renumbered on one side only is a SILENT mis-decode —
    # the names already diverge (MOVE_TO_NEXT vs NEXT share int 4), and
    # until this job nothing asserted the ints agree. leLab-comparison
    # finding (2026-06-07): the getattr scar had no guardrail.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Cross-check wire-int constants (srv/msg <-> js <-> fallbacks)
        run: python3 .github/scripts/enum_parity.py

  secret-scan:
    # gitleaks over the FULL git history on every push/PR. This repo's
    # workflows carry 12 GHA secrets, service-role keys, HF tokens and
    # Supabase DB URLs — a hardcoded credential in a future commit would
    # otherwise ship silently. Runs the pinned BINARY (sha256-verified),
    # not gitleaks-action (the action requires an org license key).
    # Known-benign historical hits are fingerprinted in .gitleaksignore
    # (an expired GitHub presigned URL in the old vendored lerobot README
    # + one generic-api-key false positive in a deleted doc).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0  # full history — leaks usually live in old commits
      - name: Install gitleaks (pinned + sha256-verified)
        run: |
          set -euo pipefail
          VERSION=8.28.0
          SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/gitleaks.tar.gz gitleaks
          /tmp/gitleaks version
      - name: Scan full history
        run: /tmp/gitleaks detect --no-banner --redact --source .

  react-lint:
    # ESLint gate for the React SPA. CRA's build-time lint is WARNING-ONLY
    # (eslint-webpack-plugin never fails the build), so until this job the
    # exact bug class CLAUDE.md documents as shipped regressions —
    # react-hooks/exhaustive-deps stale closures (the rosbridge singleton
    # empty-URL outage, the Benutzer-ID wipe) — had no blocking check.
    # Since the Vite migration (react-scripts removed), eslint and
    # eslint-config-react-app are explicit devDependencies and package.json's
    # eslintConfig extends the config, so `npx eslint` resolves after npm ci.
    # BLOCKING from day one: the pre-existing backlog (19 problems) was
    # fixed in the same PR that added this job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f  # v6.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: physical_ai_tools/physical_ai_manager/package-lock.json
      - name: npm ci
        working-directory: physical_ai_tools/physical_ai_manager
        run: npm ci --no-audit --no-fund
      - name: ESLint (errors AND warnings fail)
        working-directory: physical_ai_tools/physical_ai_manager
        run: npx eslint --ext .js,.jsx --max-warnings 0 src/

  react-tests:
    # The vitest suite. Until this job NO workflow ran it: react-lint is
    # eslint-only, so every React guard in the tree was a local check a push
    # could not fail on — including the ones CLAUDE.md cites as invariants (the
    # toolbox↔block-definition consistency scan, the enum mirrors, the
    # storage-key STUDENT/MACHINE coverage scan and the "exactly one
    # supabase.auth.signOut()" glob). 47 test files were orphaned that way.
    #
    # The WHOLE suite, never a subset — un-orphaning is the entire point, and a
    # curated list is a second place to forget a file.
    #
    # Node setup, action pins and `npm ci` are copied from react-lint above so
    # the two React jobs cannot drift on toolchain: same node 22, same npm cache
    # keyed on the same lockfile.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f  # v6.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: physical_ai_tools/physical_ai_manager/package-lock.json
      - name: npm ci
        working-directory: physical_ai_tools/physical_ai_manager
        run: npm ci --no-audit --no-fund
      - name: vitest (whole suite)
        working-directory: physical_ai_tools/physical_ai_manager
        run: npm test

  actions-security:
    # zizmor lints the workflows themselves: unpinned actions, checkout
    # credential persistence (artipacked — the token-in-artifact class),
    # template injection into run/github-script blocks, overly broad
    # workflow-level permissions. Config in .github/zizmor.yml documents
    # the one accepted deviation (release.yml secrets:inherit to its five
    # same-repo callees). Gate at LOW so the suite stays at today's
    # zero-findings baseline.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
