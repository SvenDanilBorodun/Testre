name: docker-publish

# Builds and publishes the production Docker images:
#   - nettername/open-manipulator          (amd64)
#   - nettername/physical-ai-server        (amd64)
#   - nettername/physical-ai-manager       (amd64)
#   - nettername/open-manipulator-jetson   (arm64)
#   - nettername/physical-ai-server-jetson (arm64)
#   - nettername/open-manipulator-opi      (arm64 — Orange Pi 5 Pro, CPU)
#   - nettername/physical-ai-server-opi    (arm64 — Orange Pi 5 Pro, CPU)
#   - nettername/physical-ai-manager-opi   (arm64 — Orange Pi 5 Pro)
#
# nettername/physical-ai-manager-jetson does NOT exist (manager only
# runs on student PCs, not on Jetson). The Orange Pi (opi) flavor DOES
# ship a manager — the Pi serves the React SPA itself (see build-images.sh
# and physical_ai_manager/Dockerfile.opi).
# nettername/robotis-ai-training is NOT built here — it's owned by
# Modal now (see build-images.sh:395-397). The stale Docker Hub copy
# is on the cleanup list in tools/docker-hub-cleanup.sh.
#
# This is W4 in the golden order — the three production images publish
# AFTER W1 supabase, W2 cloud-api, and W3 teacher-web, and BEFORE W5 (the
# Windows installer, which bakes these image tags into the .exe payload).
#
# Cache policy: --no-cache --pull on every build, per user decision.
# Build time tradeoff (~20 min) is accepted for correctness.

on:
  push:
    # NOTE (2026-06-11): the standalone tag-push trigger (tags: ["v*.*.*"]) was
    # REMOVED. The GHCR dual-push copies image manifests FROM Docker Hub TO GHCR,
    # which reads from Docker Hub; running the build+retag twice per tag (this
    # standalone trigger AND release.yml's W4 reusable call) doubled those reads
    # and hit Docker Hub's authenticated 429 rate limit, failing v2.8.2's retag.
    # On a tag push, ONLY release.yml now builds — via the workflow_call below.
    # (This reverses the earlier "keep the dual-fire for faster time-to-image"
    # maintainer decision: with the GHCR cross-registry copy the dual-fire is a
    # net liability, not a win.) Main-branch pushes still build :latest here.
    branches: [main]
    paths:
      - "robotis_ai_setup/docker/**"
      - "open_manipulator/**"
      - "physical_ai_tools/**"
      - "tools/**"
      - ".github/workflows/docker-publish.yml"
  workflow_call:
    # Allows release.yml to invoke this as a reusable workflow (the tag path).
  workflow_dispatch:
    inputs:
      cleanup_dirty_tags:
        description: "Also delete *-dirty tags from Docker Hub"
        required: false
        default: false
        type: boolean
      reason:
        description: "Audit reason"
        required: true
        type: string

concurrency:
  # Avoid two builds racing to push :latest. cancel-in-progress=false
  # because docker push is non-atomic and a half-finished push leaves
  # the registry in a worse state than waiting for the prior to finish.
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dirty-tree-guard:
    # CI checkouts are always clean, but this guard prevents a
    # workflow_dispatch from a maintainer-side branch where someone
    # forgot to commit. Mirrors the "no *-dirty tags" promise.
    name: Refuse on dirty tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Check tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty. Refusing to build."
            git status --short
            exit 1
          fi
          echo "Working tree is clean."

  base-digest-check:
    # bump-upstream-digests.sh is read-only — it warns when the upstream
    # robotis/* tags we pin have been re-pushed. This job runs it and
    # opens a tracking issue if drift is detected. Does NOT block deploy.
    name: Base image digest drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Set up buildx (for `buildx imagetools inspect`)
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - name: Run digest check
        working-directory: robotis_ai_setup/docker
        run: |
          bash bump-upstream-digests.sh || \
            echo "::warning::Upstream base image digests may have drifted. Review pin in physical_ai_server/Dockerfile + open_manipulator/Dockerfile."

  build:
    name: Build (${{ matrix.platform }})
    needs: [dirty-tree-guard]
    # NOTE: `matrix` context is NOT available in job-level `if:` per GHA
    # docs (only github / inputs / needs / vars are). Per-arch gating
    # would need step-level if's, which adds complexity for no real win
    # — we always build both arches. Operators wanting to rebuild only
    # one arch can re-run the failed matrix entry from the Actions UI.
    if: |
      always() &&
      needs.dirty-tree-guard.result == 'success'
    # Each platform builds on its own NATIVE runner — no QEMU emulation.
    # amd64 → ubuntu-latest (x86_64, GH-managed, free for public repos)
    # arm64 → ubuntu-24.04-arm (aarch64-native, GA since 2025-01)
    # Native arm64 is ~3-4× faster than QEMU cross-build (~10 min vs ~30 min)
    # AND eliminates the class of subtle bugs where aarch64 binaries under
    # qemu-user produce different bytes than on real silicon (FP edge cases,
    # some C/C++ compile-time behavior, glibc string ops). Same Docker
    # buildx invocations work without change — buildx just no longer needs
    # to thunk through QEMU because the runner kernel is already arm64.
    runs-on: ${{ matrix.runner }}
    # 60-min budget per matrix entry — physical-ai-server is ~15 GB and
    # the `--no-cache --pull` policy means every build replays from
    # scratch. Typical amd64 build is 25-35 min, arm64 is 15-20 min on
    # native silicon. 60 min absorbs Docker Hub rate-limit retries.
    timeout-minutes: 60
    strategy:
      fail-fast: false  # each flavor should still build if another fails
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
          # opi (Orange Pi 5 Pro): arm64 too, but a CPU-only base + a manager.
          # build-images.sh's PLATFORM=opi case handles the divergence.
          - platform: opi
            runner: ubuntu-24.04-arm
    # opi is a SECONDARY flavor built on a MANUALLY-published CPU base
    # (BUILD_BASE_OPI). Decouple it from the core release: an opi-leg failure
    # (missing/stale opi base, Rockchip build hiccup) must NOT fail the build
    # job and block the amd64/Jetson GHCR publish. The retag + dual-push
    # integrity + smoke-test steps below all tolerate a missing opi image, so
    # the core release completes and opi simply lands on the next good build.
    continue-on-error: ${{ matrix.platform == 'opi' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CLOUD_API_URL: ${{ secrets.REACT_APP_CLOUD_API_URL }}
      REGISTRY: nettername
      PLATFORM: ${{ matrix.platform }}
      BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0  # build-images.sh greps git log for BUILD_SHA
      - name: Free up runner disk
        # ubuntu-latest ships with ~14 GB free on /, but physical-ai-server
        # builds to ~15.5 GB. The original config (android, dotnet,
        # haskell, large-packages, swap = ~30 GB) was borderline and
        # randomly hit "No space left on device" on 2026-05-22 — both
        # the initial run and a manual rerun failed at the same s6
        # CRLF-cleanup step. Add tool-cache + docker-images to reclaim
        # the remaining headroom (these jobs don't rely on the
        # preinstalled node/python tool cache, and we always `--pull`
        # our base images so the cached ones are dead weight).
        # arm64 (Jetson) builds to 7.4 GB and fits the runner's default free
        # space, so it SKIPS this step. opi RUNS it too (platform != 'arm64'):
        # the opi leg builds the manager AND runs flatten_image's
        # `docker export | import`, a ~15-18 GB transient peak that needs the
        # same headroom as amd64 — more work than the Jetson arm64 leg.
        if: matrix.platform != 'arm64'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true         # reclaims ~5 GB (no step needs node/python)
          android: true            # reclaims ~17 GB
          dotnet: true             # reclaims ~2 GB
          haskell: true            # reclaims ~5 GB
          large-packages: true     # reclaims ~3 GB (mongodb, etc.)
          docker-images: true      # reclaims ~3 GB (we always --pull anyway)
          swap-storage: true       # reclaims ~4 GB swap file
      - name: Show available disk
        run: df -h /
      - name: Compute SOURCE_DATE_EPOCH from commit
        # SOURCE_DATE_EPOCH makes image timestamps deterministic for a
        # given commit. Two CI runs on the same SHA produce literally
        # identical image bytes. Industry-standard for reproducible
        # Docker builds (docs.docker.com/build/ci/github-actions/reproducible-builds).
        # Subsequent steps inherit this via $GITHUB_ENV.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      # No QEMU step — each matrix entry runs on its native architecture.
      # Removing setup-qemu-action shaves ~30 sec from each build and
      # eliminates emulation-specific failure modes.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        with:
          # Route ALL docker.io pulls through Google's pull-through mirror so the
          # build's base images never hit Docker Hub's rate limit. The manager
          # Dockerfile's `FROM node:22` + `FROM nginx:...` (Docker OFFICIAL images)
          # are the surface that 429'd v2.8.2's build — mirror.gcr.io serves
          # byte-identical official images with no Hub pull limit. Third-party/own
          # repos not in the mirror (robotis/*, nettername/*-jetson-base) get a
          # 404 from the mirror and buildkit transparently falls back to docker.io
          # (authenticated via the login below), so nothing breaks.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Docker Hub login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run build-images.sh
        working-directory: robotis_ai_setup/docker
        # The existing script already does --no-cache --pull on every
        # buildx call and pushes amd64 directly / arm64 via --push.
        # We pass env it expects via the env: block above; no Bash flags
        # are added. The script's `${VAR:?}` enforcement still applies.
        run: bash build-images.sh

      # ── opi build-success marker (retag gate) ──
      # The opi build leg is continue-on-error, so a failed/partial opi build
      # still lets the retag job run. The retag job used to gate opi purely on
      # "does nettername/<repo>:latest exist on Docker Hub?" — but a PRIOR
      # release's opi :latest satisfies that probe, so a failed opi build would
      # silently promote LAST release's opi image under the NEW semver tags.
      # These two steps drop a marker containing THIS run's sha, but ONLY when
      # the opi build actually succeeded (`success() && ... 'opi'` — if
      # build-images.sh failed above, `success()` is false and no marker is
      # produced). The retag job downloads it and skips ALL opi retagging unless
      # the marker's sha == github.sha. amd64/jetson never run these steps.
      - name: Record opi build-success marker
        if: success() && matrix.platform == 'opi'
        env:
          GIT_SHA: ${{ github.sha }}
        run: echo "$GIT_SHA" > opi-build-success.txt
      - name: Upload opi build-success marker
        if: success() && matrix.platform == 'opi'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: opi-build-success
          path: opi-build-success.txt
          if-no-files-found: error
          retention-days: 5

  retag:
    # Apply the canonical tag set to whatever build-images.sh just pushed.
    # build-images.sh tags as :<YYYYMMDD>-<HHMMSS>-<sha> + :latest;
    # this job re-tags via `buildx imagetools create` (no rebuild).
    #
    # We derive the tags inline (sha, full-sha, semver on tag pushes)
    # rather than via docker/metadata-action because the action's output
    # bundles tags with a repo prefix and we need to apply the same tag
    # set across 5 separate repos.
    name: Apply canonical tag set
    needs: [build]
    runs-on: ubuntu-latest
    # 45 (was 15): the Hub-side retags are manifest-only (near-instant), but the
    # GHCR side is a CROSS-REGISTRY blob copy — `imagetools create` streams every
    # layer (~6 GB/repo, blobs deduped per repo so ~once each) from Docker Hub
    # through the runner up to GHCR. ~40 GB across the 8 repos on the first push
    # (the 3 opi repos add a ~5-6 GB server + two small thin layers).
    timeout-minutes: 45
    # packages: write is needed to push to GHCR via GITHUB_TOKEN. Per-job (not
    # workflow-level) keeps the grant scoped to the only job that pushes. NOTE
    # (zizmor superset rule): release.yml's `docker` job that calls this workflow
    # MUST also grant packages: write, or the whole release startup-fails.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Docker Hub login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: GHCR login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - name: Download opi build-success marker (if the opi leg produced one)
        # Present only when THIS run's opi build succeeded (see the build job).
        # continue-on-error: a missing artifact (opi build failed/skipped) is
        # the normal decoupled case, not a retag failure. The script below
        # treats an absent/mismatched marker as "opi did not build this run".
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          name: opi-build-success
          path: opi-marker
      - name: Re-tag each image with the canonical set (Docker Hub + GHCR)
        run: |
          set -e
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)

          # opi built THIS run? True only when the build job's opi leg uploaded
          # the marker AND it carries the current sha. A prior release's opi
          # :latest can NO LONGER be promoted under this release's tags: without
          # a matching marker, every opi repo is skipped below.
          OPI_OK=0
          OPI_MARKER="opi-marker/opi-build-success.txt"
          if [ -f "$OPI_MARKER" ] && [ "$(tr -d '[:space:]' < "$OPI_MARKER")" = "${{ github.sha }}" ]; then
            OPI_OK=1
            echo "opi build-success marker present and matches HEAD — opi will be retagged."
          else
            echo "opi build-success marker absent or sha mismatch — opi retag will be SKIPPED (decoupled)."
          fi
          SRC_TAG="latest"   # build-images.sh pushed :latest to Docker Hub as the source

          # DUAL-PUSH: every tag is created on BOTH Docker Hub (nettername/*,
          # the permanent fallback) and GHCR (ghcr.io/svendanilborodun/*, the
          # student-facing primary). `imagetools create` is a content-addressed
          # copy, so the cross-registry manifest digest is BYTE-IDENTICAL — which
          # is what makes the runtime GHCR→Hub fallback a safe, same-image swap.
          HUB="nettername"
          GHCR="ghcr.io/svendanilborodun"

          # Derive the semver tag if this is a tag push.
          REF="${GITHUB_REF#refs/tags/}"
          case "$REF" in
            v*.*.*) SEMVER="${REF#v}" ;;
            *)      SEMVER="" ;;
          esac

          AMD64_REPOS="open-manipulator physical-ai-server physical-ai-manager"
          ARM64_REPOS="open-manipulator-jetson physical-ai-server-jetson"
          # Orange Pi 5 Pro (arm64, CPU) — includes a manager, unlike the Jetson set.
          OPI_REPOS="open-manipulator-opi physical-ai-server-opi physical-ai-manager-opi"

          # _tag_exists: FREE existence probe via the Docker Hub web API
          # (hub.docker.com), which is NOT the registry pull endpoint and does
          # NOT consume the 200/6h pull-rate budget. nettername/* repos are
          # public so no auth is needed. On a re-run, tags created by a prior
          # partial attempt are SKIPPED, so we only spend pull budget on the
          # tags actually missing. Docker-Hub-specific — GHCR has no equivalent
          # web API of this shape, so the GHCR side always re-creates (idempotent).
          _tag_exists() {
            local repo="$1" tag="$2" code
            code=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 15 \
              "https://hub.docker.com/v2/repositories/nettername/${repo}/tags/${tag}/" 2>/dev/null || echo "000")
            [ "$code" = "200" ]
          }

          # _retag: `imagetools create` reads the source manifest (1 pull). 6
          # attempts with quadratic backoff (5/20/45/80/125/180s) to ride out a
          # transient 429 burst.
          _retag() {
            local target="$1" source="$2" attempt
            for attempt in 1 2 3 4 5 6; do
              if docker buildx imagetools create -t "$target" "$source"; then
                return 0
              fi
              echo "WARN: retag $target attempt $attempt/6 failed; sleeping $((attempt*attempt*5))s"
              sleep $((attempt*attempt*5))
            done
            echo "::error::Failed to retag $target after 6 attempts"
            return 1
          }

          # _retag_be: BEST-EFFORT retag for the Docker Hub FALLBACK side. GHCR is
          # the registry students pull; Docker Hub is the digest-identical fallback.
          # A Hub-side failure (e.g. a transient 429) must NOT fail the release as
          # long as GHCR succeeds — warn and continue. (GHCR-side _retag calls stay
          # FATAL under `set -e`, so a GHCR failure correctly fails the release.)
          _retag_be() {
            local target="$1" source="$2"
            if ! _retag "$target" "$source"; then
              echo "::warning::Hub-side retag of $target failed (best-effort; GHCR is primary). The Docker Hub fallback for this tag may be stale until the next release."
            fi
            return 0
          }

          # _maybe_retag_hub: existence-gated + best-effort, for IMMUTABLE per-commit
          # sha tags only — skip if already on Hub (free web-API check, no pull).
          _maybe_retag_hub() {
            local repo="$1" tag="$2" source="$3"
            if _tag_exists "$repo" "$tag"; then
              echo "skip (already on Docker Hub): ${HUB}/${repo}:${tag}"
              return 0
            fi
            _retag_be "${HUB}/${repo}:${tag}" "$source"
          }

          # _retag_primary: GHCR is the student-facing primary, so a GHCR retag is
          # normally FATAL under `set -e`. But opi is DECOUPLED from the core
          # release — a transient opi GHCR hiccup must NOT fail the retag job and
          # block the amd64/Jetson publish. When IS_OPI=1 the GHCR retag becomes
          # best-effort (::warning, never a hard fail); amd64/jetson stay fatal
          # (byte-identical to the prior direct `_retag` behavior).
          _retag_primary() {
            local target="$1" source="$2"
            if [ "${IS_OPI:-0}" = "1" ]; then
              if ! _retag "$target" "$source"; then
                echo "::warning::opi GHCR retag of $target failed (best-effort; opi is decoupled from the core release). It lands on the next good opi build."
              fi
              return 0
            fi
            _retag "$target" "$source"
          }

          for REPO in $AMD64_REPOS $ARM64_REPOS $OPI_REPOS; do
            # opi is decoupled (its build leg is continue-on-error): gate its
            # retag on the BUILD-SUCCESS MARKER for THIS run (OPI_OK above), not
            # on a Hub existence probe. The old `_tag_exists "$REPO" latest`
            # probe was satisfied by the PRIOR release's opi :latest, so a
            # failed opi build silently promoted last release's opi image under
            # the new semver tags — with the integrity check green (stale ==
            # stale). The amd64/Jetson repos are always present and always
            # retagged, exactly as before.
            IS_OPI=0
            case " $OPI_REPOS " in
              *" $REPO "*)
                IS_OPI=1
                if [ "$OPI_OK" != "1" ]; then
                  echo "::warning::opi image ${REPO} not built this run (no matching build-success marker) — skipping its retag (opi is decoupled from the core amd64/Jetson release)."
                  continue
                fi
                ;;
            esac
            HUB_SRC="${HUB}/${REPO}:${SRC_TAG}"     # :latest pushed by build-images.sh
            GHCR_SRC="${GHCR}/${REPO}:${SRC_TAG}"   # :latest seeded on GHCR below

            # ONE cross-registry copy per repo: Hub:latest -> GHCR:latest. EVERY
            # other GHCR tag is then derived from GHCR:latest (intra-GHCR), so we
            # read image manifests FROM Docker Hub at most ONCE per repo. GHCR is
            # the student-facing primary, so this copy stays FATAL for the core
            # amd64/Jetson repos; for opi repos _retag_primary downgrades a GHCR
            # failure to a ::warning (opi transients must not block the release).
            _retag_primary "$GHCR_SRC" "$HUB_SRC"

            # Immutable sha tags: GHCR fatal for core repos (best-effort for opi
            # via _retag_primary), Hub best-effort + gated.
            _maybe_retag_hub "$REPO" "$SHORT" "$HUB_SRC"
            _retag_primary "${GHCR}/${REPO}:${SHORT}" "$GHCR_SRC"            # sha-short
            _maybe_retag_hub "$REPO" "${{ github.sha }}" "$HUB_SRC"
            _retag_primary "${GHCR}/${REPO}:${{ github.sha }}" "$GHCR_SRC"   # full-sha
            if [ -n "$SEMVER" ]; then
              # Semver :X.Y.Z — ALWAYS re-point on BOTH registries (NOT existence-
              # gated). A failed-then-retried release of the SAME version produces a
              # new build; existence-gating Hub:X.Y.Z would freeze it on the OLD
              # build while GHCR re-creates -> exactly the GHCR/Hub :X.Y.Z divergence
              # the audit found. Always re-pointing reconciles both registries to
              # the final build. GHCR fatal for core repos (opi best-effort), Hub
              # best-effort.
              _retag_primary "${GHCR}/${REPO}:${SEMVER}" "$GHCR_SRC"         # e.g. 2.8.2
              _retag_be "${HUB}/${REPO}:${SEMVER}" "$HUB_SRC"
              # Floating minor :X.Y — always re-point, both registries.
              _retag_primary "${GHCR}/${REPO}:${SEMVER%.*}" "$GHCR_SRC"
              _retag_be "${HUB}/${REPO}:${SEMVER%.*}" "$HUB_SRC"
            fi
          done

      - name: Verify GHCR ↔ Docker Hub dual-push integrity
        run: |
          set -e
          HUB="nettername"
          GHCR="ghcr.io/svendanilborodun"
          # NOTE: this is the SECOND hardcoded repo list (the retag step above has
          # the first, AMD64_REPOS/ARM64_REPOS/OPI_REPOS) — keep BOTH in sync.
          REPOS="open-manipulator physical-ai-server physical-ai-manager open-manipulator-jetson physical-ai-server-jetson open-manipulator-opi physical-ai-server-opi physical-ai-manager-opi"
          # opi subset — decoupled from the core release, so a missing opi image
          # here (opi build leg skipped/failed) is a WARNING, never a fatal.
          OPI_REPOS="open-manipulator-opi physical-ai-server-opi physical-ai-manager-opi"
          # Top-level manifest digest of a ref (the `Digest:` header line).
          _top() {
            docker buildx imagetools inspect "$1" 2>/dev/null | awk '/^Digest:/{print $2; exit}'
          }
          # EVERY sha256 imagetools names for a ref: the top-level index digest
          # PLUS every per-platform child manifest digest.
          _all() {
            docker buildx imagetools inspect "$1" 2>/dev/null | grep -oE 'sha256:[0-9a-f]{64}' | sort -u
          }
          # Integrity invariant: GHCR's :latest must CONTAIN Hub's :latest
          # manifest — either equal to it (the arm64/jetson repos, where
          # build-images.sh already pushed an index to Hub) OR wrapping it as a
          # child. The amd64 :latest legitimately differs at the TOP level: Hub
          # is a raw single-platform `docker push` (CLAUDE.md §dual-store), while
          # `imagetools create` wraps that exact manifest in an OCI index on GHCR
          # — same content (the child digest is byte-identical), so the Docker Hub
          # fallback pulls identical bytes and the GUI's per-registry digest
          # pre-check still matches via that shared child. (For SEMVER release tags
          # both registries are imagetools-created → fully equal; only :latest is
          # asymmetric, and nothing student-facing pulls :latest.)
          fail=0
          for REPO in $REPOS; do
            H=$(_top "${HUB}/${REPO}:latest")
            G_ALL=$(_all "${GHCR}/${REPO}:latest")
            if [ -z "$G_ALL" ]; then
              case " $OPI_REPOS " in
                *" $REPO "*)
                  echo "::warning::opi ${REPO} not on GHCR (opi decoupled / not built this run) — skipping its parity check."
                  continue ;;
              esac
              echo "::error::GHCR ${GHCR}/${REPO}:latest not found — dual-push failed (is the package created?)."
              fail=1
            elif printf '%s\n' "$G_ALL" | grep -qx "$H"; then
              echo "OK ${REPO}: Hub manifest ${H} present in GHCR :latest"
            else
              # opi carve-out: a Hub-vs-GHCR :latest mismatch on an opi repo is
              # expected whenever the opi retag was skipped/best-effort this run
              # (build failed, marker absent, or a transient GHCR hiccup on the
              # decoupled leg) — Hub carries a newer/older opi :latest than
              # GHCR. That must WARN, never fail the core amd64/Jetson release.
              case " $OPI_REPOS " in
                *" $REPO "*)
                  echo "::warning::opi ${REPO}: Hub top digest ${H} not in GHCR :latest digest set (opi decoupled — retag skipped or best-effort this run). GHCR opi :latest may be stale until the next good opi build."
                  continue ;;
              esac
              echo "::error::Parity FAILED for ${REPO}: Hub top digest ${H} not found in GHCR digest set:"
              printf '%s\n' "$G_ALL" | sed 's/^/    /'
              fail=1
            fi
          done

          # SEMVER parity (the student-pinned :X.Y.Z — what versions.env pins).
          # GHCR is authoritative (students pull it); a MISSING GHCR :X.Y.Z is
          # FATAL. The Hub :X.Y.Z is best-effort (a 429 may leave it stale), so a
          # GHCR-vs-Hub mismatch WARNS rather than fails. This is the check that
          # would have caught the dormant :2.8.2 divergence the audit found.
          REF="${GITHUB_REF#refs/tags/}"
          case "$REF" in v*.*.*) SEMVER="${REF#v}" ;; *) SEMVER="" ;; esac
          if [ -n "$SEMVER" ]; then
            for REPO in $REPOS; do
              GS=$(_top "${GHCR}/${REPO}:${SEMVER}")
              HS=$(_top "${HUB}/${REPO}:${SEMVER}")
              if [ -z "$GS" ]; then
                case " $OPI_REPOS " in
                  *" $REPO "*)
                    echo "::warning::opi ${REPO}:${SEMVER} not on GHCR (opi decoupled / not built this run) — skipping."
                    continue ;;
                esac
                echo "::error::GHCR ${GHCR}/${REPO}:${SEMVER} missing — students would 404 on this release."
                fail=1
              elif [ "$GS" = "$HS" ]; then
                echo "OK ${REPO}: GHCR == Hub :${SEMVER} (${GS})"
              else
                echo "::warning::${REPO}: GHCR :${SEMVER} (${GS}) != Hub :${SEMVER} (${HS:-<missing>}). GHCR is authoritative; the Docker Hub fallback for :${SEMVER} may be stale."
              fi
            done
          fi
          [ "$fail" = "0" ]

  versions-env:
    # Emit docker/versions.env capturing the canonical IMAGE_TAG this build
    # ships. Consumed by three readers (none of which writes the file):
    #   - robotis_ai_setup/installer/scripts/pull_images.ps1
    #   - robotis_ai_setup/installer/scripts/verify_system.ps1
    #   - robotis_ai_setup/gui/app/constants.py (IMAGE_TAG = …)
    # All three fall back to ":latest" when the file is missing, so the
    # artifact is non-fatal — it's a precision win for installs done
    # months after a release, when ":latest" has drifted past the .exe.
    #
    # Uploaded as a workflow artifact so the operator can grab it (or a
    # future workflow can chain it via `actions/download-artifact@v4` with
    # cross-workflow lookup). release-installer.yml regenerates the same
    # content from `github.ref` rather than chaining the artifact — keeps
    # release-installer self-contained and removes a cross-workflow dep.
    name: Emit versions.env artifact
    needs: [retag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Derive IMAGE_TAG from ref
        id: derive
        run: |
          set -e
          REF="${GITHUB_REF#refs/tags/}"
          case "$REF" in
            v*.*.*) IMAGE_TAG="${REF#v}" ;;
            *)      IMAGE_TAG="latest" ;;
          esac
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Derived IMAGE_TAG=${IMAGE_TAG} (ref=${GITHUB_REF})"
      - name: Write versions.env
        run: |
          set -e
          mkdir -p out
          cat > out/versions.env <<EOF
          # Generated by .github/workflows/docker-publish.yml — DO NOT EDIT BY HAND.
          # Consumed by pull_images.ps1, verify_system.ps1, and gui/app/constants.py.
          # When this file is missing, those readers fall back to IMAGE_TAG=latest
          # and their hardcoded registry defaults (GHCR primary, Docker Hub fallback).
          IMAGE_TAG=${{ steps.derive.outputs.IMAGE_TAG }}
          REGISTRY=ghcr.io/svendanilborodun
          REGISTRY_FALLBACK=nettername
          EOF
          cat out/versions.env
      - name: Upload versions.env artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: versions-env
          path: out/versions.env
          retention-days: 90
          if-no-files-found: error

  smoke-test:
    name: Smoke-test (${{ matrix.platform }})
    needs: [retag]
    # opi is decoupled (see the build job): if the opi image wasn't published
    # this run its pulls 404 — that must not fail the workflow or block the core
    # amd64/Jetson release. The opi leg is non-fatal; amd64/Jetson stay strict.
    continue-on-error: ${{ matrix.platform == 'opi' }}
    # Native per-arch runners so each image is exercised on real silicon —
    # we now actually test arm64 images instead of trusting "build succeeded".
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # Smoke-test the GHCR images (the STUDENT-FACING primary) — not the Docker
    # Hub copies. This both validates the registry students actually pull AND
    # removes 6 anonymous Docker Hub pulls/release (the strictest rate-limit
    # bucket, on shared runner IPs). packages: read lets the GHCR login pull.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
            server_repo: physical-ai-server
            arm_repo: open-manipulator
            manager_repo: physical-ai-manager
          - platform: arm64
            runner: ubuntu-24.04-arm
            server_repo: physical-ai-server-jetson
            arm_repo: open-manipulator-jetson
            # No manager-jetson repo (manager only ships on student PCs).
            manager_repo: ""
          # opi (Orange Pi 5 Pro): arm64 CPU flavor, and it DOES ship a manager
          # (the Pi serves the SPA), so the bundle-grep step runs for opi too.
          # ROS-jazzy / dynamixel_sdk / arch-sanity / image_source_parity are all
          # matrix-driven and cover opi automatically. Its size gate is a separate
          # opi-only step (the amd64 CUDA-slim gate stays amd64-gated).
          - platform: opi
            runner: ubuntu-24.04-arm
            server_repo: physical-ai-server-opi
            arm_repo: open-manipulator-opi
            manager_repo: physical-ai-manager-opi
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: GHCR login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull + grep manager bundle for inlined env (amd64 + opi)
        if: matrix.manager_repo != ''
        # Lifts the assertion build-images.sh already does at lines 226-243.
        # If the React build skipped a build-arg, the placeholder won't be in
        # the JS bundle and this fails. This is the white-screen catcher.
        # Path-agnostic: recursively grep the whole nginx html root rather than
        # a fixed bundle filename. CRA emitted static/js/main.*.js; Vite emits
        # static/js/index-*.js. `grep -r` on the html root means a future
        # bundler/output rename never silently breaks this guard again.
        run: |
          set -e
          docker pull ghcr.io/svendanilborodun/${{ matrix.manager_repo }}:latest
          for needle in "${{ secrets.SUPABASE_URL }}" "${{ secrets.REACT_APP_CLOUD_API_URL }}"; do
            HASH=$(echo "$needle" | sha256sum | cut -c1-8)
            if ! docker run --rm --entrypoint sh ghcr.io/svendanilborodun/${{ matrix.manager_repo }}:latest \
                 -c "grep -q -r -F '$needle' /usr/share/nginx/html"; then
              echo "::error::Bundle does not contain expected env (hash=$HASH)."
              exit 1
            fi
            echo "OK: bundle contains expected env (hash=$HASH)"
          done
      - name: Pull + assert server image has ROS 2 Jazzy
        run: |
          docker pull ghcr.io/svendanilborodun/${{ matrix.server_repo }}:latest
          ROS_DISTRO=$(docker run --rm --entrypoint sh ghcr.io/svendanilborodun/${{ matrix.server_repo }}:latest \
                       -c 'echo "$ROS_DISTRO"')
          if [ "$ROS_DISTRO" != "jazzy" ]; then
            echo "::error::${{ matrix.server_repo }} ROS_DISTRO=$ROS_DISTRO, expected jazzy"
            exit 1
          fi
          echo "OK: ${{ matrix.server_repo }} has ROS_DISTRO=jazzy"
      - name: Assert amd64 server image is CUDA-slimmed (real size ceiling)
        if: matrix.platform == 'amd64'
        # The CUDA slim (build-images.sh flatten of the amd64 image) must keep
        # CUDA out of the shipped bytes. A fat (CUDA-back) physical-ai-server is
        # ~16 GB; the slimmed CPU image is ~5-6 GB. Gate on REAL bytes
        # (docker image inspect .Size), NOT a `find … nvidia` that a base-layer
        # whiteout would false-pass. The image is already pulled by the step
        # above. (The arm64 *-jetson image KEEPS CUDA and is intentionally
        # exempt.)
        run: |
          set -e
          SIZE=$(docker image inspect ghcr.io/svendanilborodun/${{ matrix.server_repo }}:latest --format '{{.Size}}')
          # .Size is UNCOMPRESSED on-disk bytes. The fat (CUDA-back) image is ~16 GB;
          # the CPU-slimmed image is much smaller but its exact uncompressed size is
          # build-dependent (ROS + torch-cpu + transformers + opencv). 11 GB sits
          # safely between: catches a CUDA-back regression while never blocking a
          # correctly-slimmed build. Re-calibrate down once a real build's .Size is
          # recorded in docs/plans/2026-06-09-amd64-cuda-slim.md.
          CEIL=$((11 * 1000 * 1000 * 1000))
          echo "physical-ai-server amd64 image .Size: ${SIZE} bytes (uncompressed; ceiling ${CEIL})"
          if [ "$SIZE" -ge "$CEIL" ]; then
            echo "::error::amd64 physical-ai-server is ${SIZE} bytes (>= ${CEIL}) — the CUDA slim/flatten did not take effect."
            exit 1
          fi
          echo "OK: amd64 server image is CUDA-slimmed (${SIZE} bytes)."
      - name: Assert opi server image size ceiling
        if: matrix.platform == 'opi'
        # The opi (Orange Pi) server base is CPU-only from the start (plain PyPI
        # torch 2.7.0, no CUDA — Dockerfile.arm64cpu), and build-images.sh
        # FLATTENs the thin image so the layer/whiteout overhead is reclaimed. A
        # regression that let CUDA/GPU torch or the fat base layers slip in would
        # blow past this ceiling. Gate on REAL uncompressed bytes (docker image
        # inspect .Size), not a `find … nvidia`. The image is already pulled by
        # the ROS-Jazzy step above. Separate from (and lower than) the amd64
        # CUDA-slim gate — do NOT fold the two. (The arm64 *-jetson image KEEPS
        # CUDA and has no size gate at all.)
        run: |
          set -e
          SIZE=$(docker image inspect ghcr.io/svendanilborodun/${{ matrix.server_repo }}:latest --format '{{.Size}}')
          # .Size is UNCOMPRESSED on-disk bytes. The opi CPU-only server targets
          # ~5-6 GB (ROS + torch-cpu + transformers + opencv, no CUDA). 11 GB is
          # a PROVISIONAL ceiling (matching the amd64 gate) — the previous 7 GB
          # left only ~1.2x headroom, so a first real build near 7 GB would
          # falsely FAIL the release. 11 GB still catches a CUDA/fat-base
          # regression (a GPU-torch/CUDA server is ~16 GB). Re-calibrate down
          # once a real opi build's .Size is measured.
          CEIL=$((11 * 1000 * 1000 * 1000))
          echo "physical-ai-server-opi image .Size: ${SIZE} bytes (uncompressed; ceiling ${CEIL})"
          if [ "$SIZE" -ge "$CEIL" ]; then
            echo "::error::opi physical-ai-server is ${SIZE} bytes (>= ${CEIL}) — CUDA/fat base slipped in or the flatten did not take effect."
            exit 1
          fi
          echo "OK: opi server image is within the size ceiling (${SIZE} bytes)."
      - name: Pull + assert open-manipulator has Dynamixel SDK
        run: |
          docker pull ghcr.io/svendanilborodun/${{ matrix.arm_repo }}:latest
          if ! docker run --rm --entrypoint sh ghcr.io/svendanilborodun/${{ matrix.arm_repo }}:latest \
               -c 'python3 -c "import dynamixel_sdk"'; then
            echo "::error::${{ matrix.arm_repo }} missing dynamixel_sdk"
            exit 1
          fi
          echo "OK: ${{ matrix.arm_repo }} has dynamixel_sdk"
      - name: Architecture sanity (assert running on native arch)
        # Belt-and-suspenders: if a runner is mis-provisioned we want to
        # catch it here. uname should match the matrix arch.
        run: |
          UNAME_M=$(uname -m)
          case "${{ matrix.platform }}" in
            amd64) EXPECTED="x86_64" ;;
            arm64) EXPECTED="aarch64" ;;
            opi)   EXPECTED="aarch64" ;;
          esac
          if [ "$UNAME_M" != "$EXPECTED" ]; then
            echo "::error::Runner arch mismatch: uname -m = $UNAME_M, expected $EXPECTED"
            exit 1
          fi
          echo "OK: native ${{ matrix.platform }} runner ($UNAME_M)"
      - name: Image-source parity (image reflects repo HEAD, no left-outs)
        # The durable guard against the v2.5.0/v2.5.1 class of bug where a
        # monorepo edit/deletion silently never reached the image. For
        # physical-ai-server (COPY-wholesale) the image package must be
        # BYTE-IDENTICAL to the repo source of truth; for open-manipulator
        # (overlay model) every overlay must be present in the image.
        run: |
          set -e
          chmod +x .github/scripts/image_source_parity.sh
          .github/scripts/image_source_parity.sh physical-ai-server "ghcr.io/svendanilborodun/${{ matrix.server_repo }}:latest"
          .github/scripts/image_source_parity.sh open-manipulator "ghcr.io/svendanilborodun/${{ matrix.arm_repo }}:latest"

  cleanup-dirty-tags:
    # Manual-dispatch only — sweeps any *-dirty tags from Docker Hub.
    # Calls the tools/docker-hub-cleanup.sh script with --execute.
    name: Sweep *-dirty tags
    # NB: `inputs.cleanup_dirty_tags` is typed `boolean`, which GHA
    # materialises as a real boolean (NOT the string 'true'). The prior
    # condition `inputs.cleanup_dirty_tags == 'true'` was the classic
    # bool-vs-string mismatch — it was ALWAYS false, so this job has
    # never actually run from workflow_dispatch. Documented in the
    # 2026-05 audit. fromJSON forces the comparison to align: GHA's
    # workflow_call also passes inputs as JSON which fromJSON normalises.
    if: github.event_name == 'workflow_dispatch' && fromJSON(inputs.cleanup_dirty_tags || 'false')
    needs: [smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - run: bash tools/docker-hub-cleanup.sh --execute --only-dirty
