name: railway-deploy-cloud-api

# Deploys robotis_ai_setup/cloud_training_api/ (the FastAPI service) to
# the Railway project `scintillating-empathy`, service
# `scintillating-empathy` (URL scintillating-empathy-production-1068.up.railway.app).
#
# This is W2 in the golden order — runs AFTER W1 supabase-migrate
# completes, because the FastAPI's startup hook
# _validate_required_schema() probes every table + RPC the routes need
# and refuses to boot if Supabase is behind.
#
# This workflow REPLACES the maintainer's "nudge the Dockerfile to
# re-trigger Railway" ritual that was documented at
# cloud_training_api/Dockerfile lines 3-7. That nudge comment is
# removed in the same PR that adds this workflow.

on:
  push:
    branches: [main]
    paths:
      - "robotis_ai_setup/cloud_training_api/**"
      - ".github/workflows/railway-deploy-cloud-api.yml"
  workflow_call:
    # Allows release.yml to invoke this as a reusable workflow.
  workflow_dispatch:
    inputs:
      reason:
        description: "Audit reason for manual redeploy"
        required: true
        type: string

concurrency:
  group: railway-cloud-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  schema-probe:
    # Read-only probe of the live Supabase fingerprint BEFORE we deploy.
    # If migrations are behind (W1 didn't run, or W1's apply-production
    # failed silently), the new FastAPI code would crash at boot —
    # better to refuse the deploy here than to ship a broken service.
    name: Pre-deploy schema fingerprint probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODAL_TOKEN_ID: ci-probe
      MODAL_TOKEN_SECRET: ci-probe
      ALLOWED_ORIGINS: http://localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: Install full deps for the probe
        run: |
          # Use the same requirements as the production image — importing
          # app.main triggers loading of every router module, and any
          # missing transitive dep would silently break the probe with a
          # confusing ImportError instead of a real schema check.
          python -m pip install --upgrade pip
          python -m pip install --quiet -r robotis_ai_setup/cloud_training_api/requirements.txt
      - name: Import + probe
        working-directory: robotis_ai_setup/cloud_training_api
        run: |
          # Importing app.main triggers the three startup validators
          # (line 67 _validate_required_secrets, line 114 _warn_optional,
          # line 319 _validate_required_schema). The schema probe hits
          # the live DB read-only via the service-role key.
          python -c "from app import main; print('schema probe passed')"

  deploy:
    name: Railway up
    needs: [schema-probe]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install Railway CLI via npm
        # GH runners come with Node.js + npm pre-installed. npm install
        # of @railway/cli is more stable in CI than the curl install
        # script (which uses sudo -v and assumes interactive auth).
        run: |
          npm install -g @railway/cli
          railway --version
      - name: Stage VERSION file into build context
        # The Dockerfile COPYs ./VERSION into the image so main.py's drift
        # check (GUI_VERSION env vs in-tree VERSION) works in production.
        # `--path-as-root .` below scopes the build context to this dir, so
        # we have to physically place VERSION here. Re-staged on every CI
        # run, never committed.
        working-directory: robotis_ai_setup/cloud_training_api
        run: |
          cp "${GITHUB_WORKSPACE}/VERSION" VERSION
          test -s VERSION || { echo "::error::VERSION file empty or missing"; exit 1; }
      - name: Stamp BUILD_COMMIT as service variable
        env:
          GITHUB_SHA_FULL: ${{ github.sha }}
        run: |
          # Set BUILD_COMMIT as a Railway service variable BEFORE `railway up`
          # so health.py::_resolve_commit() returns the actual SHA (not 'dev'
          # from the Dockerfile ARG default). $RAILWAY_GIT_COMMIT_SHA only
          # populates on Railway's native git-push integration; `railway up
          # --ci` source uploads (this code path) have no git context.
          #
          # --skip-deploys prevents the variable change from triggering its
          # own deploy; the `railway up` two steps later picks up the new
          # value atomically.
          railway variable set "BUILD_COMMIT=${GITHUB_SHA_FULL}" \
              --service scintillating-empathy --environment production \
              --skip-deploys >/dev/null && \
              echo "  stamped BUILD_COMMIT=${GITHUB_SHA_FULL}"
      - name: Deploy
        working-directory: robotis_ai_setup/cloud_training_api
        run: |
          # railway up --ci has a known bug: it exits non-zero on "Failed to
          # stream build logs" even when the deploy itself proceeds fine on
          # Railway's side. We capture the deployment ID from the upload
          # output, then poll the deployment until it reaches a terminal
          # state — that way we don't depend on the log-stream working.
          #
          # --path-as-root . scopes the build context to THIS dir so the
          # Dockerfile path resolves correctly.
          set +e
          OUTPUT=$(railway up . \
              --service scintillating-empathy \
              --environment production \
              --path-as-root \
              --ci 2>&1)
          UP_EXIT=$?
          set -e
          echo "$OUTPUT"

          # Extract deployment ID from the "Build Logs:" URL line
          DEPLOY_ID=$(echo "$OUTPUT" | grep -oE 'id=[a-f0-9-]{36}' | head -1 | sed 's/^id=//')
          if [ -z "$DEPLOY_ID" ]; then
              echo "::error::Could not extract deployment ID — upload likely failed before reaching Railway"
              exit ${UP_EXIT:-1}
          fi
          echo "Tracking deployment ${DEPLOY_ID} (railway up exit=${UP_EXIT})"

          # Poll deployment until SUCCESS or FAILED — Railway's healthcheck
          # has its own 5-min budget; cap our wait at 18 min so the whole
          # job stays under timeout-minutes: 20.
          for i in $(seq 1 108); do
              STATUS=$(railway deployment list \
                  --service scintillating-empathy --environment production \
                  --json 2>/dev/null | \
                  python3 -c "import json,sys; print(next((x['status'] for x in json.load(sys.stdin) if x['id'].startswith('${DEPLOY_ID%%-*}')), 'UNKNOWN'))")
              echo "[${i}] deployment ${DEPLOY_ID:0:8}... status=${STATUS}"
              case "${STATUS}" in
                  SUCCESS) echo "Deployment ${DEPLOY_ID} succeeded"; exit 0 ;;
                  FAILED|CRASHED|REMOVED|SKIPPED)
                      echo "::error::Deployment ${DEPLOY_ID} terminal=${STATUS}"
                      exit 1 ;;
              esac
              sleep 10
          done
          echo "::error::Deployment ${DEPLOY_ID} did not reach terminal state within 18 min"
          exit 1

  health-gate:
    name: Health probe
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Poll /health until commit matches
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -e
          # The FastAPI's /health endpoint returns {"status":"ok","commit":"<sha>"}.
          # A bare 200 is NOT a valid signal that THIS deploy succeeded:
          # Railway routes traffic to the OLD pod while the new one boots,
          # and if the new pod's startup validators fail (e.g.,
          # _validate_required_schema sees a schema drift), Railway keeps
          # the old pod serving forever — `curl /health` returns 200 from
          # the old code against either the old or new schema, and CI
          # silently passes while production is stuck on the previous
          # release. Polling for `commit == github.sha` forces us to wait
          # for the new pod to actually take traffic.
          #
          # 5-min budget (was 60s) — Railway's pre-warm + healthcheck cycle
          # on cold image pulls regularly takes 90-180s; the old 60s was
          # actually short enough to false-negative on legitimate deploys.
          URL=https://scintillating-empathy-production-1068.up.railway.app/health
          for attempt in $(seq 1 150); do
            BODY=$(curl -fsS --max-time 5 "$URL" 2>/dev/null || true)
            if [ -n "$BODY" ]; then
              if python3 -c "import json, os, sys; d = json.loads(sys.argv[1]); sys.exit(0 if d.get('commit') == os.environ['EXPECTED_SHA'] else 1)" "$BODY"; then
                echo "Cloud API healthy at commit $EXPECTED_SHA."
                echo "  body: $BODY"
                exit 0
              fi
              ACTUAL=$(echo "$BODY" | python3 -c "import json, sys; print(json.loads(sys.stdin.read()).get('commit', '<missing>'))" 2>/dev/null || echo "<unparseable>")
              echo "Attempt $attempt: serving commit=$ACTUAL, expected $EXPECTED_SHA"
            else
              echo "Attempt $attempt: $URL → curl failed or empty body"
            fi
            sleep 2
          done
          echo "::error::Cloud API did not serve commit=$EXPECTED_SHA within 5 minutes after Railway deploy."
          echo "::error::Most likely the new pod's startup validator failed and Railway kept routing to the old pod."
          echo "::error::Inspect Railway logs for the scintillating-empathy service."
          exit 1
