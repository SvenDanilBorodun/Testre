name: railway-deploy-teacher-web

# Deploys physical_ai_tools/physical_ai_manager/ (the React 19 SPA) to
# the Railway service `teacher-web` (URL teacher-web-production.up.railway.app).
#
# This is W4 in the golden order. The build is gated on the existing
# `teacher-web-build-validate` job in ci.yml, which already produces an
# identical image with placeholder secrets and asserts the bundle
# contains the inlined env vars.

on:
  push:
    branches: [main]
    paths:
      - "physical_ai_tools/physical_ai_manager/**"
      - "physical_ai_tools/physical_ai_server/physical_ai_server/workflow/coco_classes.py"
      - ".github/workflows/railway-deploy-teacher-web.yml"
  workflow_call:
    # Allows release.yml to invoke this as a reusable workflow.
  workflow_dispatch:
    inputs:
      reason:
        description: "Audit reason for manual redeploy"
        required: true
        type: string

concurrency:
  group: railway-teacher-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prebuild-validate:
    # Reuses the validate job from ci.yml — same Dockerfile.web build with
    # placeholder secrets + grep assertion. If this passes, the real build
    # below will too (Webpack treats secrets as opaque strings).
    name: Validate Dockerfile.web build path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Build with placeholders (matches the Railway path)
        run: |
          docker build \
            --build-arg REACT_APP_SUPABASE_URL=https://CI_VALIDATE.supabase.co \
            --build-arg REACT_APP_SUPABASE_ANON_KEY=CI_VALIDATE_ANON_KEY \
            --build-arg REACT_APP_CLOUD_API_URL=https://CI_VALIDATE.api.example \
            --build-arg REACT_APP_BUILD_ID=ci-railway-validate-${{ github.sha }} \
            -t edubotics-teacher-web-validate \
            -f physical_ai_tools/physical_ai_manager/Dockerfile.web \
            physical_ai_tools/physical_ai_manager/
      - name: Assert placeholders reached the bundle
        run: |
          for needle in CI_VALIDATE.supabase.co CI_VALIDATE_ANON_KEY CI_VALIDATE.api.example; do
            if ! docker run --rm --entrypoint sh edubotics-teacher-web-validate \
                 -c "grep -q -F '$needle' /usr/share/nginx/html/static/js/main.*.js"; then
              echo "::error::Placeholder '$needle' missing — Webpack did not inline."
              exit 1
            fi
            echo "OK: $needle present in bundle"
          done

  deploy:
    name: Railway up (teacher-web)
    needs: [prebuild-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # The script reads PHYSICAL_AI_TOOLS_DIR for the coco_classes.py path.
      # Default in the script is `<repo>/physical_ai_tools` which matches our
      # monorepo layout — no override needed.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install Railway CLI via npm
        # GH runners come with Node.js + npm pre-installed; npm
        # install is more stable than the curl install script which
        # uses sudo -v and assumes interactive auth.
        run: |
          npm install -g @railway/cli
          railway --version
      - name: Deploy via the existing script
        # The script handles _coco_classes.py staging (trap cleanup EXIT),
        # --path-as-root, and --service teacher-web. We just invoke it.
        # It uses `exec railway up` so its exit code IS the deploy result.
        run: bash physical_ai_tools/physical_ai_manager/scripts/railway-deploy.sh

  health-gate:
    name: Health probe
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Poll /version.json until buildId matches this SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -e
          # Polling for a bare 200 was a false-positive trap: Railway's
          # blue-green pattern keeps the OLD container serving while the
          # new one boots, and a failed deploy can leave the old
          # container indefinitely serving 200. We need to confirm the
          # NEW build actually took traffic.
          #
          # The Webpack build inlines REACT_APP_BUILD_ID into
          # /version.json; CI builds pass ${{ github.sha }} as the build
          # arg (see prebuild-validate and the smoke-test path), so the
          # served file should contain the full SHA. We accept either
          # full SHA or short-SHA (7-char prefix) so a future build that
          # only stamps short SHAs still passes.
          #
          # 5-min budget because Railway's cold-pull + nginx warmup
          # routinely exceeds 60s for the manager image.
          URL=https://teacher-web-production.up.railway.app/version.json
          SHORT_SHA=$(echo "$EXPECTED_SHA" | cut -c1-7)
          for attempt in $(seq 1 150); do
            BODY=$(curl -fsS --max-time 5 "$URL" 2>/dev/null || true)
            if [ -n "$BODY" ]; then
              BUILD_ID=$(echo "$BODY" | python3 -c "import json, sys; print(json.loads(sys.stdin.read()).get('buildId', ''))" 2>/dev/null || true)
              # Accept exact match (full SHA), prefix (short SHA), or
              # containment in either direction (build-id may be
              # ${SHA}-${TIMESTAMP} on tag builds).
              case "$BUILD_ID" in
                *"$EXPECTED_SHA"*|*"$SHORT_SHA"*)
                  echo "teacher-web /version.json buildId matches: $BUILD_ID"
                  echo "  body: $BODY"
                  exit 0
                  ;;
              esac
              echo "Attempt $attempt: serving buildId=$BUILD_ID, expected ${SHORT_SHA}*"
            else
              echo "Attempt $attempt: $URL → curl failed or empty body"
            fi
            sleep 2
          done
          echo "::error::teacher-web did not serve buildId matching ${SHORT_SHA} within 5 minutes."
          echo "::error::Most likely the new build never took traffic — check Railway logs for the teacher-web service."
          exit 1
