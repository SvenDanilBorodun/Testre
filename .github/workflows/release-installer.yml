name: release-installer

# Builds EduBotics_Setup.exe and publishes it as a GitHub Release asset.
# Triggered when a maintainer pushes a tag matching v*.*.* (e.g., v2.3.0).
#
# Two-job flow:
#   1. build-rootfs (ubuntu-latest)   — runs wsl_rootfs/build_rootfs.sh,
#      which uses Docker to produce installer/assets/edubotics-rootfs.tar.gz
#      + .sha256 sidecar (~192 MB). Artifact uploaded to next job.
#   2. build-installer (windows-latest) — pulls Python deps, runs
#      PyInstaller against gui/build.spec, installs Inno Setup via Chocolatey,
#      runs iscc against installer/robotis_ai_setup.iss, uploads the resulting
#      installer/output/EduBotics_Setup.exe to the tagged GitHub Release.
#
# After the workflow finishes, the release page will have the .exe
# attached. Operator then bumps Railway env vars GUI_VERSION + GUI_DOWNLOAD_URL
# to arm the auto-update gate for existing student installs.
#
# Manual trigger via workflow_dispatch is supported for testing without
# tagging (artifact is uploaded as a CI artifact, not as a Release asset).

on:
  # Tag-push trigger removed in favor of being chained from release.yml
  # AFTER docker-publish completes. Race fix: previously both this file
  # and release.yml fired on `v*.*.*` with no `needs:` linkage, so the
  # .exe could attach to the GH Release before docker-publish had pushed
  # the matching `:vX.Y.Z` image tags — students hit first-boot pull 404
  # because the GUI's `/version` poll said "update available" but the
  # image tags weren't there yet. release.yml's `installer:` job now
  # invokes this workflow as a workflow_call, gated on `docker.result ==
  # 'success'`.
  workflow_call:
    inputs:
      version_tag:
        description: "Tag-style version (e.g., v2.3.0) — defaults to the calling ref"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Tag-style version (e.g., v2.3.0) for the test build"
        required: true
        default: "v0.0.0-test"
        type: string

concurrency:
  # Serialise releases for the same ref. cancel-in-progress: false so a
  # half-uploaded GH Release asset doesn't get aborted partway through
  # (softprops/action-gh-release can leave a partial upload visible to
  # the auto-updater poll).
  group: release-installer-${{ github.ref }}
  cancel-in-progress: false

# Permissions are declared PER JOB (zizmor excessive-permissions): only
# build-installer needs contents:write (the GH-Release asset upload);
# build-rootfs is read-only. The caller (release.yml `installer:` job)
# must grant at least contents:write or GH fails the run at startup —
# see the v2.3.2 startup_failure note in release.yml.
permissions: {}

jobs:
  build-rootfs:
    name: Build WSL2 rootfs (Ubuntu host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build rootfs tarball via Docker
        run: |
          cd robotis_ai_setup/wsl_rootfs
          bash build_rootfs.sh
          ls -la ../../robotis_ai_setup/installer/assets/edubotics-rootfs.tar.gz*

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: edubotics-rootfs
          path: |
            robotis_ai_setup/installer/assets/edubotics-rootfs.tar.gz
            robotis_ai_setup/installer/assets/edubotics-rootfs.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error

  build-installer:
    name: Build EduBotics_Setup.exe (Windows host)
    needs: build-rootfs
    runs-on: windows-latest
    # 90-min budget: Windows runner is slow, PyInstaller + Inno Setup
    # together are typically ~25 min; pad for `choco install innosetup`
    # network jitter and pip wheel-building when pythonnet 3.1.0rc lacks
    # a wheel for the runner's Python patch level.
    timeout-minutes: 90
    permissions:
      contents: write  # softprops/action-gh-release: attach the .exe asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Download rootfs artifact from previous job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: edubotics-rootfs
          path: robotis_ai_setup/installer/assets/

      - name: Emit docker/versions.env for the installer payload
        # Pins the IMAGE_TAG that pull_images.ps1, verify_system.ps1, and
        # gui/app/constants.py will resolve at install time. Without this,
        # they fall back to ":latest" — which is fine immediately after a
        # release but drifts past the .exe as new versions ship to Docker
        # Hub. Mirrors the content of the artifact emitted by
        # docker-publish.yml::versions-env (intentional duplication —
        # cross-workflow artifact download requires a token-scoped lookup
        # and we prefer self-contained workflows).
        shell: bash
        env:
          # Env indirection instead of inline ${{ }} expansion inside the
          # run block (zizmor template-injection): a crafted version_tag
          # could otherwise expand into executable bash. The input is
          # maintainer-supplied, but the env hop costs nothing.
          INPUT_TAG: ${{ inputs.version_tag }}
        run: |
          set -e
          if [ -n "$INPUT_TAG" ]; then
            REF="${INPUT_TAG#refs/tags/}"
          else
            REF="${GITHUB_REF#refs/tags/}"
          fi
          case "$REF" in
            v*.*.*) IMAGE_TAG="${REF#v}" ;;
            *)      IMAGE_TAG="latest" ;;
          esac
          mkdir -p robotis_ai_setup/docker
          cat > robotis_ai_setup/docker/versions.env <<EOF
          # Generated by .github/workflows/release-installer.yml — DO NOT EDIT BY HAND.
          # Pins the Docker image tag + registry this installer build targets so
          # first-boot pulls match the .exe even months after a release ships.
          # Readers: pull_images.ps1, verify_system.ps1, gui/app/constants.py.
          # REGISTRY is the student-facing primary (GHCR); REGISTRY_FALLBACK is
          # the digest-identical Docker Hub twin used when GHCR is degraded.
          IMAGE_TAG=${IMAGE_TAG}
          REGISTRY=ghcr.io/svendanilborodun
          REGISTRY_FALLBACK=nettername
          EOF
          echo "Wrote versions.env:"
          cat robotis_ai_setup/docker/versions.env

      - name: Verify rootfs artifact
        shell: pwsh
        run: |
          $tgz = "robotis_ai_setup/installer/assets/edubotics-rootfs.tar.gz"
          $sha = "robotis_ai_setup/installer/assets/edubotics-rootfs.tar.gz.sha256"
          if (-not (Test-Path $tgz)) { throw "rootfs missing: $tgz" }
          if (-not (Test-Path $sha)) { throw "sha sidecar missing: $sha" }
          $size = (Get-Item $tgz).Length
          Write-Host "rootfs: $size bytes"
          if ($size -lt 100000000) { throw "rootfs too small ($size bytes) — build_rootfs.sh probably failed" }

      - name: Install GUI build deps
        shell: pwsh
        run: |
          cd robotis_ai_setup/gui
          python -m pip install --upgrade pip
          # `--pre` because pythonnet>=3.1.0rc0 is a pre-release pin
          # (see comments in requirements.txt). Without --pre, pip would
          # downgrade to 3.0.x which won't install on Python 3.14 (when
          # we eventually bump) and can produce subtly different WinForms
          # interop behavior on 3.11.
          python -m pip install --pre -r requirements.txt
          # Pinned to what built v2.37.0 (release run 41416948649). An
          # unpinned PyInstaller in a job that writes the installer every
          # school PC runs elevated is a supply-chain hole (security review
          # 2026-10-25, P0-9; hash-locking requirements.txt is still open).
          python -m pip install pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.9

      - name: Build GUI with PyInstaller
        shell: pwsh
        run: |
          cd robotis_ai_setup/gui
          pyinstaller build.spec --clean --noconfirm
          if (-not (Test-Path "dist/EduBotics/EduBotics.exe")) {
            throw "PyInstaller did not produce dist/EduBotics/EduBotics.exe"
          }
          # The licence notices of every Python package in the environment
          # PyInstaller bundled from (the same interpreter), plus Python's own
          # LICENSE.txt. The .iss copies dist/EduBotics/* to {app}\gui, so this
          # ships as {app}\gui\THIRD_PARTY_PYTHON.txt (THIRD_PARTY_NOTICES.txt
          # section 1.1 points there). The script exits non-zero on an empty
          # environment.
          python ../../.github/scripts/third_party_python_notices.py --out dist/EduBotics/THIRD_PARTY_PYTHON.txt
          if ($LASTEXITCODE -ne 0) { throw "third_party_python_notices.py failed ($LASTEXITCODE)" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Pinned like the action SHAs above: an unpinned ISCC major bump
          # could silently change compiled-installer behavior (the .iss
          # Pascal [Code] section has no other compile check in CI).
          # v2.6.1 shipped built with 6.7.0 — bump deliberately, with a
          # workflow_dispatch test build against the PREVIOUS release tag.
          # --allow-downgrade --force: the windows-latest image started
          # pre-installing a NEWER Inno Setup (6.7.1, 2026-06-07) and bare
          # choco refuses to downgrade (exit 1) — the flags make the pin
          # win over whatever the runner image ships.
          choco install innosetup --version=6.7.0 -y --no-progress --allow-downgrade --force
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup ISCC.exe not at expected path" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          cd robotis_ai_setup/installer
          & $env:ISCC robotis_ai_setup.iss
          if (-not (Test-Path "output/EduBotics_Setup.exe")) {
            throw "Inno Setup did not produce output/EduBotics_Setup.exe"
          }
          $size = (Get-Item "output/EduBotics_Setup.exe").Length
          Write-Host "installer: $size bytes"
          if ($size -lt 100000000) { throw "installer suspiciously small ($size bytes)" }

      - name: Upload installer as CI artifact (always)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: EduBotics_Setup
          path: robotis_ai_setup/installer/output/EduBotics_Setup.exe
          # ~255 MB per run. A private repository shares 500 MB (Free) or 2 GB
          # (Pro) of artifact storage across ALL artifacts, so a 14-day copy of
          # every build filled it within two releases (2026-11-09: 1.78 GB
          # live). On a tag the .exe is attached to the release below; on a
          # workflow_dispatch proof build, download it the same day.
          retention-days: 1
          if-no-files-found: error

      - name: Check the public release channel (tag pushes only)
        # The assets go to vars.RELEASES_REPO (owner/repo of a PUBLIC repository
        # that holds only the binaries) once it is set, else to this repository.
        # A private repository's release assets answer 404 to anonymous clients,
        # and every GUI and Pi downloads its update anonymously, so the
        # downloads must leave this repository before it goes private
        # (docs/deploy/PRIVATE-REPOSITORY.md). The channel needs a token that
        # can write there: secrets.RELEASES_REPO_TOKEN, a fine-grained PAT with
        # Contents read/write on that repository only. A variable without the
        # token fails here, before the upload, instead of in softprops.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASES_REPO}" ]; then
            echo "Release channel: this repository (vars.RELEASES_REPO is not set)."
            exit 0
          fi
          if ! printf '%s' "${RELEASES_REPO}" | grep -Eq '^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::vars.RELEASES_REPO='${RELEASES_REPO}' is not of the form owner/repo."
            exit 1
          fi
          if [ -z "${RELEASES_REPO_TOKEN}" ]; then
            echo "::error::vars.RELEASES_REPO is set but secrets.RELEASES_REPO_TOKEN is empty: create a fine-grained PAT with Contents read/write on ${RELEASES_REPO} only and store it as RELEASES_REPO_TOKEN."
            exit 1
          fi
          echo "Release channel: ${RELEASES_REPO}"

      - name: Attach installer to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: robotis_ai_setup/installer/output/EduBotics_Setup.exe
          fail_on_unmatched_files: true
          # Explicit token. softprops/action-gh-release v3.0.0 has a known
          # regression where token discovery via the implicit `GITHUB_TOKEN`
          # env path fails with "Bad credentials" when this workflow is
          # invoked via workflow_call (release.yml -> here). Passing the
          # token explicitly via `with:` bypasses the discovery path and
          # uses the secret value directly. v2.3.7 hit this; this line is
          # the fix. See the v2.3.7 release-installer failure log.
          # The public release channel (see the step above). With
          # vars.RELEASES_REPO unset this is exactly the old behaviour: this
          # repository with the explicit GITHUB_TOKEN.
          repository: ${{ vars.RELEASES_REPO || github.repository }}
          token: ${{ vars.RELEASES_REPO && secrets.RELEASES_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          # Don't auto-generate notes — operator writes them in the dashboard.
          # Don't mark as latest until the operator has bumped Railway env vars
          # (see CLAUDE.md §14): bumping GUI_VERSION before this release is
          # marked latest would push students to a 404 if the upload races.
          draft: false
          prerelease: false
