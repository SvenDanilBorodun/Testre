name: release

# Top-level release dispatcher. Chains the five CI-driven surface
# workflows in the golden order:
#
#   W1 supabase-migrate
#       │
#       ▼
#   W2 railway-deploy-cloud-api
#       │
#       ▼
#   W3 railway-deploy-teacher-web
#       │
#       ▼
#   W4 docker-publish
#       │
#       ▼
#   W5 release-installer
#       │
#       ▼
#   W6 publish-gui-version
#
# release-installer MUST run AFTER docker-publish — the installer's
# auto-update poll directs students at the `:vX.Y.Z` image tags that
# docker-publish pushes, so attaching the .exe before those tags exist
# causes first-boot pull 404 on every student that picks up the update.
#
# publish-gui-version (W6) MUST run AFTER release-installer — it flips the
# Railway GUI_VERSION/GUI_DOWNLOAD_URL env vars that drive the student
# auto-update gate (/version). Setting them before the .exe is attached to
# the GH Release would point every updating student at a 404. Automating
# this here removes the manual "bump Railway env after gh release" step
# (CLAUDE.md §"Bumping product VERSION") that silently drifted — a GUI
# could auto-update while the images it pulls stayed on a stale `:latest`.
#
# Modal deploys are MANUAL (operator runs `modal deploy modal_app.py`
# and `modal deploy vision_app.py` from their workstation). Modal's
# image build occurs in Modal's infrastructure, not on GH runners, and
# the auth / image-build feedback loop is slow to debug in CI. Until
# we have a strong reason to move Modal into CI, the operator owns it.
#
# Fires on tag pushes (v*.*.*) for full coordinated releases. For
# everyday merges to main, each surface workflow fires INDEPENDENTLY
# via its own path-filter (only what changed redeploys). This file is
# the coordinator for whole-stack releases.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      reason:
        description: "Audit reason for full release"
        required: true
        type: string
      skip_supabase:
        description: "Skip the supabase-migrate step (use only if no schema change)"
        required: false
        default: false
        type: boolean

concurrency:
  # Only one release dispatch at a time. cancel-in-progress: true on
  # purpose — if you push v2.3.3 to fix a v2.3.2 CHANGELOG typo, the
  # newer tag should win. Each individual surface workflow has its own
  # serialised concurrency group so partial progress on the cancelled
  # run won't corrupt anything.
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Permissions are granted PER JOB (zizmor excessive-permissions) — each
# caller job grants exactly what its callee workflow declares, no more.
# CRITICAL (v2.3.2 + v2.3.3 startup_failure scar): GH refuses to start
# the run if any callee declares a permission stricter than the CALLER
# grants — "The workflow is requesting 'pull-requests: write', but is
# only allowed 'pull-requests: none'." When a callee's permissions
# change, the matching caller job below MUST change in the same PR:
#   supabase-migrate.yml   → contents: read + pull-requests: write
#   railway-deploy-*.yml   → contents: read
#   docker-publish.yml     → contents: read
#   release-installer.yml  → contents: write (GH-Release asset upload)
permissions: {}

jobs:
  # ── W1: Supabase ──────────────────────────────────────────────────
  supabase:
    name: W1. Apply migrations
    # `inputs` context only exists on workflow_dispatch / workflow_call events.
    # On a tag push, referencing `inputs.skip_supabase` triggers a workflow
    # validation error ("Unrecognized named-value: 'inputs'") which surfaces
    # as a startup_failure on the whole release — observed on v2.3.2's first
    # push. Gate on github.event_name first so the `inputs` access only
    # evaluates on the workflow_dispatch path. The `||` operator in GH
    # Actions short-circuits, so the inputs access is never reached on push.
    if: >-
      ${{
        github.event_name != 'workflow_dispatch' ||
        !fromJSON(inputs.skip_supabase || 'false')
      }}
    permissions:
      contents: read
      pull-requests: write  # supabase-migrate.yml declares it (branch-PR comments)
    uses: ./.github/workflows/supabase-migrate.yml
    secrets: inherit

  # ── W2: Cloud API (after Supabase so the FastAPI sees the new schema) ──
  # Note: if you bumped a Modal-side dependency in this release, run
  # `modal deploy modal_app.py vision_app.py` MANUALLY BEFORE pushing
  # the tag so the worker is ready before the FastAPI tries to call it.
  cloud-api:
    name: W2. Deploy cloud_training_api
    needs: [supabase]
    if: always() && (needs.supabase.result == 'success' || needs.supabase.result == 'skipped')
    permissions:
      contents: read
    uses: ./.github/workflows/railway-deploy-cloud-api.yml
    secrets: inherit

  # ── W3: Teacher web (after cloud-api so it can reach the new endpoints) ──
  teacher-web:
    name: W3. Deploy teacher-web
    needs: [cloud-api]
    if: always() && needs.cloud-api.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/railway-deploy-teacher-web.yml
    secrets: inherit

  # ── W4: Docker images (student installs pull these) ──
  docker:
    name: W4. Build + publish Docker images
    needs: [teacher-web]
    if: always() && needs.teacher-web.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit

  # ── W5: Installer .exe (must run AFTER docker so the auto-update
  # poll has matching :vX.Y.Z image tags to pull on first boot) ──
  #
  # Only fires when docker succeeded (NOT skipped) — the installer's
  # existence implies the images exist. If docker was skipped, that's
  # because the trigger only changed installer-irrelevant code, and we
  # shouldn't be cutting a new installer in that case either.
  installer:
    name: W5. Build + attach installer .exe
    needs: [docker]
    if: always() && needs.docker.result == 'success'
    permissions:
      contents: write  # release-installer.yml uploads the .exe to the GH Release
    uses: ./.github/workflows/release-installer.yml
    secrets: inherit

  # ── W5b: Offline image bundle → Cloudflare R2 (LEAF, additive) ──
  # Builds EduBotics_Setup_Full.exe — the small inner installer (the W5
  # `EduBotics_Setup` artifact) + a `docker save` of the 3 amd64 images + a
  # manifest-digest sidecar, wrapped in a 7-Zip SFX — and uploads it to R2 so
  # NEW students install fully OFFLINE. Existing machines auto-update over the
  # network via the small .exe and never touch this file.
  #
  # Heavy packaging runs on LINUX by necessity: Inno's 2.1 GB per-output-file
  # ceiling makes a single >9 GB .exe impossible, windows-latest lacks the
  # disk, and upload-artifact caps at 5 GB.
  #
  # LEAF + tag-push only + JOB-level continue-on-error + NOTHING depends on it:
  # an R2/build failure can NEVER fail the release run or block W6 — online
  # install + auto-update stay fully functional. Runs green-but-skipped until
  # the operator completes the one-time setup (vendor
  # robotis_ai_setup/installer/sfx/7zSD.sfx per its README; mint the R2_* GHA
  # secrets).
  bundle:
    name: W5b. Build + upload offline bundle (R2)
    needs: [installer]
    if: always() && needs.installer.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true   # JOB-level — a bundle failure must not fail the release
    permissions:
      contents: read
      actions: read           # download the W5 inner-installer artifact (same run)
    env:
      REGISTRY: nettername
      # aws-cli v2.25+ sends CRC64-NVME/CRC32 request checksums that R2 rejects
      # ("x-amz-checksum-algorithm not implemented"); force when_required so
      # PutObject + multipart succeed against R2.
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Checkout (sfx stub + config)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Preflight — is the bundle configured?
        id: pre
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          ready=true
          if [ ! -f robotis_ai_setup/installer/sfx/7zSD.sfx ]; then
            echo "::warning::installer/sfx/7zSD.sfx not vendored yet (see installer/sfx/README.md) — skipping offline bundle."
            ready=false
          elif [ -f robotis_ai_setup/installer/sfx/7zSD.sfx.sha256 ]; then
            ( cd robotis_ai_setup/installer/sfx && sha256sum -c 7zSD.sfx.sha256 )
          fi
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_KEY" ]; then
            echo "::warning::R2_* secrets not set — skipping offline bundle upload."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: steps.pre.outputs.ready == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Resolve IMAGE_TAG from the release tag
        id: tag
        if: steps.pre.outputs.ready == 'true'
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${GIT_REF_NAME}"
          echo "image_tag=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Docker Hub login
        if: steps.pre.outputs.ready == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download inner installer (.exe) from W5
        if: steps.pre.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: EduBotics_Setup
          path: inner

      - name: Pull, save per image, checksum, collect digests (P0 size measure)
        if: steps.pre.outputs.ready == 'true'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p sfx_root/images
          digests="{}"
          for repo in open-manipulator physical-ai-server physical-ai-manager; do
            ref="${REGISTRY}/${repo}:${IMAGE_TAG}"
            echo "::group::$ref"
            # Manifest-LIST digest = the 'Digest:' header (== what a pull-by-tag
            # RepoDigest records == what the GUI's _parse_digest_candidates
            # extracts). Registry-side; independent of the local store.
            list_digest="$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/ {print $2; exit}')"
            # Shape-assert the digest so a malformed sidecar value is caught at
            # build time, not on a student PC (it must be a member of the GUI's
            # _parse_digest_candidates set, i.e. sha256:<64 hex>).
            if [[ ! "$list_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::bad/empty manifest-list digest for $ref: '$list_digest'"; exit 1
            fi
            docker pull "$ref"
            docker save "$ref" | gzip -1 > "sfx_root/images/${repo}.tar.gz"
            ( cd sfx_root/images && sha256sum "${repo}.tar.gz" > "${repo}.tar.gz.sha256" )
            docker image rm "$ref" >/dev/null 2>&1 || true   # release graph space now
            digests="$(echo "$digests" | jq --arg k "$ref" --arg v "$list_digest" '. + {($k): $v}')"
            echo "::endgroup::"
          done
          echo "$digests" | jq . > sfx_root/bundled_digests.json
          cp inner/EduBotics_Setup.exe sfx_root/EduBotics_Setup.exe
          echo "── bundle size (un-slimmed; P0 measure) ──"
          du -h sfx_root/images/*.tar.gz
          du -sh sfx_root
          cat sfx_root/bundled_digests.json
          df -h /

      - name: Assemble 7-Zip SFX (one file)
        if: steps.pre.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ( cd sfx_root && 7z a -mx=0 ../archive.7z . >/dev/null )
          cat robotis_ai_setup/installer/sfx/7zSD.sfx \
              robotis_ai_setup/installer/sfx/config.txt \
              archive.7z > EduBotics_Setup_Full.exe
          rm -f archive.7z
          ls -lh EduBotics_Setup_Full.exe

      - name: Upload to Cloudflare R2 (multipart) + verify
        if: steps.pre.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          cd_header="attachment; filename=EduBotics_Setup_Full.exe"
          # Stable name (hand this URL to new students) + an immutable versioned copy.
          for key in "EduBotics_Setup_Full.exe" "EduBotics_Setup_Full_${IMAGE_TAG}.exe"; do
            aws s3 cp EduBotics_Setup_Full.exe "s3://${R2_BUCKET}/${key}" \
              --endpoint-url "$endpoint" \
              --content-type application/octet-stream \
              --content-disposition "$cd_header"
          done
          # head-object so a checksum/region failure surfaces LOUDLY rather than
          # being masked by continue-on-error (which would otherwise leave the
          # student download URL 404'ing silently).
          aws s3api head-object --bucket "$R2_BUCKET" --key "EduBotics_Setup_Full.exe" --endpoint-url "$endpoint"
          echo "Uploaded EduBotics_Setup_Full.exe (${IMAGE_TAG}) to R2."

  # ── W6: Flip the student auto-update gate (must run AFTER the installer
  # .exe is attached to the GH Release, so /version never advertises a
  # version whose download asset 404s) ──
  #
  # Sets GUI_VERSION / GUI_DOWNLOAD_URL / GUI_RELEASE_REPO on the cloud-api
  # Railway service. The variable change triggers ONE redeploy that picks
  # up all three atomically; /version then advertises the new version and
  # existing student installs auto-update — which lands a new installer
  # whose baked docker/versions.env pins the matching immutable IMAGE_TAG,
  # so the pulled images can't drift from the GUI version.
  #
  # Tag-push only: on workflow_dispatch the installer's Release-attach step
  # is skipped (no tag), so there's no asset to advertise.
  publish-gui-version:
    name: W6. Publish GUI auto-update gate
    needs: [installer]
    if: always() && needs.installer.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}  # talks only to Railway via RAILWAY_TOKEN; no GITHUB_TOKEN use
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI via npm
        run: |
          npm install -g @railway/cli
          railway --version
      - name: Set GUI auto-update env vars on the cloud-api service
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_REPO: ${{ github.repository }}
        run: |
          set -e
          # github.ref_name on a tag push is the bare tag (e.g. "v2.5.4").
          # GUI_VERSION is the numeric version with the leading "v" stripped;
          # the download URL keeps the "v" since that's the GH Release tag.
          TAG="${GIT_REF_NAME}"
          VERSION="${TAG#v}"
          DOWNLOAD_URL="https://github.com/${GIT_REPO}/releases/download/${TAG}/EduBotics_Setup.exe"
          echo "Publishing GUI update gate: version=${VERSION} url=${DOWNLOAD_URL}"

          # Set the two non-triggering vars first with --skip-deploys, then
          # GUI_VERSION WITHOUT it so exactly ONE redeploy fires and picks up
          # all three atomically (mirrors railway-deploy-cloud-api.yml's
          # BUILD_COMMIT pattern).
          railway variable set "GUI_RELEASE_REPO=${GIT_REPO}" \
              --service scintillating-empathy --environment production \
              --skip-deploys >/dev/null
          railway variable set "GUI_DOWNLOAD_URL=${DOWNLOAD_URL}" \
              --service scintillating-empathy --environment production \
              --skip-deploys >/dev/null
          railway variable set "GUI_VERSION=${VERSION}" \
              --service scintillating-empathy --environment production >/dev/null
          echo "  set GUI_RELEASE_REPO, GUI_DOWNLOAD_URL, GUI_VERSION (redeploy triggered)"
      - name: Verify /version advertises the new release
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          EXPECTED="${GIT_REF_NAME#v}"
          URL=https://scintillating-empathy-production-1068.up.railway.app/version
          # Railway redeploy + healthcheck on an env-only change is fast, but
          # pad for cold-pod routing. 5-min budget like the cloud-api gate.
          for attempt in $(seq 1 150); do
            BODY=$(curl -fsS --max-time 5 "$URL" 2>/dev/null || true)
            if [ -n "$BODY" ]; then
              if python3 -c "import json, sys; d = json.loads(sys.argv[1]); sys.exit(0 if d.get('version') == sys.argv[2] else 1)" "$BODY" "$EXPECTED"; then
                echo "/version now advertises ${EXPECTED}."
                echo "  body: $BODY"
                exit 0
              fi
              ACTUAL=$(echo "$BODY" | python3 -c "import json, sys; print(json.loads(sys.stdin.read()).get('version', '<missing>'))" 2>/dev/null || echo "<unparseable>")
              echo "Attempt $attempt: /version=$ACTUAL, expected $EXPECTED"
            else
              echo "Attempt $attempt: $URL → curl failed or empty body"
            fi
            sleep 2
          done
          echo "::error::/version did not advertise ${EXPECTED} within 5 minutes after setting Railway env vars."
          exit 1
