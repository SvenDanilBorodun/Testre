name: release

# Top-level release dispatcher. Chains the five CI-driven surface
# workflows in the golden order:
#
#   W1 supabase-migrate
#       │
#       ▼
#   W2 railway-deploy-cloud-api
#       │
#       ▼
#   W3 railway-deploy-teacher-web
#       │
#       ▼
#   W4 docker-publish        (builds + pushes 3 amd64 + 2 jetson + 3 -opi images)
#       │
#       ▼
#   W5 release-installer
#       │
#       ▼
#   W5b pi-agent-tarball     (attaches edubotics-pi-agent.tar.gz for the Orange Pi)
#       │
#       ▼
#   W6 publish-gui-version
#
# release-installer MUST run AFTER docker-publish — the installer's
# auto-update poll directs students at the `:vX.Y.Z` image tags that
# docker-publish pushes, so attaching the .exe before those tags exist
# causes first-boot pull 404 on every student that picks up the update.
#
# pi-agent-tarball (W5b) is W5-adjacent — it packages the Orange Pi agent
# (robotis_ai_setup/pi_agent/) into edubotics-pi-agent.tar.gz and attaches it
# to the SAME GH Release, so the Pi's SHA-256-verified self-update
# (pi_agent/update_checker.py) has an asset to fetch. It runs AFTER the
# installer created the Release and BEFORE W6, so W6 can hash the exact
# attached tarball into PI_AGENT_SHA256 (attach-asset-first, advertise-last —
# the same race-safety the .exe hash already has). The -opi container images
# ride W4 via docker-publish's existing matrix; W5b handles ONLY the agent
# tarball, not the images.
#
# publish-gui-version (W6) MUST run AFTER release-installer — it flips the
# Railway GUI_VERSION/GUI_DOWNLOAD_URL env vars that drive the student
# auto-update gate (/version). Setting them before the .exe is attached to
# the GH Release would point every updating student at a 404. Automating
# this here removes the manual "bump Railway env after gh release" step
# (CLAUDE.md §"Bumping product VERSION") that silently drifted — a GUI
# could auto-update while the images it pulls stayed on a stale `:latest`.
#
# Modal deploys are MANUAL (operator runs `modal deploy modal_app.py`
# from their workstation). Modal's image build occurs in Modal's
# infrastructure, not on GH runners, and the auth / image-build feedback
# loop is slow to debug in CI. Until we have a strong reason to move
# Modal into CI, the operator owns it.
#
# Fires on tag pushes (v*.*.*) for full coordinated releases. For
# everyday merges to main, each surface workflow fires INDEPENDENTLY
# via its own path-filter (only what changed redeploys). This file is
# the coordinator for whole-stack releases.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      reason:
        description: "Audit reason for full release"
        required: true
        type: string
      skip_supabase:
        description: "Skip the supabase-migrate step (use only if no schema change)"
        required: false
        default: false
        type: boolean

concurrency:
  # Only one release dispatch at a time. cancel-in-progress: true on
  # purpose — if you push v2.3.3 to fix a v2.3.2 CHANGELOG typo, the
  # newer tag should win. Each individual surface workflow has its own
  # serialised concurrency group so partial progress on the cancelled
  # run won't corrupt anything.
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Permissions are granted PER JOB (zizmor excessive-permissions) — each
# caller job grants exactly what its callee workflow declares, no more.
# CRITICAL (v2.3.2 + v2.3.3 startup_failure scar): GH refuses to start
# the run if any callee declares a permission stricter than the CALLER
# grants — "The workflow is requesting 'pull-requests: write', but is
# only allowed 'pull-requests: none'." When a callee's permissions
# change, the matching caller job below MUST change in the same PR:
#   supabase-migrate.yml   → contents: read + pull-requests: write
#   railway-deploy-*.yml   → contents: read
#   docker-publish.yml     → contents: read + packages: write (GHCR push)
#   release-installer.yml  → contents: write (GH-Release asset upload)
# The pi-agent-tarball job (W5b) is an INLINE job (not a `uses:` callee), so the
# superset rule does not apply to it — it simply grants its own contents: write
# for the softprops asset upload.
permissions: {}

jobs:
  # ── W1: Supabase ──────────────────────────────────────────────────
  supabase:
    name: W1. Apply migrations
    # `inputs` context only exists on workflow_dispatch / workflow_call events.
    # On a tag push, referencing `inputs.skip_supabase` triggers a workflow
    # validation error ("Unrecognized named-value: 'inputs'") which surfaces
    # as a startup_failure on the whole release — observed on v2.3.2's first
    # push. Gate on github.event_name first so the `inputs` access only
    # evaluates on the workflow_dispatch path. The `||` operator in GH
    # Actions short-circuits, so the inputs access is never reached on push.
    if: >-
      ${{
        github.event_name != 'workflow_dispatch' ||
        !fromJSON(inputs.skip_supabase || 'false')
      }}
    permissions:
      contents: read
      pull-requests: write  # supabase-migrate.yml declares it (branch-PR comments)
    uses: ./.github/workflows/supabase-migrate.yml
    secrets: inherit

  # ── W2: Cloud API (after Supabase so the FastAPI sees the new schema) ──
  # Note: if you bumped a Modal-side dependency in this release, run
  # `modal deploy modal_app.py` MANUALLY BEFORE pushing the tag so the
  # worker is ready before the FastAPI tries to call it.
  cloud-api:
    name: W2. Deploy cloud_training_api
    needs: [supabase]
    if: always() && (needs.supabase.result == 'success' || needs.supabase.result == 'skipped')
    permissions:
      contents: read
    uses: ./.github/workflows/railway-deploy-cloud-api.yml
    secrets: inherit

  # ── W3: Teacher web (after cloud-api so it can reach the new endpoints) ──
  teacher-web:
    name: W3. Deploy teacher-web
    needs: [cloud-api]
    if: always() && needs.cloud-api.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/railway-deploy-teacher-web.yml
    secrets: inherit

  # ── W4: Docker images (student installs pull these) ──
  docker:
    name: W4. Build + publish Docker images
    needs: [teacher-web]
    if: always() && needs.teacher-web.result == 'success'
    permissions:
      contents: read
      packages: write  # docker-publish.yml's retag job pushes to GHCR (zizmor superset rule)
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit

  # ── W5: Installer .exe (must run AFTER docker so the auto-update
  # poll has matching :vX.Y.Z image tags to pull on first boot) ──
  #
  # Only fires when docker succeeded (NOT skipped) — the installer's
  # existence implies the images exist. If docker was skipped, that's
  # because the trigger only changed installer-irrelevant code, and we
  # shouldn't be cutting a new installer in that case either.
  installer:
    name: W5. Build + attach installer .exe
    needs: [docker]
    if: always() && needs.docker.result == 'success'
    permissions:
      contents: write  # release-installer.yml uploads the .exe to the GH Release
    uses: ./.github/workflows/release-installer.yml
    secrets: inherit

  # ── W5b: Package + attach the Orange Pi agent tarball (W5-adjacent) ──
  #
  # Builds edubotics-pi-agent.tar.gz from robotis_ai_setup/pi_agent/ (the exact
  # name pi_agent/update_checker.py::AGENT_ASSET_NAME expects) and attaches it
  # to the SAME GH Release the installer just created. The tarball's top-level
  # is `pi_agent/`, so the agent's self-update — which unpacks over
  # /opt/edubotics (agent.py::_apply_agent_update_and_restart) — refreshes
  # /opt/edubotics/pi_agent/ and keeps `python3 -m pi_agent.agent` working.
  #
  # Runs AFTER the installer (the Release must exist) and BEFORE W6 (which
  # hashes the exact attached tarball into PI_AGENT_SHA256). Tag-push only, for
  # the same reason as W6: on workflow_dispatch there is no Release to attach to.
  pi-agent-tarball:
    name: W5b. Build + attach pi-agent tarball
    needs: [installer]
    if: always() && needs.installer.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # softprops/action-gh-release: attach the tarball asset
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Build edubotics-pi-agent.tar.gz
        run: |
          set -e
          # VERSION-drift fix: bake the repo-root VERSION into the tarball as
          # pi_agent/VERSION so the extracted agent knows the exact release it
          # shipped from (pi_agent/constants.py PREFERS this packaged file over
          # its baked-in literal fallback). Copied into the package tree just
          # before tar and removed after, so the checkout tree stays clean.
          cp VERSION robotis_ai_setup/pi_agent/VERSION
          # Package the pi_agent/ package as the tarball's top-level directory,
          # excluding tests + bytecode (they never ship). `-C robotis_ai_setup`
          # keeps the archive members rooted at `pi_agent/...`.
          tar \
            --exclude='pi_agent/tests' \
            --exclude='pi_agent/tests/*' \
            --exclude='*/__pycache__/*' \
            --exclude='*/__pycache__' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf edubotics-pi-agent.tar.gz \
            -C robotis_ai_setup pi_agent
          rm -f robotis_ai_setup/pi_agent/VERSION
          echo "Tarball contents (first 20 entries):"
          tar -tzf edubotics-pi-agent.tar.gz | head -20
          # Sanity gates: the agent entry-point must be present, tests must not.
          if ! tar -tzf edubotics-pi-agent.tar.gz | grep -q '^pi_agent/agent\.py$'; then
            echo "::error::edubotics-pi-agent.tar.gz is missing pi_agent/agent.py"
            exit 1
          fi
          if tar -tzf edubotics-pi-agent.tar.gz | grep -q '^pi_agent/tests/'; then
            echo "::error::edubotics-pi-agent.tar.gz unexpectedly contains pi_agent/tests/"
            exit 1
          fi
          # VERSION gate: the packaged pi_agent/VERSION must exist AND match the
          # repo-root VERSION this release built from (guards a silent drift if
          # the cp above ever regresses).
          if ! tar -tzf edubotics-pi-agent.tar.gz | grep -q '^pi_agent/VERSION$'; then
            echo "::error::edubotics-pi-agent.tar.gz is missing pi_agent/VERSION"
            exit 1
          fi
          PKG_VERSION="$(tar -xzOf edubotics-pi-agent.tar.gz pi_agent/VERSION | tr -d '[:space:]')"
          REPO_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$PKG_VERSION" != "$REPO_VERSION" ]; then
            echo "::error::packaged pi_agent/VERSION ($PKG_VERSION) != repo VERSION ($REPO_VERSION)"
            exit 1
          fi
          echo "OK: packaged pi_agent/VERSION = $PKG_VERSION"
          ls -la edubotics-pi-agent.tar.gz

      - name: Attach pi-agent tarball to GitHub Release (tag pushes only)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: edubotics-pi-agent.tar.gz
          fail_on_unmatched_files: true
          # Explicit token — softprops v3.0.0's implicit GITHUB_TOKEN discovery
          # fails under workflow_call/tag chains (same fix as release-installer.yml).
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

  # ── W6: Flip the student auto-update gate (must run AFTER the installer
  # .exe is attached to the GH Release, so /version never advertises a
  # version whose download asset 404s) ──
  #
  # Sets GUI_VERSION / GUI_DOWNLOAD_URL / GUI_RELEASE_REPO on the cloud-api
  # Railway service. The variable change triggers ONE redeploy that picks
  # up all three atomically; /version then advertises the new version and
  # existing student installs auto-update — which lands a new installer
  # whose baked docker/versions.env pins the matching immutable IMAGE_TAG,
  # so the pulled images can't drift from the GUI version.
  #
  # Tag-push only: on workflow_dispatch the installer's Release-attach step
  # is skipped (no tag), so there's no asset to advertise.
  publish-gui-version:
    name: W6. Publish GUI auto-update gate
    # Also needs pi-agent-tarball: W6 hashes the EXACT attached Pi tarball into
    # PI_AGENT_SHA256, so when it IS attached the asset must already be on the
    # Release. But the gate is `!= 'failure'` (success OR skipped), NOT
    # `== 'success'`: the mature Windows .exe auto-update advertisement must not
    # be blocked by a transient Pi-tarball attach hiccup. The PI_AGENT_SHA256
    # curl below already degrades to empty-on-failure, so a missing Pi tarball
    # advertises NO Pi hash (never a stale one) instead of blocking the release.
    needs: [installer, pi-agent-tarball]
    if: >-
      always()
      && needs.installer.result == 'success'
      && needs.pi-agent-tarball.result != 'failure'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}  # talks only to Railway via RAILWAY_TOKEN; no GITHUB_TOKEN use
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI via npm
        run: |
          npm install -g @railway/cli
          railway --version
      - name: Set GUI auto-update env vars on the cloud-api service
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_REPO: ${{ github.repository }}
        run: |
          set -e
          # github.ref_name on a tag push is the bare tag (e.g. "v2.5.4").
          # GUI_VERSION is the numeric version with the leading "v" stripped;
          # the download URL keeps the "v" since that's the GH Release tag.
          TAG="${GIT_REF_NAME}"
          VERSION="${TAG#v}"
          DOWNLOAD_URL="https://github.com/${GIT_REPO}/releases/download/${TAG}/EduBotics_Setup.exe"
          echo "Publishing GUI update gate: version=${VERSION} url=${DOWNLOAD_URL}"

          # Hash the EXACT .exe asset W5 just attached, so /version can advertise
          # an integrity hash the GUI verifies before launching the installer as
          # admin. On failure, ADVERTISE NO HASH (empty) — never a stale one, or
          # the GUI would reject the new .exe against the previous release's
          # hash and every student would be unable to update.
          SHA=""
          if curl -fsSL --retry 3 -o /tmp/EduBotics_Setup.exe "$DOWNLOAD_URL"; then
            SHA="$(sha256sum /tmp/EduBotics_Setup.exe | awk '{print $1}')"
            echo "  installer sha256=${SHA}"
          else
            echo "::warning::could not download the installer asset to hash it — advertising version without an integrity hash (GUI falls back to the Content-Length guard)"
          fi

          # Hash the EXACT edubotics-pi-agent.tar.gz that W5b just attached, so
          # /version can advertise a hash the Pi agent verifies before unpacking
          # the tarball over the running agent (pi_agent/update_checker.py). Same
          # empty-on-failure / never-stale posture as the installer hash: on a
          # download failure ADVERTISE NO HASH — a stale one would make every Pi
          # reject the new tarball against the previous release's checksum.
          PI_AGENT_URL="https://github.com/${GIT_REPO}/releases/download/${TAG}/edubotics-pi-agent.tar.gz"
          PI_SHA=""
          if curl -fsSL --retry 3 -o /tmp/edubotics-pi-agent.tar.gz "$PI_AGENT_URL"; then
            PI_SHA="$(sha256sum /tmp/edubotics-pi-agent.tar.gz | awk '{print $1}')"
            echo "  pi-agent sha256=${PI_SHA}"
          else
            echo "::warning::could not download the pi-agent tarball to hash it — advertising version without a Pi integrity hash (agent falls back to the Content-Length guard)"
          fi

          # Set the non-triggering vars first with --skip-deploys, then
          # GUI_VERSION WITHOUT it so exactly ONE redeploy fires and picks up
          # all of them atomically (mirrors railway-deploy-cloud-api.yml's
          # BUILD_COMMIT pattern). GUI_INSTALLER_SHA256 + PI_AGENT_SHA256 are
          # always set (to their hash or empty) so neither can be stale from a
          # prior release. The Pi's download URL is DERIVED cloud-side from
          # GUI_RELEASE_REPO + GUI_VERSION (routes/version.py), so there is no
          # separate PI_AGENT_DOWNLOAD_URL var to set here.
          railway variable set "GUI_RELEASE_REPO=${GIT_REPO}" \
              --service scintillating-empathy --environment production \
              --skip-deploys >/dev/null
          railway variable set "GUI_DOWNLOAD_URL=${DOWNLOAD_URL}" \
              --service scintillating-empathy --environment production \
              --skip-deploys >/dev/null
          railway variable set "GUI_INSTALLER_SHA256=${SHA}" \
              --service scintillating-empathy --environment production \
              --skip-deploys >/dev/null
          railway variable set "PI_AGENT_SHA256=${PI_SHA}" \
              --service scintillating-empathy --environment production \
              --skip-deploys >/dev/null
          railway variable set "GUI_VERSION=${VERSION}" \
              --service scintillating-empathy --environment production >/dev/null
          echo "  set GUI_RELEASE_REPO, GUI_DOWNLOAD_URL, GUI_INSTALLER_SHA256, PI_AGENT_SHA256, GUI_VERSION (redeploy triggered)"
      - name: Verify /version advertises the new release
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          EXPECTED="${GIT_REF_NAME#v}"
          URL=https://scintillating-empathy-production-1068.up.railway.app/version
          # Railway redeploy + healthcheck on an env-only change is fast, but
          # pad for cold-pod routing. 5-min budget like the cloud-api gate.
          for attempt in $(seq 1 150); do
            BODY=$(curl -fsS --max-time 5 "$URL" 2>/dev/null || true)
            if [ -n "$BODY" ]; then
              if python3 -c "import json, sys; d = json.loads(sys.argv[1]); sys.exit(0 if d.get('version') == sys.argv[2] else 1)" "$BODY" "$EXPECTED"; then
                echo "/version now advertises ${EXPECTED}."
                echo "  body: $BODY"
                exit 0
              fi
              ACTUAL=$(echo "$BODY" | python3 -c "import json, sys; print(json.loads(sys.stdin.read()).get('version', '<missing>'))" 2>/dev/null || echo "<unparseable>")
              echo "Attempt $attempt: /version=$ACTUAL, expected $EXPECTED"
            else
              echo "Attempt $attempt: $URL → curl failed or empty body"
            fi
            sleep 2
          done
          echo "::error::/version did not advertise ${EXPECTED} within 5 minutes after setting Railway env vars."
          exit 1
