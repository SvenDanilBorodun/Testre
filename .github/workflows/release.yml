name: release

# Top-level release dispatcher. Chains the five CI-driven surface
# workflows in the golden order:
#
#   W1 supabase-migrate
#       │
#       ▼
#   W2 railway-deploy-cloud-api
#       │
#       ▼
#   W3 railway-deploy-teacher-web
#       │
#       ▼
#   W4 docker-publish        (builds + pushes 3 amd64 + 2 jetson + 3 -opi images)
#       │
#       ▼
#   W5 release-installer
#       │
#       ▼
#   W5b pi-agent-tarball     (attaches edubotics-pi-agent.tar.gz for the Orange Pi)
#       │
#       ▼
#   W6 publish-gui-version
#
# release-installer MUST run AFTER docker-publish — the installer's
# auto-update poll directs students at the `:vX.Y.Z` image tags that
# docker-publish pushes, so attaching the .exe before those tags exist
# causes first-boot pull 404 on every student that picks up the update.
#
# pi-agent-tarball (W5b) is W5-adjacent — it packages the Orange Pi agent
# (robotis_ai_setup/pi_agent/) into edubotics-pi-agent.tar.gz and attaches it
# to the SAME GH Release, so the Pi's SHA-256-verified self-update
# (pi_agent/update_checker.py) has an asset to fetch. It runs AFTER the
# installer created the Release and BEFORE W6, so W6 can hash the exact
# attached tarball into PI_AGENT_SHA256 (attach-asset-first, advertise-last —
# the same race-safety the .exe hash already has). The -opi container images
# ride W4 via docker-publish's existing matrix; W5b handles ONLY the agent
# tarball, not the images.
#
# publish-gui-version (W6) MUST run AFTER release-installer — it flips the
# Railway GUI_VERSION/GUI_DOWNLOAD_URL env vars that drive the student
# auto-update gate (/version). Setting them before the .exe is attached to
# the GH Release would point every updating student at a 404. Automating
# this here removes the manual "bump Railway env after gh release" step
# (CLAUDE.md §"Bumping product VERSION") that silently drifted — a GUI
# could auto-update while the images it pulls stayed on a stale `:latest`.
#
# Modal deploys are MANUAL (operator runs `modal deploy modal_app.py`
# from their workstation). Modal's image build occurs in Modal's
# infrastructure, not on GH runners, and the auth / image-build feedback
# loop is slow to debug in CI. Until we have a strong reason to move
# Modal into CI, the operator owns it.
#
# Fires on tag pushes (v*.*.*) for full coordinated releases. For
# everyday merges to main, each surface workflow fires INDEPENDENTLY
# via its own path-filter (only what changed redeploys). This file is
# the coordinator for whole-stack releases.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      reason:
        description: "Audit reason for full release"
        required: true
        type: string
      skip_supabase:
        description: "Skip the supabase-migrate step (use only if no schema change)"
        required: false
        default: false
        type: boolean

concurrency:
  # Only one release dispatch at a time. cancel-in-progress: true on
  # purpose — if you push v2.3.3 to fix a v2.3.2 CHANGELOG typo, the
  # newer tag should win. Each individual surface workflow has its own
  # serialised concurrency group so partial progress on the cancelled
  # run won't corrupt anything.
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Permissions are granted PER JOB (zizmor excessive-permissions) — each
# caller job grants exactly what its callee workflow declares, no more.
# CRITICAL (v2.3.2 + v2.3.3 startup_failure scar): GH refuses to start
# the run if any callee declares a permission stricter than the CALLER
# grants — "The workflow is requesting 'pull-requests: write', but is
# only allowed 'pull-requests: none'." When a callee's permissions
# change, the matching caller job below MUST change in the same PR:
#   supabase-migrate.yml   → contents: read + pull-requests: write
#   railway-deploy-*.yml   → contents: read
#   docker-publish.yml     → contents: read + packages: write (GHCR push)
#   release-installer.yml  → contents: write (GH-Release asset upload)
# The pi-agent-tarball job (W5b) is an INLINE job (not a `uses:` callee), so the
# superset rule does not apply to it — it simply grants its own contents: write
# for the softprops asset upload.
permissions: {}

jobs:
  # ── Preflight: the pushed git tag MUST equal the in-tree VERSION file ──
  #
  # W6 advertises the auto-update gate off the pushed TAG (VERSION="${TAG#v}"
  # below), while the pi-agent tarball (W5b) and the installer (.exe, W5) bake
  # the in-tree VERSION FILE. If someone tags vX.Y.Z WITHOUT bumping the VERSION
  # file in the same commit, /version advertises a version the attached assets
  # don't carry: every Orange Pi + Windows GUI then sees a "newer version" it can
  # never satisfy (the installer/tarball self-reports the OLD file version), i.e.
  # a permanent, non-closable forced-update loop across the whole fleet.
  #
  # Fail the WHOLE release here, before W1 touches the DB, if they disagree.
  # This job runs on workflow_dispatch too but only ASSERTS on a tag push
  # (dispatch has no tag to compare) — so its result is ALWAYS 'success' off a
  # tag, which keeps the needs-graph below intact for the dispatch path. It must
  # NOT self-skip on dispatch, or every job that needs it would skip too.
  #
  # Threaded into the graph via supabase (W1) AND cloud-api (W2): W1 has no
  # always()/skip tolerance so a preflight FAILURE skips it; W2 tolerates a
  # SKIPPED supabase (skip_supabase dispatch) so it must gate on the preflight
  # result explicitly. W3→W6 + pi-agent-tarball each require their parent
  # == 'success', so a skipped W2 cascades the skip through the rest.
  version-preflight:
    name: Preflight. Assert tag == VERSION file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Inline job (not a `uses:` callee), so the caller-permissions-superset rule
    # does not apply — it just needs contents: read to check out and read VERSION.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Assert the pushed tag matches the VERSION file
        # GITHUB_REF is a built-in runner env var (no ${{ }} → no template
        # injection surface). On a tag push it is refs/tags/vX.Y.Z.
        run: |
          set -e
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG_VERSION="${GITHUB_REF#refs/tags/v}"
              FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
              if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
                echo "::error::Release tag v${TAG_VERSION} != in-tree VERSION file (${FILE_VERSION}). Bump VERSION (+ installer/robotis_ai_setup.iss AppVersion + gui/app/constants.py + pi_agent/constants.py) in the SAME commit you tag — otherwise /version advertises v${TAG_VERSION} while the .exe + pi-agent tarball carry ${FILE_VERSION}, and every Pi + Windows GUI enters a permanent forced-update loop."
                exit 1
              fi
              # The 3 FALLBACK LITERALS must also match. version-preflight used to
              # guard ONLY the VERSION file, but a PyInstaller GUI and a packaged
              # pi_agent fall back to these literals when the VERSION file isn't
              # reachable — a stale literal that reads LOW re-offers the same
              # forced update forever (CLAUDE.md §"Bumping product VERSION").
              #
              # `|| true` on the two grep pipelines is LOAD-BEARING, not noise.
              # A pipeline's status is its LAST command's, and `grep -oE` exits 1
              # on no match — so under this step's `set -e` a literal that no
              # longer matches (e.g. someone refactors the fallback to
              # `return _FALLBACK_VERSION`, which CLAUDE.md explicitly warns
              # against) killed the job right there. The `|| { echo ... }`
              # diagnostic below never printed and the `${...:-<none>}` fallback
              # was dead code: the release stopped with a bare non-zero exit and
              # no message naming the file. The .iss check above degrades
              # correctly already because its pipeline ends in `tr` (always 0) —
              # that inconsistency was the tell. This preflight gates ALL FOUR
              # version sites, so it must fail LOUDLY, never silently.
              lit_fail=0
              ISS_VERSION="$(grep -E '^AppVersion=' robotis_ai_setup/installer/robotis_ai_setup.iss | head -1 | cut -d= -f2 | tr -d '[:space:]')"
              [ "$ISS_VERSION" = "$FILE_VERSION" ] || { echo "::error::installer/robotis_ai_setup.iss AppVersion=${ISS_VERSION:-<none>} != VERSION ${FILE_VERSION}. Keep it a plain 'AppVersion=X.Y.Z' line."; lit_fail=1; }
              GUI_LITERAL="$(grep -oE 'return "[0-9]+\.[0-9]+\.[0-9]+"' robotis_ai_setup/gui/app/constants.py | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
              [ "$GUI_LITERAL" = "$FILE_VERSION" ] || { echo "::error::gui/app/constants.py fallback literal ${GUI_LITERAL:-<none>} != VERSION ${FILE_VERSION}. Keep it a plain 'return \"X.Y.Z\"' — this check is a source grep."; lit_fail=1; }
              PI_LITERAL="$(grep -oE 'return "[0-9]+\.[0-9]+\.[0-9]+"' robotis_ai_setup/pi_agent/constants.py | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
              [ "$PI_LITERAL" = "$FILE_VERSION" ] || { echo "::error::pi_agent/constants.py fallback literal ${PI_LITERAL:-<none>} != VERSION ${FILE_VERSION}. Keep it a plain 'return \"X.Y.Z\"' — a literal that reads LOW re-offers the same forced update to every Pi forever."; lit_fail=1; }
              [ "$lit_fail" = "0" ] || exit 1
              echo "OK: tag v${TAG_VERSION} == VERSION file == iss/gui/pi_agent literals (${FILE_VERSION})"
              ;;
            *)
              echo "Not a tag push (ref=${GITHUB_REF}) — skipping the tag/VERSION equality assertion (nothing to compare)."
              ;;
          esac

  # ── W1: Supabase ──────────────────────────────────────────────────
  supabase:
    name: W1. Apply migrations
    # `inputs` context only exists on workflow_dispatch / workflow_call events.
    # On a tag push, referencing `inputs.skip_supabase` triggers a workflow
    # validation error ("Unrecognized named-value: 'inputs'") which surfaces
    # as a startup_failure on the whole release — observed on v2.3.2's first
    # push. Gate on github.event_name first so the `inputs` access only
    # evaluates on the workflow_dispatch path. The `||` operator in GH
    # Actions short-circuits, so the inputs access is never reached on push.
    # version-preflight is a hard prerequisite: it runs always (success off a
    # tag), so on both the tag-push and workflow_dispatch paths this needs is
    # satisfied — EXCEPT when the tag/VERSION assertion FAILS, which skips W1
    # (no always() here) so no migrations run against a mismatched release.
    needs: [version-preflight]
    if: >-
      ${{
        github.event_name != 'workflow_dispatch' ||
        !fromJSON(inputs.skip_supabase || 'false')
      }}
    permissions:
      contents: read
      pull-requests: write  # supabase-migrate.yml declares it (branch-PR comments)
    uses: ./.github/workflows/supabase-migrate.yml
    secrets: inherit

  # ── W2: Cloud API (after Supabase so the FastAPI sees the new schema) ──
  # Note: if you bumped a Modal-side dependency in this release, run
  # `modal deploy modal_app.py` MANUALLY BEFORE pushing the tag so the
  # worker is ready before the FastAPI tries to call it.
  cloud-api:
    name: W2. Deploy cloud_training_api
    # W2 uses always() and deliberately tolerates a SKIPPED supabase (the
    # skip_supabase dispatch path), so a preflight FAILURE — which SKIPS
    # supabase rather than failing it — would otherwise let W2 (and the whole
    # chain below it) proceed. Gate on the preflight result explicitly so a
    # tag/VERSION mismatch blocks W2, and W3→W6 cascade the skip via their
    # parent == 'success' gates.
    needs: [version-preflight, supabase]
    if: >-
      always()
      && needs.version-preflight.result == 'success'
      && (needs.supabase.result == 'success' || needs.supabase.result == 'skipped')
    permissions:
      contents: read
    uses: ./.github/workflows/railway-deploy-cloud-api.yml
    secrets: inherit

  # ── W3: Teacher web (after cloud-api so it can reach the new endpoints) ──
  teacher-web:
    name: W3. Deploy teacher-web
    needs: [cloud-api]
    if: always() && needs.cloud-api.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/railway-deploy-teacher-web.yml
    secrets: inherit

  # ── W4: Docker images (student installs pull these) ──
  docker:
    name: W4. Build + publish Docker images
    needs: [teacher-web]
    if: always() && needs.teacher-web.result == 'success'
    permissions:
      contents: read
      packages: write  # docker-publish.yml's retag job pushes to GHCR (zizmor superset rule)
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit

  # ── W5: Installer .exe (must run AFTER docker so the auto-update
  # poll has matching :vX.Y.Z image tags to pull on first boot) ──
  #
  # Only fires when docker succeeded (NOT skipped) — the installer's
  # existence implies the images exist. If docker was skipped, that's
  # because the trigger only changed installer-irrelevant code, and we
  # shouldn't be cutting a new installer in that case either.
  installer:
    name: W5. Build + attach installer .exe
    needs: [docker]
    if: always() && needs.docker.result == 'success'
    permissions:
      contents: write  # release-installer.yml uploads the .exe to the GH Release
    uses: ./.github/workflows/release-installer.yml
    secrets: inherit

  # ── W5b: Package + attach the Orange Pi agent tarball (W5-adjacent) ──
  #
  # Builds edubotics-pi-agent.tar.gz from robotis_ai_setup/pi_agent/ (the exact
  # name pi_agent/update_checker.py::AGENT_ASSET_NAME expects) and attaches it
  # to the SAME GH Release the installer just created. The tarball's top-level
  # is `pi_agent/`, so the agent's self-update — which unpacks over
  # /opt/edubotics (agent.py::_apply_agent_update_and_restart) — refreshes
  # /opt/edubotics/pi_agent/ and keeps `python3 -m pi_agent.agent` working.
  #
  # Runs AFTER the installer (the Release must exist) and BEFORE W6 (which
  # hashes the exact attached tarball into PI_AGENT_SHA256). Tag-push only, for
  # the same reason as W6: on workflow_dispatch there is no Release to attach to.
  pi-agent-tarball:
    name: W5b. Build + attach pi-agent tarball
    needs: [installer]
    if: always() && needs.installer.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # softprops/action-gh-release: attach the tarball asset
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Build edubotics-pi-agent.tar.gz
        run: |
          set -e
          REPO_VERSION="$(tr -d '[:space:]' < VERSION)"
          # VERSION-drift fix: bake the repo-root VERSION into the tarball as
          # pi_agent/VERSION so the extracted agent knows the exact release it
          # shipped from (pi_agent/constants.py PREFERS this packaged file over
          # its baked-in literal fallback). Copied into the package tree just
          # before tar and removed after, so the checkout tree stays clean.
          cp VERSION robotis_ai_setup/pi_agent/VERSION

          # IMAGE_TAG pin — the Pi's half of what the Windows installer has done
          # since release-installer.yml started baking docker/versions.env into
          # its payload, with a comment that describes this exact bug: "Without
          # this, they fall back to ':latest' — which is fine immediately after a
          # release but drifts past the .exe."
          #
          # The Pi had no such payload. pi_agent/constants.py resolves IMAGE_TAG
          # as env override → docker/versions.env → "latest", and on a real Pi
          # ALL THREE steps landed on "latest": the systemd unit's
          # EnvironmentFile carries IMAGE_TAG, not the EDUBOTICS_IMAGE_TAG name
          # _resolve_setting actually reads, and no versions.env was ever
          # shipped. Since docker-publish.yml pushes :latest on EVERY push to
          # main, every Orange Pi in every classroom silently tracked main HEAD
          # instead of the release it was installed from — continuously, with no
          # version handshake anywhere to notice.
          #
          # Writing it INSIDE the packaged tree is what fixes it with no agent
          # code change: the tarball's top level is pi_agent/, setup.sh and the
          # self-update both rsync that tree to /opt/edubotics/pi_agent/ (their
          # only excludes are tests/__pycache__/*.pyc), and
          # /opt/edubotics/pi_agent/docker/versions.env is the FIRST path
          # _read_versions_env's upward walk probes.
          #
          # IMAGE_TAG only: REGISTRY/REGISTRY_FALLBACK already default to the
          # correct GHCR/Hub values in constants.py, and re-baking them here
          # would add a second place to keep in sync for no gain. The tag is the
          # one value that MUST move every release.
          mkdir -p robotis_ai_setup/pi_agent/docker
          cat > robotis_ai_setup/pi_agent/docker/versions.env <<EOF
          # Generated by .github/workflows/release.yml — DO NOT EDIT BY HAND.
          # Pins this Pi's containers to the release its agent shipped from.
          # Read by pi_agent/constants.py::_read_versions_env (env override
          # EDUBOTICS_IMAGE_TAG still wins, for a bench pinning a test build).
          IMAGE_TAG=${REPO_VERSION}
          EOF

          # Package the pi_agent/ package as the tarball's top-level directory,
          # excluding tests + bytecode (they never ship). `-C robotis_ai_setup`
          # keeps the archive members rooted at `pi_agent/...`.
          tar \
            --exclude='pi_agent/tests' \
            --exclude='pi_agent/tests/*' \
            --exclude='*/__pycache__/*' \
            --exclude='*/__pycache__' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf edubotics-pi-agent.tar.gz \
            -C robotis_ai_setup pi_agent
          rm -f robotis_ai_setup/pi_agent/VERSION
          rm -rf robotis_ai_setup/pi_agent/docker
          echo "Tarball contents (first 20 entries):"
          tar -tzf edubotics-pi-agent.tar.gz | head -20
          # Sanity gates: the agent entry-point must be present, tests must not.
          if ! tar -tzf edubotics-pi-agent.tar.gz | grep -q '^pi_agent/agent\.py$'; then
            echo "::error::edubotics-pi-agent.tar.gz is missing pi_agent/agent.py"
            exit 1
          fi
          if tar -tzf edubotics-pi-agent.tar.gz | grep -q '^pi_agent/tests/'; then
            echo "::error::edubotics-pi-agent.tar.gz unexpectedly contains pi_agent/tests/"
            exit 1
          fi
          # VERSION gate: the packaged pi_agent/VERSION must exist AND match the
          # repo-root VERSION this release built from (guards a silent drift if
          # the cp above ever regresses).
          if ! tar -tzf edubotics-pi-agent.tar.gz | grep -q '^pi_agent/VERSION$'; then
            echo "::error::edubotics-pi-agent.tar.gz is missing pi_agent/VERSION"
            exit 1
          fi
          PKG_VERSION="$(tar -xzOf edubotics-pi-agent.tar.gz pi_agent/VERSION | tr -d '[:space:]')"
          if [ "$PKG_VERSION" != "$REPO_VERSION" ]; then
            echo "::error::packaged pi_agent/VERSION ($PKG_VERSION) != repo VERSION ($REPO_VERSION)"
            exit 1
          fi
          echo "OK: packaged pi_agent/VERSION = $PKG_VERSION"
          # IMAGE_TAG gate (mirrors the pi_agent/VERSION gate above): the baked
          # versions.env must be present AND pin this exact release. If the bake
          # above ever regresses, the failure is SILENT on the rig — the agent
          # just falls back to :latest and the Pi quietly tracks main HEAD — so
          # the assertion has to live here, at the only moment it is observable.
          if ! tar -tzf edubotics-pi-agent.tar.gz | grep -q '^pi_agent/docker/versions\.env$'; then
            echo "::error::edubotics-pi-agent.tar.gz is missing pi_agent/docker/versions.env — every Pi installed from this release would pull :latest (main HEAD) instead of ${REPO_VERSION}"
            exit 1
          fi
          PKG_IMAGE_TAG="$(tar -xzOf edubotics-pi-agent.tar.gz pi_agent/docker/versions.env \
            | sed -n 's/^IMAGE_TAG=//p' | tr -d '[:space:]')"
          if [ "$PKG_IMAGE_TAG" != "$REPO_VERSION" ]; then
            echo "::error::packaged pi_agent/docker/versions.env pins IMAGE_TAG=${PKG_IMAGE_TAG}, expected the repo VERSION (${REPO_VERSION})"
            exit 1
          fi
          echo "OK: packaged pi_agent/docker/versions.env pins IMAGE_TAG = $PKG_IMAGE_TAG"
          ls -la edubotics-pi-agent.tar.gz

      - name: Attach pi-agent tarball to GitHub Release (tag pushes only)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: edubotics-pi-agent.tar.gz
          fail_on_unmatched_files: true
          # Explicit token — softprops v3.0.0's implicit GITHUB_TOKEN discovery
          # fails under workflow_call/tag chains (same fix as release-installer.yml).
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

  # ── W6: Flip the student auto-update gate (must run AFTER the installer
  # .exe is attached to the GH Release, so /version never advertises a
  # version whose download asset 404s) ──
  #
  # Sets GUI_VERSION / GUI_DOWNLOAD_URL / GUI_RELEASE_REPO on the cloud-api
  # Railway service. The variable change triggers ONE redeploy that picks
  # up all three atomically; /version then advertises the new version and
  # existing student installs auto-update — which lands a new installer
  # whose baked docker/versions.env pins the matching immutable IMAGE_TAG,
  # so the pulled images can't drift from the GUI version.
  #
  # Tag-push only: on workflow_dispatch the installer's Release-attach step
  # is skipped (no tag), so there's no asset to advertise.
  publish-gui-version:
    name: W6. Publish GUI auto-update gate
    # pi-agent-tarball is an ORDERING-ONLY dependency: W6 must run AFTER the Pi
    # tarball attach attempt so it can hash the EXACT attached asset into
    # PI_AGENT_SHA256 when it IS present. It is deliberately NOT gated on that
    # job's result — the mature Windows .exe auto-update advertisement must not
    # be blocked by a transient Pi-tarball hiccup. The PI_AGENT_SHA256 curl below
    # already degrades to empty-on-failure, so a missing/failed Pi tarball
    # advertises NO Pi hash (never a stale one) instead of withholding the whole
    # release. (Only `installer` success is required — that produces the .exe.)
    needs: [installer, pi-agent-tarball]
    if: >-
      always()
      && needs.installer.result == 'success'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}  # talks only to Railway via RAILWAY_TOKEN; no GITHUB_TOKEN use
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI via npm
        run: |
          npm install -g @railway/cli
          railway --version
      - name: Set GUI auto-update env vars on the cloud-api service
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_REPO: ${{ github.repository }}
        run: |
          set -e
          # github.ref_name on a tag push is the bare tag (e.g. "v2.5.4").
          # GUI_VERSION is the numeric version with the leading "v" stripped;
          # the download URL keeps the "v" since that's the GH Release tag.
          TAG="${GIT_REF_NAME}"
          VERSION="${TAG#v}"
          DOWNLOAD_URL="https://github.com/${GIT_REPO}/releases/download/${TAG}/EduBotics_Setup.exe"
          echo "Publishing GUI update gate: version=${VERSION} url=${DOWNLOAD_URL}"

          # Hash the EXACT .exe asset W5 just attached, so /version can advertise
          # an integrity hash the GUI verifies before launching the installer as
          # admin. On failure, ADVERTISE NO HASH (empty) — never a stale one, or
          # the GUI would reject the new .exe against the previous release's
          # hash and every student would be unable to update.
          SHA=""
          if curl -fsSL --retry 3 -o /tmp/EduBotics_Setup.exe "$DOWNLOAD_URL"; then
            SHA="$(sha256sum /tmp/EduBotics_Setup.exe | awk '{print $1}')"
            echo "  installer sha256=${SHA}"
          else
            echo "::warning::could not download the installer asset to hash it — advertising version without an integrity hash (GUI falls back to the Content-Length guard)"
          fi

          # Hash the EXACT edubotics-pi-agent.tar.gz that W5b just attached, so
          # /version can advertise a hash the Pi agent verifies before unpacking
          # the tarball over the running agent (pi_agent/update_checker.py). Same
          # empty-on-failure / never-stale posture as the installer hash: on a
          # download failure ADVERTISE NO HASH — a stale one would make every Pi
          # reject the new tarball against the previous release's checksum.
          PI_AGENT_URL="https://github.com/${GIT_REPO}/releases/download/${TAG}/edubotics-pi-agent.tar.gz"
          PI_SHA=""
          if curl -fsSL --retry 3 -o /tmp/edubotics-pi-agent.tar.gz "$PI_AGENT_URL"; then
            PI_SHA="$(sha256sum /tmp/edubotics-pi-agent.tar.gz | awk '{print $1}')"
            echo "  pi-agent sha256=${PI_SHA}"
          else
            # Unlike the .exe path (the GUI falls back to a Content-Length-only
            # guard on an empty hash), the Pi agent's update_checker treats an
            # empty pi_agent_sha256 as "no verified update available" and
            # advertises NO self-update — it refuses to unpack an unverified
            # tarball over the running agent. So an empty hash here means the Pi
            # simply won't self-update from this release (safe), not that it
            # applies the tarball behind only a length check.
            echo "::warning::could not download the pi-agent tarball to hash it — advertising version without a Pi integrity hash. The Pi agent then advertises NO self-update (it refuses an unverified tarball); it does NOT fall back to a Content-Length-only check like the .exe does."
          fi

          # GATE the Pi self-update advertisement on the -opi CONTAINER images
          # actually existing + being ANONYMOUSLY pullable on GHCR. The -opi build
          # leg is decoupled (continue-on-error in docker-publish.yml), so a
          # release can attach the pi-agent tarball (which pins IMAGE_TAG=X.Y.Z)
          # while the -opi images never published. A Pi that self-updates then
          # pins X.Y.Z and 404s on the next "Umgebung starten" → robot tier dead
          # fleet-wide. So if ANY of the three -opi:${VERSION} images is not
          # anonymously pullable (missing OR private — a Pi pulls anonymously)
          # on GHCR *or, failing that, on its Docker Hub twin* — mirroring the
          # Pi's own GHCR→Hub acquisition order — advertise NO Pi update
          # (empty hash), exactly as the tarball-download failure path does. A
          # Hub-only release still advertises, with a ::warning naming the
          # GHCR gap. The .exe advertisement is unaffected (amd64 images are
          # coupled + fatal in W4). Probe via pull-scoped registry tokens
          # (curl only — no docker dependency in this Railway-focused job).
          # Every outcome here is a ::warning + withhold — this gate has NO
          # hard-fail path, by design.
          #
          # Accept BOTH index/list AND single-image manifest media types: a
          # plain `docker push` publishes a bare single-arch manifest, and the
          # OCI dist-spec permits a 404/406 on an Accept mismatch — an
          # index-only Accept could silently withhold the Pi self-update on
          # every release if the pipeline ever stops list-wrapping its retags.
          # ONE comma-joined Accept header (the canonical HTTP form); four
          # separate -H Accept: flags happen to work but rely on the registry
          # iterating r.Header["Accept"] rather than reading the first value.
          #
          # TIME BUDGET — measured, not estimated. curl's --max-time is
          # PER-ATTEMPT, so `--retry 2 --max-time 15` against a blackholed host
          # costs 3x15 + 1 + 2 = 48 s (curl 8.7.1, timed). Four such curls per
          # repo (GHCR token + manifest, Hub token + manifest) = 192 s/repo, and
          # a budget check that only ran BETWEEN repos let repo 1 and repo 2
          # both finish first: 384 s of a 600 s job, leaving the /version verify
          # loop ~120 s of its explicit 300 s budget. A slow Railway cold-pod
          # redeploy then times the job out — RED, with GUI_VERSION already
          # flipped. So: --retry-max-time 10 + --max-time 8 caps each curl at
          # ~17 s (timed), and the budget is re-checked before EVERY registry
          # probe, not every repo. Worst case is now 150 s (budget) + one probe
          # (2 curls, ~34 s) = ~184 s, leaving the verify loop its full 5 min.
          _ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          # 0 = anonymously pullable
          # 1 = definitively NOT pullable (404 missing / 401-403 private)
          # 2 = PROBE FAILED (token fetch died, curl error, 5xx/429) — the
          #     registry never answered, so this must NOT be reported as "the
          #     image is missing": that message sends the operator off to
          #     rebuild opi when the real cause was a network blip.
          _probe_manifest() {
            local tok_url="$1" man_url="$2" tok code
            tok="$(curl -fsS --retry 2 --retry-connrefused --retry-max-time 10 --max-time 8 \
              "$tok_url" 2>/dev/null | sed -E 's/.*"token":"([^"]+)".*/\1/')"
            [ -n "$tok" ] || return 2
            code="$(curl -fsS --retry 2 --retry-connrefused --retry-max-time 10 --max-time 8 \
              -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${tok}" -H "Accept: ${_ACCEPT}" \
              "$man_url" 2>/dev/null)"
            case "$code" in
              200)         return 0 ;;
              401|403|404) return 1 ;;
              *)           return 2 ;;
            esac
          }
          _probe_ghcr() {
            _probe_manifest \
              "https://ghcr.io/token?scope=repository:svendanilborodun/$1:pull" \
              "https://ghcr.io/v2/svendanilborodun/$1/manifests/${VERSION}"
          }
          _probe_hub() {
            _probe_manifest \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:nettername/$1:pull" \
              "https://registry-1.docker.io/v2/nettername/$1/manifests/${VERSION}"
          }
          # NOTE (deliberate non-goal): this stays an EXISTENCE probe, not a
          # provenance check. Comparing the manifest's
          # org.opencontainers.image.revision to github.sha would not catch the
          # scenario it looks like it should — a retried release re-tags the
          # SAME commit, so attempt 1's surviving -opi images carry exactly the
          # sha we would compare against. The cheap alternative (downloading
          # W4's `opi-build-success` marker artifact) would force an `actions:
          # read` GITHUB_TOKEN grant onto a job that deliberately runs with
          # `permissions: {}`. Neither trade is worth it here; the marker gate
          # in docker-publish.yml's retag job remains the provenance authority.
          if [ -n "$PI_SHA" ]; then
            _GATE_START=$SECONDS
            _over_budget() { [ $((SECONDS - _GATE_START)) -gt 150 ]; }
            for repo in physical-ai-server-opi physical-ai-manager-opi open-manipulator-opi; do
              if _over_budget; then
                echo "::warning::opi image gate exceeded its 150 s budget — withholding the Pi self-update advertisement (empty pi_agent_sha256) rather than risking the W6 job timeout (which would also withhold the .exe)."
                PI_SHA=""
                break
              fi
              if _probe_ghcr "$repo"; then continue; else _g=$?; fi
              if _over_budget; then
                echo "::warning::opi image gate exceeded its 150 s budget after the GHCR probe of ${repo} — withholding the Pi self-update advertisement (empty pi_agent_sha256)."
                PI_SHA=""
                break
              fi
              if _probe_hub "$repo"; then
                echo "::warning::ghcr.io/svendanilborodun/${repo}:${VERSION} is not anonymously pullable (GHCR probe verdict: $([ "$_g" = 2 ] && echo 'probe FAILED — registry unreachable' || echo 'missing or private')), but the Docker Hub twin nettername/${repo}:${VERSION} is — advertising the Pi self-update (the Pi's own acquisition falls back to Hub). Fix the GHCR side."
                continue
              else
                _h=$?
              fi
              # Neither registry said yes. Name WHICH failure it was, because
              # "image missing" and "registry unreachable" need opposite
              # operator actions (rebuild opi vs. simply re-run W6).
              if [ "$_g" = "2" ] || [ "$_h" = "2" ]; then
                echo "::warning::could not VERIFY ${repo}:${VERSION} on GHCR (verdict ${_g}) or Docker Hub (verdict ${_h}) — at least one probe FAILED rather than answering (verdict 2 = registry unreachable/5xx/rate-limited). Withholding the Pi self-update advertisement (empty pi_agent_sha256) because the availability criterion must equal the apply criterion. This is NOT evidence the -opi images are missing: re-run W6 before rebuilding anything."
              else
                echo "::warning::${repo}:${VERSION} is anonymously pullable on NEITHER ghcr.io/svendanilborodun nor Docker Hub (nettername) — both registries answered definitively (missing or private). Withholding the Pi self-update advertisement (empty pi_agent_sha256) so no Pi pins a version whose -opi images it cannot pull. Rebuild/publish the -opi images."
              fi
              PI_SHA=""
              break
            done
          fi

          # Hand PI_SHA to the verify step (empty when the tarball couldn't be
          # hashed). The verify step asserts /version's pi_agent_sha256 matches
          # this exact value when it is non-empty.
          echo "PI_SHA=${PI_SHA}" >> "$GITHUB_ENV"

          # Set the non-triggering vars first with --skip-deploys, then
          # GUI_VERSION WITHOUT it so exactly ONE redeploy fires and picks up
          # all of them atomically (mirrors railway-deploy-cloud-api.yml's
          # BUILD_COMMIT pattern). GUI_INSTALLER_SHA256 + PI_AGENT_SHA256 are
          # always set (to their hash or empty) so neither can be stale from a
          # prior release. The Pi's download URL is DERIVED cloud-side from
          # GUI_RELEASE_REPO + GUI_VERSION (routes/version.py), so there is no
          # separate PI_AGENT_DOWNLOAD_URL var to set here.
          railway variable set "GUI_RELEASE_REPO=${GIT_REPO}" \
              --service scintillating-empathy --environment production \
              --skip-deploys >/dev/null
          railway variable set "GUI_DOWNLOAD_URL=${DOWNLOAD_URL}" \
              --service scintillating-empathy --environment production \
              --skip-deploys >/dev/null
          railway variable set "GUI_INSTALLER_SHA256=${SHA}" \
              --service scintillating-empathy --environment production \
              --skip-deploys >/dev/null
          railway variable set "PI_AGENT_SHA256=${PI_SHA}" \
              --service scintillating-empathy --environment production \
              --skip-deploys >/dev/null
          railway variable set "GUI_VERSION=${VERSION}" \
              --service scintillating-empathy --environment production >/dev/null
          echo "  set GUI_RELEASE_REPO, GUI_DOWNLOAD_URL, GUI_INSTALLER_SHA256, PI_AGENT_SHA256, GUI_VERSION (redeploy triggered)"
      - name: Verify /version advertises the new release
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          EXPECTED="${GIT_REF_NAME#v}"
          URL=https://scintillating-empathy-production-1068.up.railway.app/version
          # PI_SHA arrives from the previous step via $GITHUB_ENV (empty when the
          # tarball couldn't be hashed). Once `version` matches, the redeploy that
          # set all five vars atomically is serving, so the Pi fields are final:
          #   - pi_agent_download_url MUST be present (routes/version.py derives
          #     it from GUI_RELEASE_REPO + GUI_VERSION, both set above);
          #   - pi_agent_sha256 MUST equal PI_SHA when PI_SHA is non-empty.
          # A version-match with a bad Pi field fails immediately (exit 2/3) — it
          # will not self-correct, so we do not keep polling on it.
          # Railway redeploy + healthcheck on an env-only change is fast, but
          # pad for cold-pod routing. 5-min budget like the cloud-api gate.
          for attempt in $(seq 1 150); do
            BODY=$(curl -fsS --max-time 5 "$URL" 2>/dev/null || true)
            if [ -n "$BODY" ]; then
              # Single-line -c (no leading-indent hazard). Exit codes:
              #   0 = version matches AND Pi fields valid (url present, hash OK)
              #   1 = version not yet matching (or unparseable) — keep polling
              #   2 = version matches but pi_agent_download_url missing
              #   3 = version matches but pi_agent_sha256 != PI_SHA
              rc=0
              python3 -c "import json,sys; d=json.loads(sys.argv[1]); v=d.get('version'); u=d.get('pi_agent_download_url'); s=d.get('pi_agent_sha256'); e=sys.argv[2]; p=sys.argv[3]; sys.exit(0 if (v==e and u and (not p or s==p)) else (1 if v!=e else (2 if not u else 3)))" "$BODY" "$EXPECTED" "${PI_SHA:-}" || rc=$?
              if [ "$rc" = "0" ]; then
                echo "/version now advertises ${EXPECTED} (+ valid pi_agent_download_url / pi_agent_sha256)."
                echo "  body: $BODY"
                exit 0
              elif [ "$rc" = "2" ]; then
                echo "::error::/version advertises ${EXPECTED} but pi_agent_download_url is missing (GUI_RELEASE_REPO/GUI_VERSION not applied?)."
                echo "  body: $BODY"
                exit 1
              elif [ "$rc" = "3" ]; then
                echo "::error::/version advertises ${EXPECTED} but pi_agent_sha256 != the tarball we attached (expected ${PI_SHA})."
                echo "  body: $BODY"
                exit 1
              fi
              ACTUAL=$(echo "$BODY" | python3 -c "import json, sys; print(json.loads(sys.stdin.read()).get('version', '<missing>'))" 2>/dev/null || echo "<unparseable>")
              echo "Attempt $attempt: /version=$ACTUAL, expected $EXPECTED"
            else
              echo "Attempt $attempt: $URL → curl failed or empty body"
            fi
            sleep 2
          done
          echo "::error::/version did not advertise ${EXPECTED} within 5 minutes after setting Railway env vars."
          exit 1
