name: supabase-migrate

# Applies Supabase migrations from robotis_ai_setup/supabase/migrations/
# to the production project (fnnbysrjkfugsqzwcksd, "edubotics").
#
# Three triggers:
#   - push to main + path-filter           → apply to production
#   - PR opened/synchronize + path-filter  → apply to an ephemeral
#                                            Supabase Branch and probe
#                                            the schema fingerprint
#   - PR closed                            → tear down the ephemeral branch
#   - workflow_dispatch                    → manual apply OR rollback
#
# This is W1 in docs/deploy/PIPELINE.md (or CLAUDE.md §pipeline). It is
# the first link in the golden order:
#     W1 supabase-migrate ──► W2 railway-deploy-cloud-api
#                          ──► W3 railway-deploy-teacher-web
#                          ──► W4 docker-publish
# Modal apps deploy manually — see CLAUDE.md Rule §6.

on:
  push:
    branches: [main]
    paths:
      - "robotis_ai_setup/supabase/migrations/**"
      - "robotis_ai_setup/supabase/config.toml"
      - ".github/workflows/supabase-migrate.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "robotis_ai_setup/supabase/migrations/**"
      - "robotis_ai_setup/supabase/config.toml"
      - ".github/workflows/supabase-migrate.yml"
  workflow_call:
    # Allows release.yml to invoke this as a reusable workflow.
    inputs:
      target:
        description: "production | branch (defaults to production)"
        required: false
        default: "production"
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: "Where to apply"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - branch
      rollback_to:
        description: "Optional: filename stem from rollback/ to apply in reverse (e.g. '021_workgroup_memberships_realtime_and_owner_check'). Leave empty to apply forward migrations."
        required: false
        type: string
      reason:
        description: "Audit reason — shown in the workflow run name"
        required: true
        type: string

concurrency:
  # Project-scoped (NOT ref-scoped) so parallel calls from main pushes
  # and release.yml invocations against the same DB serialise. Never
  # abort an in-flight migration.
  group: supabase-migrate-production
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write  # for the apply-branch job to comment on the PR

jobs:
  validate:
    name: Lint + parse migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: supabase/setup-cli@52a446718e4edd1a9f1e2631186019c87e329f60  # v2.1.0
        with:
          version: latest
      - name: List migrations to be applied
        working-directory: robotis_ai_setup/supabase
        run: |
          echo ">> Migrations in repo:"
          find migrations -maxdepth 1 -name '*.sql' -type f -printf '%f\n' | sort
      - name: Syntax-check every SQL file
        working-directory: robotis_ai_setup/supabase/migrations
        run: |
          # The Supabase CLI's `db lint` requires a linked project. For a
          # bare syntax pass we use pglast (PostgreSQL grammar via libpg_query).
          python -m pip install --quiet 'pglast==6.*'
          set -e
          for f in *.sql; do
            echo ">> Parsing $f"
            python -c "import pglast, sys; pglast.parse_sql(open('$f').read())" \
              || { echo "::error::Syntax error in $f"; exit 1; }
          done
          echo "All migrations parse cleanly."

  apply-branch:
    name: Apply to ephemeral Supabase Branch (PR)
    # Gated behind the SUPABASE_BRANCHING_ENABLED repo variable
    # (Settings → Secrets and variables → Actions → Variables tab).
    # Supabase Branching is a Pro+ feature that must ALSO be enabled
    # in the project dashboard (Project Settings → Branching). The
    # variable is a second switch the operator flips AFTER enabling
    # Branching in the dashboard — without both, this job is skipped
    # so PRs are not perpetually red. Once both are on, the job runs
    # exactly as before. See CLAUDE.md "Known issues" for the toggle
    # procedure.
    if: ${{ github.event_name == 'pull_request' && vars.SUPABASE_BRANCHING_ENABLED == 'true' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') }}
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: supabase/setup-cli@52a446718e4edd1a9f1e2631186019c87e329f60  # v2.1.0
        with:
          version: latest
      - name: Link to the production project (creates branches under it)
        working-directory: robotis_ai_setup/supabase
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --password ""
      - name: Create / reuse PR branch and capture its DB URL
        id: branch
        working-directory: robotis_ai_setup/supabase
        run: |
          set -e
          BRANCH_NAME="pr-${{ github.event.pull_request.number }}"
          # Idempotent: reuse if it exists (PR re-pushed); else create.
          if ! supabase branches list -o json | python3 -c "import sys,json; print(any(b.get('name')=='${BRANCH_NAME}' for b in json.load(sys.stdin)))" | grep -q True; then
            supabase branches create "${BRANCH_NAME}" --region eu-west-1
          fi
          # Capture the branch's Postgres connection string from JSON output.
          BRANCH_JSON=$(supabase branches get "${BRANCH_NAME}" -o json)
          BRANCH_DB_URL=$(echo "$BRANCH_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('postgres_connection_string') or d.get('db_url') or '')")
          BRANCH_API_URL=$(echo "$BRANCH_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('api_url') or d.get('url') or '')")
          if [ -z "$BRANCH_DB_URL" ]; then
            echo "::error::Could not extract branch DB URL from supabase branches get output"
            echo "$BRANCH_JSON" | head -c 500
            exit 1
          fi
          echo "::add-mask::$BRANCH_DB_URL"
          # Pass to subsequent steps without leaking into the step log.
          {
            echo "branch_db_url=${BRANCH_DB_URL}"
            echo "branch_api_url=${BRANCH_API_URL}"
            echo "branch_name=${BRANCH_NAME}"
          } >> "$GITHUB_OUTPUT"
      - name: Push migrations to PR branch (targets branch DB, not prod)
        working-directory: robotis_ai_setup/supabase
        env:
          BRANCH_DB_URL: ${{ steps.branch.outputs.branch_db_url }}
        run: |
          # Same pattern as apply-production: extract password and use
          # --linked --password since --db-url is unreliable on v2.x.
          # urllib.parse handles passwords that contain `@`, URL-encoded
          # chars (`%40`, `%23`), spaces, etc. — the previous sed regex
          # `s|^postgresql://[^:]+:([^@]+)@.*|\1|` mangled all of these.
          DB_PASSWORD=$(python3 -c "import os, urllib.parse as u; print(u.urlparse(os.environ['BRANCH_DB_URL']).password or '', end='')")
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::Could not extract password from BRANCH_DB_URL (urllib.parse returned empty)"
            exit 1
          fi
          echo "::add-mask::$DB_PASSWORD"
          supabase db push --linked --password "$DB_PASSWORD"
      - name: Comment on PR with branch URL + status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchUrl = "${{ steps.branch.outputs.branch_api_url }}";
            const branchName = "${{ steps.branch.outputs.branch_name }}";
            const body = [
              "## Supabase PR-Branch Migration applied ✅",
              "",
              `**Branch:** \`${branchName}\``,
              `**URL:** ${branchUrl}`,
              "",
              "Migrations were applied to an ephemeral Supabase Branch. The",
              "branch will be torn down automatically when this PR closes.",
              "",
              "If you need to inspect the schema, the Supabase dashboard's",
              "branch selector exposes this branch directly.",
            ].join("\n");
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  teardown-branch:
    name: Tear down PR branch on close
    # Same gate as apply-branch: without Branching enabled in the
    # dashboard AND vars.SUPABASE_BRANCHING_ENABLED == 'true', there
    # is no PR branch to tear down. Skipping is safe + idempotent.
    if: ${{ github.event_name == 'pull_request' && vars.SUPABASE_BRANCHING_ENABLED == 'true' && github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: supabase/setup-cli@52a446718e4edd1a9f1e2631186019c87e329f60  # v2.1.0
        with:
          version: latest
      - name: Link
        working-directory: robotis_ai_setup/supabase
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --password ""
      - name: Delete PR branch
        working-directory: robotis_ai_setup/supabase
        run: |
          BRANCH_NAME="pr-${{ github.event.pull_request.number }}"
          # Tolerate "not found" (someone may have deleted manually).
          supabase branches delete "${BRANCH_NAME}" --yes || true

  apply-production:
    name: Apply to production
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_call' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && (inputs.rollback_to == '' || inputs.rollback_to == null))
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: supabase/setup-cli@52a446718e4edd1a9f1e2631186019c87e329f60  # v2.1.0
        with:
          version: latest
      - name: Link to production
        # `link` writes .supabase/temp/project-ref locally. Pass --password ""
        # to skip the interactive DB-password prompt — the actual db push
        # below uses --db-url which carries auth in the connection string,
        # so link doesn't need separate password validation.
        working-directory: robotis_ai_setup/supabase
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --password ""
      - name: Apply pending migrations
        working-directory: robotis_ai_setup/supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # The CLI v2.x is finicky about --db-url; it accepts the
          # connection string but db push internally re-derives the
          # pooler URL from the linked project ref + the password.
          # Extracting the password from SUPABASE_DB_URL and using
          # --linked --password is the path that reliably works.
          # Pattern: postgresql://USER:PASSWORD@HOST:PORT/DB
          #
          # We use urllib.parse — NOT sed — because the previous regex
          # `s|^postgresql://[^:]+:([^@]+)@.*|\1|` mangles passwords
          # that contain `@` (legal when URL-encoded as `%40`), `%`, `:`
          # in the password, or anything that needs percent-encoding.
          # urllib's robust parser was the documented fix for the 2026-05
          # CI breakage where this step failed silently on first runs.
          DB_PASSWORD=$(python3 -c "import os, urllib.parse as u; print(u.urlparse(os.environ['SUPABASE_DB_URL']).password or '', end='')")
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::Could not extract password from SUPABASE_DB_URL (urllib.parse returned empty)"
            echo "::error::Format: postgresql://USER:PASS@HOST:PORT/DB"
            echo "::error::URL length: ${#SUPABASE_DB_URL} (should be ~110)"
            exit 1
          fi
          echo "::add-mask::$DB_PASSWORD"
          # supabase db push diffs the local migrations/ against the live
          # schema_migrations ledger and applies only the delta. The
          # baseline (00000000000000_baseline.sql) is marked as already
          # applied via the one-time `supabase migration repair` step
          # documented in supabase/_archive/README.md.
          supabase db push --linked --password "$DB_PASSWORD" --include-all
      - name: List currently applied migrations
        # The previous step polled the Railway /health endpoint as a
        # post-migration smoke test. That probe was meaningless for
        # *this* job: the Railway FastAPI hasn't redeployed yet, so a
        # 200 just means the OLD pod (running OLD code against the NEW
        # schema) is still up — not a signal of migration correctness.
        # The real "did this migration break a contract?" gate is the
        # `schema-probe` job in railway-deploy-cloud-api.yml, which
        # imports the NEW FastAPI code against the NEW schema BEFORE
        # `railway up` is invoked.
        #
        # Replace the broken probe with a simple `supabase migration
        # list` — it confirms the new rows landed in the
        # schema_migrations ledger AND gives the operator a paper trail
        # in the run log of exactly what was just applied.
        working-directory: robotis_ai_setup/supabase
        run: supabase migration list --linked

  rollback:
    name: Rollback (manual dispatch)
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_to != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGPASSWORD: dummy  # psql reads from SUPABASE_DB_URL; this just silences a warning
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply rollback SQL
        working-directory: robotis_ai_setup/supabase/rollback
        env:
          ROLLBACK_NAME: ${{ inputs.rollback_to }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          # Locate the rollback file by stem match — e.g. input
          # "021_workgroup_memberships_realtime_and_owner_check" →
          # rollback/021_workgroup_memberships_realtime_and_owner_check.sql
          FILE="${ROLLBACK_NAME}.sql"
          if [ ! -f "$FILE" ]; then
            echo "::error::No rollback file: ${FILE}"
            ls -1
            exit 1
          fi
          echo ">> Applying rollback: $FILE"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$FILE"
          echo "Rollback applied."
