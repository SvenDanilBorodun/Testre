# Student-rig nginx config (COPY'd to /etc/nginx/conf.d/default.conf, i.e.
# included from http{} — so the two maps below are in the right context).
#
# ── Why the robot transports are proxied here (2026-08-06) ──────────────────
# rosbridge is UNAUTHENTICATED: anything that can open ws://…:9090 can publish
# to /leader/joint_trajectory and drive a physical arm standing beside children,
# and can read every recorded dataset. It used to be reachable directly at
# 127.0.0.1:9090 via a compose port-publish, with the loopback bind as the only
# control — but loopback is NOT a boundary against a page running ON that PC,
# and a WebSocket handshake has no CORS preflight to stop it. So any site open
# in the student's browser could drive the arm.
#
# The publishes of :9090 and :8080 are now GONE from docker-compose.yml and both
# transports ride this same-origin proxy instead, gated by an Origin allowlist.
# This mirrors what nginx.opi.conf.template already does for the Orange Pi (for
# a different reason there: school firewalls filter non-standard ports).

# WebSocket Connection-header map. Same rationale as the opi template: without
# it the /rosbridge location would have to hardcode `Connection: upgrade`, which
# sends a bogus upgrade token on every NON-WebSocket request to that path.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Origin allowlist for the rosbridge control plane.
#
# Policy is deliberately IDENTICAL to the already-reviewed check in
# gui/app/roboter_studio_control.py::_origin_allowed — one product, one policy.
# All three halves of that check line up with the map below:
# `_ALLOWED_ORIGIN_HOSTS = {"localhost", "127.0.0.1"}` (exact-host match),
# `_ALLOWED_ORIGIN_SCHEMES = {"http", "https"}` (the `https?`),
# `_ALLOWED_ORIGIN_PORTS = {None, 80}` (the `(:80)?`, `None` being the elided
# default port), and an empty Origin allowed. The scheme and port halves were
# ADDED to the Python side to make this paragraph true: it read only
# `urlsplit(origin).hostname`, so `http://localhost:8444` and `ws://localhost`
# were allowed there while nginx answered 403. gui_app.py::_open_webview opens
# `http://localhost:80/?…`, so the browser sends `Origin: http://localhost`
# (the default port is dropped from the Origin serialization); the WebView2
# `_webview_fallback` opens the same URL in the system browser. 127.0.0.1 is
# allowed because a student may type it.
#
# The `^…$` anchors are the load-bearing part: they are what rejects
# `http://localhost.evil.com` and `http://evil.com/#http://localhost`. `~*` is
# case-insensitive. The optional `(:80)?` covers a client that spells the
# default port out; see the PORT-NARROWED note below for why it is `(:80)?`
# and NOT `(:[0-9]+)?`.
#
# EMPTY / ABSENT Origin is ALLOWED, deliberately. The threat being closed is a
# malicious *page*, and a browser cannot omit Origin on a WebSocket handshake —
# it is set by the user agent, not by script, so a blank Origin provably did not
# come from the attack this gate exists to stop. (A `file://` page sends the
# literal `null`, which is non-empty and therefore refused.) Denying blanks
# would instead break non-browser diagnostic clients — roslibpy, wscat, a
# support engineer's script — that legitimately reach the loopback port, buying
# nothing. Anything that can forge a header can also just talk to the port.
# PORT-NARROWED to the one port the app is served on. `(:[0-9]+)?` accepted
# EVERY localhost port, so any other HTML-serving surface on the machine became
# a pivot into the origin this gate trusts to drive the arm — the phone receiver
# on 0.0.0.0:8444 being the nearest candidate. The GUI opens
# `http://localhost:80/`, so browsers send `Origin: http://localhost` with the
# default port elided; `:80` is spelled out anyway because a non-browser client
# may include it. Measured before narrowing: `Origin: http://localhost:8444`
# returned 200.
map $http_origin $edubotics_origin_ok {
    default                              0;
    ''                                   1;
    '~*^https?://localhost(:80)?$'       1;
    '~*^https?://127\.0\.0\.1(:80)?$'    1;
}

server {
    listen 80;
    server_name localhost;

    # ── Security headers ─────────────────────────────────────────────────────
    # Mirrors nginx.opi.conf.template's set, with the same deliberate omission
    # of Strict-Transport-Security (nothing terminates TLS in front of a
    # student rig, and RFC 6797 §7.2 makes a UA ignore STS over plain HTTP).
    #
    # These were absent while this file claimed to be modelled on the opi
    # template, which has carried them since the port-80 consolidation — i.e.
    # this config was a strictly WEAKER copy of the one it cites. That matters
    # more now that both robot transports are same-origin: nosniff and DENY are
    # what stop a reflected upstream response from being framed or
    # content-sniffed into script on the very origin /rosbridge trusts.
    #
    # `add_header` only inherits into a location that declares NO add_header of
    # its own, so every location below that sets Cache-Control MUST re-declare
    # these four. The proxy locations set none, so they inherit correctly.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Docker's embedded DNS. Resolve the upstream at REQUEST time, not
    # config-load time: a literal hostname in proxy_pass is resolved once at
    # startup, so nginx would fail to start whenever physical_ai_server is not
    # already up, and would keep a stale IP across a `--force-recreate`.
    # valid=10s re-resolves after the robot container churns its IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # HTML shell must never be cached — a new image pull needs to reach the
    # browser immediately so the hashed bundle references update without a
    # hard refresh.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        # Re-declared: this block sets its own add_header, so the
        # server-level security headers do NOT inherit into it.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Build-id manifest polled by the React app to detect new deployments.
    # Must never be cached — the whole point is to read the current value.
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        # Re-declared: this block sets its own add_header, so the
        # server-level security headers do NOT inherit into it.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # ── Same-origin WebSocket proxy to rosbridge ────────────────────────────
    # THE control plane: anything speaking rosbridge here can drive the arm and
    # read datasets, so this is the one location carrying the Origin gate.
    #
    # `if` inside a location is famously "evil", but a bare `return` is one of
    # the two documented-safe uses (the other being `rewrite … last`) — it is
    # exactly what the nginx wiki prescribes for this check.
    #
    # proxy_pass carries an explicit URI ("/"): with a VARIABLE upstream nginx
    # passes that URI as-is, so rosbridge sees the "/" path its WebSocket
    # handler serves. Long timeouts so an idle-but-alive socket is not cut by
    # the 60 s default. `Connection` comes from the $connection_upgrade map.
    location = /rosbridge {
        if ($edubotics_origin_ok = 0) {
            return 403;
        }
        set $edubotics_rosbridge physical_ai_server;
        proxy_pass http://$edubotics_rosbridge:9090/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Same-origin proxy to web_video_server (MJPEG camera streams) ────────
    # EXACT match on /video/stream, deliberately — NOT a `/video/` prefix.
    #
    # Putting web_video_server on the SPA's OWN origin means every endpoint it
    # serves becomes same-origin too, and upstream's `handle_stream_viewer`
    # reflects its `topic` query parameter RAW into a `text/html` response:
    #
    #     ss << "<html><head><title>" << topic << "</title></head><body>";
    #
    # It validates `type` (the streamer factory) but never that the topic
    # exists, so /video/stream_viewer?type=mjpeg&topic=<script>… is a reflected
    # XSS ON http://localhost — precisely the Origin the /rosbridge gate above
    # trusts. That would hand any such link a full rosbridge session and the
    # ability to publish /leader/joint_trajectory.
    #
    # The app only ever requests `<base>/stream?…` (ImageGridCell.js,
    # CameraFeedOverlay.jsx), so an exact-match location keeps the cameras
    # working while removing stream_viewer, the HTML index and every other
    # upstream endpoint from our origin. Adding a path back is a one-line
    # change — but do it deliberately, and check what that endpoint reflects.
    #
    # The rewrite strips the /video prefix (the query string is preserved
    # automatically) because a variable proxy_pass cannot do prefix replacement
    # itself. proxy_buffering off is MANDATORY for multipart/x-mixed-replace —
    # nginx's default buffering freezes the stream.
    #
    # DELIBERATELY NOT Origin-gated, and that is not an oversight. The app
    # consumes these streams as `<img src=…>` (ImageGridCell.js,
    # CameraFeedOverlay.jsx) and an image load sends NO Origin header, so the
    # gate could only ever fire on requests the app does not make. Adding it
    # would not stop a third-party page embedding the stream in its own <img>
    # either (that request is equally Origin-less), while it WOULD risk
    # blanking the student's camera view.
    #
    # What actually protects the pixels from cross-origin JAVASCRIPT is the
    # proxy_hide_header below, and it is REQUIRED, not belt-and-braces.
    # web_video_server sets `Access-Control-Allow-Origin: *` on its own
    # responses — verified in upstream `MultipartStream::send_initial_header()`
    # (src/multipart_stream.cpp, the multipart/x-mixed-replace path this app
    # uses) and again in the snapshot streamers — and nginx forwards an
    # upstream header it does not explicitly hide (ACAO is not in its default
    # hidden set; measured, not assumed). Left through, that wildcard lets any
    # page `fetch()` a camera frame and READ it, which is strictly worse than
    # the `<img>` embed an Origin gate also could not have stopped. Hiding it
    # costs the app nothing: `<img>` needs no CORS header at all.
    location = /video/stream {
        set $edubotics_video physical_ai_server;
        rewrite ^/video/(.*)$ /$1 break;
        proxy_pass http://$edubotics_video:8080;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Hashed JS/CSS bundles from CRA are content-addressed and safe to cache.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Re-declared: this block sets its own add_header, so the
        # server-level security headers do NOT inherit into it.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # SPA routing — all paths fall through to index.html
    location / {
        try_files $uri /index.html;
    }
}
