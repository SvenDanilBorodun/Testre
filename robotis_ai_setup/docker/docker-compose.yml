# Compose stack run inside the EduBotics WSL distro on student PCs (amd64)
# and on the classroom Jetson (arm64; via the -jetson images per service).
# Image tags are resolved from ${IMAGE_TAG:-latest}; the GUI updates the
# tag via versions.env. See docs/deploy/PIPELINE.md for the build pipeline.
#
# Lifecycle: `restart: "no"` on every service is deliberate — the Windows
# GUI (EduBotics.exe) is the SOLE owner of the container lifecycle. The
# stack must come up ONLY after the student has scanned both arms and
# clicked "Umgebung starten". With `unless-stopped` (the old value) dockerd
# resurrected the stack the moment the distro booted (i.e. the moment the
# GUI first touched WSL), so the arm was driven and the Dynamixel serial
# bus held BEFORE any scan — which also broke the scan itself (identify_arm
# .py collides with the live controller on the same /dev/serial port). The
# GUI tears down any leftover stack at startup and on a re-scan; `no` keeps
# dockerd from bringing it back behind the GUI's back. It also removes a
# documented footgun: a boot-sync abort used to loop compose's restart
# policy into a crash-storm.
networks:
  ros_net:
    driver: bridge

services:
  open_manipulator:
    container_name: open_manipulator
    image: ${REGISTRY:-nettername}/open-manipulator:${IMAGE_TAG:-latest}
    tty: true
    restart: "no"
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    networks:
      - ros_net
    ports:
      # Native-camera ingest TCP server (camera_ingest_node.py). Loopback-bind
      # so the JPEG stream from the Windows GUI is reachable at localhost:5557
      # via the WSL2 NAT localhost-forwarder, but never exposed to the school
      # LAN. Only used when EDUBOTICS_CAMERA_SOURCE=native_bridge (WSL2 student
      # path); harmless on the Jetson (the GUI simply never connects).
      - "127.0.0.1:5557:5557"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      - FOLLOWER_PORT=${FOLLOWER_PORT}
      - LEADER_PORT=${LEADER_PORT}
      - CAMERA_DEVICE_1=${CAMERA_DEVICE_1:-}
      - CAMERA_NAME_1=${CAMERA_NAME_1:-gripper}
      - CAMERA_DEVICE_2=${CAMERA_DEVICE_2:-}
      - CAMERA_NAME_2=${CAMERA_NAME_2:-scene}
      # Camera tuning knobs. Without these, entrypoint_omx.sh's
      # `:-yuyv` etc. defaults always win and any per-classroom
      # override in the host .env never reaches the container. Compose
      # ${VAR} interpolation operates on the YAML only — the container
      # runtime env is whatever this list specifies.
      #
      # The default here (`yuyv`) is the safe choice for the Jetson
      # Orin Nano classroom target, which runs on a native USB host
      # controller and has the bandwidth budget. The student-PC path
      # (WSL2 vhci_hcd) cannot sustain 2×YUYV at 640×480×30 — both
      # cameras crash with `VIDIOC_DQBUF: Select timeout` inside ~5 s.
      # entrypoint_omx.sh detects the WSL2 kernel via `uname -r` and
      # flips the runtime default to `mjpeg2rgb` for that case (see
      # the detect_host_usb_bridge() block in that script). Any
      # explicit override in the host .env wins over both defaults.
      #
      # `raw_mjpeg` is intentionally NOT supported (broken in usb_cam
      # 0.8.1, ros-drivers/usb_cam#346 — falsifies the message
      # encoding and downstream consumers see green tiles / noise).
      - EDUBOTICS_CAMERA_PIXEL_FORMAT=${EDUBOTICS_CAMERA_PIXEL_FORMAT:-yuyv}
      - EDUBOTICS_CAMERA_WIDTH=${EDUBOTICS_CAMERA_WIDTH:-640}
      - EDUBOTICS_CAMERA_HEIGHT=${EDUBOTICS_CAMERA_HEIGHT:-480}
      - EDUBOTICS_CAMERA_FRAMERATE=${EDUBOTICS_CAMERA_FRAMERATE:-30.0}
      # Host USB-bridge type. Auto-detected inside entrypoint_omx.sh
      # via `uname -r` (Microsoft kernel ⇒ vhci_hcd, else native).
      # Forwarded here so an operator can pin it for testing
      # (e.g. EDUBOTICS_HOST_USB_BRIDGE=native on a WSL2 install to
      # force-test the yuyv path) and so the env-forwarding-guard CI
      # job stays green. Empty default = auto-detect.
      - EDUBOTICS_HOST_USB_BRIDGE=${EDUBOTICS_HOST_USB_BRIDGE:-}
      # Follower-only mode: student PCs default to 0 (both arms physically
      # present); the classroom Jetson agent's compose file sets it to 1
      # because the leader stays at the student's desk. Listed here so
      # the env-forwarding-guard CI job stays green.
      - EDUBOTICS_FOLLOWER_ONLY=${EDUBOTICS_FOLLOWER_ONLY:-0}
      # Camera capture source. native_bridge = cameras captured natively on
      # the Windows host and streamed in over TCP (WSL2 student path —
      # camera_ingest_node.py republishes them; usbipd cannot sustain UVC at
      # 30 Hz). usb_cam = in-container V4L2 over usbipd/native USB (Jetson /
      # native Linux). Empty = auto-detect in entrypoint_omx.sh (WSL2 kernel
      # ⇒ native_bridge). The GUI writes `native_bridge` explicitly into the
      # student .env so the healthcheck below can branch on it. Setting
      # `usb_cam` is the one-variable rollback to the old usbipd camera path.
      - EDUBOTICS_CAMERA_SOURCE=${EDUBOTICS_CAMERA_SOURCE:-}
      - EDUBOTICS_CAMERA_INGEST_PORT=${EDUBOTICS_CAMERA_INGEST_PORT:-5557}
      - EDUBOTICS_CAMERA_NAMES=${EDUBOTICS_CAMERA_NAMES:-gripper,scene}
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # The arm container needs privileged + /dev to talk to Dynamixel over
    # /dev/ttyACM* (character-device nodes that are created dynamically by
    # udev and can't be stably pre-mounted). Scoping this down requires a
    # deeper rework than fits here — tracked in context/21-known-issues.md §3.3.
    privileged: true
    # Resource cap: one runaway ROS node should not OOM the distro and
    # take down all three containers + corrupt ai_workspace.
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      # Audit F7: previously only checked /joint_states, leaving a
      # dead usb_cam container reported "healthy" → physical_ai_server
      # starts → recording proceeds with black frames → failure
      # surfaced only at first record-press via 5s topic-wait.
      # Now also assert the camera compressed-image topics are published.
      #   - native_bridge: assert both ingest topics exist (camera_ingest_node
      #     is up). Frame-flow itself is monitored by the GUI + the node's 10s
      #     Hz log; a 5s healthcheck can't run `ros2 topic hz`.
      #   - usb_cam: per-camera ${CAMERA_DEVICE_*} env-var gating lets
      #     single-camera setups stay healthy.
      # EDUBOTICS_CAMERA_SOURCE may be empty (auto-detect); fall back to the
      # same uname WSL2 detection the entrypoint uses so the branch matches.
      test: ["CMD-SHELL", "bash -c 'source /opt/ros/jazzy/setup.bash && source /root/ros2_ws/install/setup.bash && (ros2 topic list 2>/dev/null | grep -q /joint_states || exit 1); src=\"$$EDUBOTICS_CAMERA_SOURCE\"; if [ -z \"$$src\" ] && uname -r | grep -qi microsoft; then src=native_bridge; fi; if [ \"$$src\" = native_bridge ]; then ros2 topic list | grep -q /$${CAMERA_NAME_1:-gripper}/image_raw/compressed && ros2 topic list | grep -q /$${CAMERA_NAME_2:-scene}/image_raw/compressed; else ([ -z \"$$CAMERA_DEVICE_1\" ] || ros2 topic list | grep -q /$${CAMERA_NAME_1:-gripper}/image_raw/compressed) && ([ -z \"$$CAMERA_DEVICE_2\" ] || ros2 topic list | grep -q /$${CAMERA_NAME_2:-scene}/image_raw/compressed); fi'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  physical_ai_server:
    container_name: physical_ai_server
    image: ${REGISTRY:-nettername}/physical-ai-server:${IMAGE_TAG:-latest}
    depends_on:
      open_manipulator:
        # Wait for /joint_states before starting the inference/recording
        # node — previously the first recording tick hit missing topics
        # and the UI flashed a misleading error.
        condition: service_healthy
    tty: true
    restart: "no"
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    networks:
      - ros_net
    ports:
      # Loopback-bind so rosbridge (unauthenticated — anyone who can reach
      # :9090 can drive the arm or steal datasets) isn't exposed to the
      # school LAN if Windows Firewall is misconfigured.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      # Phase-3 cloud-vision: the on-host server POSTs base64 JPEGs +
      # German prompts to ${EDUBOTICS_CLOUD_API_URL}/vision/detect when
      # the student enables the open-vocab block. Defaults to the
      # Railway production endpoint; override in .env for staging.
      - EDUBOTICS_CLOUD_API_URL=${EDUBOTICS_CLOUD_API_URL:-https://scintillating-empathy-production-1068.up.railway.app}
      # Recording video codec (v2.5.0 / LeRobot v0.5.1). Default 'h264'
      # (software libx264 under the hood) — fast CPU decode on Win10
      # student PCs in the React preview. Upstream LeRobot defaults to
      # 'libsvtav1' (AV1) which is 5-10x slower to decode on CPU. Other
      # valid values per LeRobot v0.5.1: 'hevc', 'libsvtav1', 'auto'.
      # Read by lerobot_dataset_wrapper.py's _apply_edubotics_defaults.
      - EDUBOTICS_VCODEC=${EDUBOTICS_VCODEC:-h264}
      # Roboter Studio calibration dir (ChArUco intrinsics, hand-eye
      # transforms, HSV color profile). Default lands inside the
      # edubotics_calib named volume mounted below. Overlay readers:
      # workflow/calibration_manager.py, workflow/color_profile.py,
      # physical_ai_server.py.
      - EDUBOTICS_CALIB_DIR=${EDUBOTICS_CALIB_DIR:-/root/.cache/edubotics}
      # Vision detector selection + ONNX paths for the Roboter Studio
      # open-vocab block. `yolox-tiny` is the only fully-wired path
      # today; `dfine-n` is reserved (see overlays/workflow/perception.py
      # comment). Custom ONNX paths support side-loading a fine-tuned
      # model into the container without rebuilding the image.
      - EDUBOTICS_DETECTOR=${EDUBOTICS_DETECTOR:-yolox-tiny}
      - EDUBOTICS_YOLOX_ONNX=${EDUBOTICS_YOLOX_ONNX:-/opt/edubotics/yolox_tiny.onnx}
      - EDUBOTICS_DFINE_ONNX=${EDUBOTICS_DFINE_ONNX:-/opt/edubotics/dfine_n.onnx}
    volumes:
      # This container does inference/recording on ROS topics; it does NOT
      # talk to raw USB. /dev:/dev + privileged were unnecessary attack
      # surface — dropped. /dev/shm is needed for DDS shared-memory
      # transport between containers.
      - /dev/shm:/dev/shm
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ai_workspace:/workspace
      - huggingface_cache:/root/.cache/huggingface
      - edubotics_calib:/root/.cache/edubotics
      - /var/run/robotis/agent_sockets/physical_ai_server:/var/run/agent
      - ./physical_ai_server/.s6-keep:/etc/s6-overlay/s6-rc.d/user/contents.d/physical_ai_server:ro
    mem_limit: 6g
    pids_limit: 1024
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/127.0.0.1/9090) 2>/dev/null' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  physical_ai_manager:
    container_name: physical_ai_manager
    image: ${REGISTRY:-nettername}/physical-ai-manager:${IMAGE_TAG:-latest}
    depends_on:
      physical_ai_server:
        # Hold nginx until rosbridge is listening, so the first page load
        # has a live ROS connection rather than a black recording view.
        condition: service_healthy
    networks:
      - ros_net
    ports:
      - "127.0.0.1:80:80"
    restart: "no"
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      # Use 127.0.0.1 explicitly — busybox wget in nginx:alpine resolves
      # `localhost` to ::1 first (NSS hosts file order) and does not
      # fall back to IPv4 on connection refused. nginx in this image
      # listens IPv4-only (`listen 80;` with no `listen [::]:80;`), so
      # `wget http://localhost/...` from inside the container always
      # gets "Connection refused" → unhealthy. Cosmetic only — the
      # published port worked the whole time — but a perpetual
      # "unhealthy" flag masks real failures.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/version.json || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  ai_workspace:
  # HuggingFace cache can grow to tens of GB per student (each LeRobot
  # model + dataset is 5-15 GB). Without a cap, a runaway download loop
  # fills the distro VHDX and `docker compose down -v` fails. The cap is
  # advisory — docker's `local` driver doesn't enforce size — but it
  # documents the intent and pairs with a cleanup command in the GUI.
  # Set EDUBOTICS_HF_CACHE_SIZE to override.
  huggingface_cache:
    driver: local
  # Per-machine Roboter Studio calibration data: ChArUco intrinsics for the
  # gripper + scene cameras, dual-method (PARK/TSAI) hand-eye transforms,
  # and the HSV color profile. Survives `docker compose down`; only an
  # explicit `docker volume rm edubotics_calib` (or factory reset) wipes it
  # — desired, since re-calibration is a 15-minute teacher activity.
  edubotics_calib:
    driver: local
