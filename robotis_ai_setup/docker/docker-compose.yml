# Compose stack run inside the EduBotics WSL distro on student PCs (amd64)
# and on the classroom Jetson (arm64; via the -jetson images per service).
# Image tags are resolved from ${IMAGE_TAG:-latest}; the GUI updates the
# tag via versions.env. See docs/deploy/PIPELINE.md for the build pipeline.
#
# Lifecycle: `restart: "no"` on every service is deliberate — the Windows
# GUI (EduBotics.exe) is the SOLE owner of the container lifecycle. The
# stack must come up ONLY after the student has scanned both arms and
# clicked "Umgebung starten". With `unless-stopped` (the old value) dockerd
# resurrected the stack the moment the distro booted (i.e. the moment the
# GUI first touched WSL), so the arm was driven and the Dynamixel serial
# bus held BEFORE any scan — which also broke the scan itself (identify_arm
# .py collides with the live controller on the same /dev/serial port). The
# GUI tears down any leftover stack at startup and on a re-scan; `no` keeps
# dockerd from bringing it back behind the GUI's back. It also removes a
# documented footgun: a boot-sync abort used to loop compose's restart
# policy into a crash-storm.
networks:
  ros_net:
    driver: bridge

services:
  open_manipulator:
    container_name: open_manipulator
    image: ${REGISTRY:-ghcr.io/svendanilborodun}/open-manipulator:${IMAGE_TAG:-latest}
    tty: true
    restart: "no"
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    networks:
      - ros_net
    ports:
      # Native-camera ingest TCP server (camera_ingest_node.py). Loopback-bind
      # so the JPEG stream from the Windows GUI is reachable at localhost:5557
      # via the WSL2 NAT localhost-forwarder, but never exposed to the school
      # LAN. Only used when EDUBOTICS_CAMERA_SOURCE=native_bridge (WSL2 student
      # path); harmless on the Jetson (the GUI simply never connects).
      - "127.0.0.1:5557:5557"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      - FOLLOWER_PORT=${FOLLOWER_PORT}
      - LEADER_PORT=${LEADER_PORT}
      # Robot profile id — entrypoint_omx.sh branches on it (edu6_studio →
      # the Feetech driver node instead of the OMX bringup; default = today's
      # OMX phases). The server container has its own copy further down.
      - EDUBOTICS_ROBOT_TYPE=${EDUBOTICS_ROBOT_TYPE:-omx_full}
      # edu6 per-joint direction convention (7 comma-separated ±1) — bench
      # knob for rig gate R6; empty = the baked default (all +1). Read by
      # edu6_arm_node.py.
      - EDUBOTICS_EDU6_JOINT_SIGNS=${EDUBOTICS_EDU6_JOINT_SIGNS:-}
      # edu6 boot plausibility band, in encoder ticks (empty = 400 ≈ 35°). The
      # boot probe refuses a joint reading this far outside its designed EEPROM
      # window — it hunts a hand-turned 360° wrap, which misses by >=795 ticks
      # on every detectable joint, so the band has 2x headroom. Bench knob for
      # rig gate R9 (torque-off collapse measures where a LIMP arm rests, i.e.
      # the false-alarm side); >= 4096 disables. Read by edu6_arm_node.py.
      - EDUBOTICS_EDU6_BOOT_POS_TOL_TICKS=${EDUBOTICS_EDU6_BOOT_POS_TOL_TICKS:-}
      - CAMERA_DEVICE_1=${CAMERA_DEVICE_1:-}
      - CAMERA_NAME_1=${CAMERA_NAME_1:-gripper}
      - CAMERA_DEVICE_2=${CAMERA_DEVICE_2:-}
      # CAMERA_NAME_2 default is EMPTY (not "scene") so a SINGLE-camera config
      # (e.g. the Roboter Studio kit: one scene camera → .env has CAMERA_NAME_1
      # but no CAMERA_NAME_2) is distinguishable from a 2-camera config inside
      # the container. The healthcheck below gates its 2nd-camera topic probe on
      # CAMERA_NAME_2 being non-empty, and entrypoint_omx.sh's usb_cam loop keeps
      # its own internal `:-scene` fallback + the `CAMERA_DEVICE_2` empty-skip, so
      # the 2-camera classroom/Jetson path (which always sets both names) is
      # unchanged. camera_ingest_node.py keys off EDUBOTICS_CAMERA_NAMES, not this.
      - CAMERA_NAME_2=${CAMERA_NAME_2:-}
      # Camera tuning knobs. Without these, entrypoint_omx.sh's
      # `:-yuyv` etc. defaults always win and any per-classroom
      # override in the host .env never reaches the container. Compose
      # ${VAR} interpolation operates on the YAML only — the container
      # runtime env is whatever this list specifies.
      #
      # The default here (`yuyv`) is the safe choice for the Jetson
      # Orin Nano classroom target, which runs on a native USB host
      # controller and has the bandwidth budget. The student-PC path
      # (WSL2 vhci_hcd) cannot sustain 2×YUYV at 640×480×30 — both
      # cameras crash with `VIDIOC_DQBUF: Select timeout` inside ~5 s.
      # entrypoint_omx.sh detects the WSL2 kernel via `uname -r` and
      # flips the runtime default to `mjpeg2rgb` for that case (see
      # the detect_host_usb_bridge() block in that script). Any
      # explicit override in the host .env wins over both defaults.
      #
      # `raw_mjpeg` is intentionally NOT supported (broken in usb_cam
      # 0.8.1, ros-drivers/usb_cam#346 — falsifies the message
      # encoding and downstream consumers see green tiles / noise).
      - EDUBOTICS_CAMERA_PIXEL_FORMAT=${EDUBOTICS_CAMERA_PIXEL_FORMAT:-yuyv}
      - EDUBOTICS_CAMERA_WIDTH=${EDUBOTICS_CAMERA_WIDTH:-640}
      - EDUBOTICS_CAMERA_HEIGHT=${EDUBOTICS_CAMERA_HEIGHT:-480}
      - EDUBOTICS_CAMERA_FRAMERATE=${EDUBOTICS_CAMERA_FRAMERATE:-30.0}
      # Host USB-bridge type. Auto-detected inside entrypoint_omx.sh
      # via `uname -r` (Microsoft kernel ⇒ vhci_hcd, else native).
      # Forwarded here so an operator can pin it for testing
      # (e.g. EDUBOTICS_HOST_USB_BRIDGE=native on a WSL2 install to
      # force-test the yuyv path) and so the env-forwarding-guard CI
      # job stays green. Empty default = auto-detect.
      - EDUBOTICS_HOST_USB_BRIDGE=${EDUBOTICS_HOST_USB_BRIDGE:-}
      # Follower-only mode: student PCs default to 0 (both arms physically
      # present); the classroom Jetson agent's compose file sets it to 1
      # because the leader stays at the student's desk. Listed here so
      # the env-forwarding-guard CI job stays green.
      - EDUBOTICS_FOLLOWER_ONLY=${EDUBOTICS_FOLLOWER_ONLY:-0}
      # Camera capture source. native_bridge = cameras captured natively on
      # the Windows host and streamed in over TCP (WSL2 student path —
      # camera_ingest_node.py republishes them; usbipd cannot sustain UVC at
      # 30 Hz). usb_cam = in-container V4L2 over usbipd/native USB (Jetson /
      # native Linux). Empty = auto-detect in entrypoint_omx.sh (WSL2 kernel
      # ⇒ native_bridge). The GUI writes `native_bridge` explicitly into the
      # student .env so the healthcheck below can branch on it. Setting
      # `usb_cam` is the one-variable rollback to the old usbipd camera path.
      - EDUBOTICS_CAMERA_SOURCE=${EDUBOTICS_CAMERA_SOURCE:-}
      - EDUBOTICS_CAMERA_INGEST_PORT=${EDUBOTICS_CAMERA_INGEST_PORT:-5557}
      - EDUBOTICS_CAMERA_NAMES=${EDUBOTICS_CAMERA_NAMES:-gripper,scene}
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # The arm container needs privileged + /dev to talk to Dynamixel over
    # /dev/ttyACM* (character-device nodes that are created dynamically by
    # udev and can't be stably pre-mounted). Scoping this down requires a
    # deeper rework than fits here — tracked in context/21-known-issues.md §3.3.
    privileged: true
    # Resource cap: one runaway ROS node should not OOM the distro and
    # take down all three containers + corrupt ai_workspace.
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      # Audit F7: previously only checked /joint_states, leaving a
      # dead usb_cam container reported "healthy" → physical_ai_server
      # starts → recording proceeds with black frames → failure
      # surfaced only at first record-press via 5s topic-wait.
      # Now also assert the camera compressed-image topics are published.
      #   - native_bridge: assert the ingest topic for each CONFIGURED camera
      #     exists (camera_ingest_node is up). Slot 2 is gated on CAMERA_NAME_2
      #     being non-empty, so a SINGLE-camera config (Roboter Studio kit: one
      #     scene camera → CAMERA_NAME_1=scene, CAMERA_NAME_2 empty) stays healthy
      #     on the scene topic alone instead of waiting forever for a phantom 2nd
      #     camera. The 2-camera classroom path sets both names, so both are
      #     checked. Frame-flow itself is monitored by the GUI + the node's 10s Hz
      #     log; a 5s healthcheck can't run `ros2 topic hz`.
      #   - usb_cam: per-camera ${CAMERA_DEVICE_*} env-var gating lets
      #     single-camera setups stay healthy.
      # EDUBOTICS_CAMERA_SOURCE may be empty (auto-detect); fall back to the
      # same uname WSL2 detection the entrypoint uses so the branch matches.
      test: ["CMD-SHELL", "bash -c 'source /opt/ros/jazzy/setup.bash && source /root/ros2_ws/install/setup.bash && (ros2 topic list 2>/dev/null | grep -q /joint_states || exit 1); src=\"$$EDUBOTICS_CAMERA_SOURCE\"; if [ -z \"$$src\" ] && uname -r | grep -qi microsoft; then src=native_bridge; fi; if [ \"$$src\" = native_bridge ]; then ([ -z \"$$CAMERA_NAME_1\" ] || ros2 topic list | grep -q /$${CAMERA_NAME_1}/image_raw/compressed) && ([ -z \"$$CAMERA_NAME_2\" ] || ros2 topic list | grep -q /$${CAMERA_NAME_2}/image_raw/compressed); else ([ -z \"$$CAMERA_DEVICE_1\" ] || ros2 topic list | grep -q /$${CAMERA_NAME_1:-gripper}/image_raw/compressed) && ([ -z \"$$CAMERA_DEVICE_2\" ] || ros2 topic list | grep -q /$${CAMERA_NAME_2:-scene}/image_raw/compressed); fi'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  physical_ai_server:
    container_name: physical_ai_server
    image: ${REGISTRY:-ghcr.io/svendanilborodun}/physical-ai-server:${IMAGE_TAG:-latest}
    depends_on:
      open_manipulator:
        # Wait for /joint_states before starting the inference/recording
        # node — previously the first recording tick hit missing topics
        # and the UI flashed a misleading error.
        condition: service_healthy
    tty: true
    restart: "no"
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    networks:
      - ros_net
    ports:
      # Loopback-bind so rosbridge (unauthenticated — anyone who can reach
      # :9090 can drive the arm or steal datasets) isn't exposed to the
      # school LAN if Windows Firewall is misconfigured.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      # Student's HuggingFace token, set ONCE in the Windows GUI (Schritt D)
      # and stored in %LOCALAPPDATA%\EduBotics\.env (config_generator.upsert_env_var).
      # huggingface_hub reads $HF_TOKEN automatically, so recording upload,
      # whoami (Benutzer-ID list) and local policy download all authenticate
      # with no in-app re-entry. Empty default keeps cloud-only / no-token
      # starts working without a compose warning.
      - HF_TOKEN=${HF_TOKEN:-}
      # Recording video codec (v2.5.0 / LeRobot v0.5.1). Default 'h264'
      # (software libx264 under the hood) — fast CPU decode on Win10
      # student PCs in the React preview. Upstream LeRobot defaults to
      # 'libsvtav1' (AV1) which is 5-10x slower to decode on CPU. Other
      # valid values per LeRobot v0.5.1: 'hevc', 'libsvtav1', 'auto'.
      # Read by lerobot_dataset_wrapper.py's _apply_edubotics_defaults.
      - EDUBOTICS_VCODEC=${EDUBOTICS_VCODEC:-h264}
      # Dataset edits (Daten-tab delete/merge) re-encode video and can peg every
      # CPU core for minutes on legacy AV1 datasets. Default '1' runs the edit in
      # a nice-19 subprocess so it can't starve the ROS executor (the dashboard
      # used to go dead — every service call timed out — until the encode finished).
      # Read by communicator.py; '0' reverts to the in-process edit (debug only).
      - EDUBOTICS_DATASET_EDIT_SUBPROCESS=${EDUBOTICS_DATASET_EDIT_SUBPROCESS:-1}
      # Roboter Studio calibration dir (ChArUco intrinsics + hand-eye
      # transforms). Default lands inside the edubotics_calib named volume
      # mounted below. Readers: workflow/calibration_manager.py,
      # physical_ai_server.py.
      - EDUBOTICS_CALIB_DIR=${EDUBOTICS_CALIB_DIR:-/root/.cache/edubotics}
      # Roboter Studio named-object grasping: the object set is a FIXED constant
      # baked into the physical-ai-server image (identical on every machine/user;
      # workflow/object_catalog.py::_FIXED_CATALOG) — there is NO per-rig catalog
      # file. EDUBOTICS_TAG_SIZE_M is the physical AprilTag edge length (metres)
      # used for the tag-pose scale + tag-edge sanity gate; it stays env-tunable so
      # a rig printing a different tag size can be corrected without a rebuild.
      # Read by workflow/object_catalog.py — MUST stay forwarded (env-forwarding-guard).
      - EDUBOTICS_TAG_SIZE_M=${EDUBOTICS_TAG_SIZE_M:-0.024}
      # Tag-edge sanity gate: a named-object grasp drops the recovered tag
      # orientation (→ skips the instance, never grasps with a wrong wrist roll)
      # when the back-projected tag side deviates from the catalog tag_size_m by
      # more than this fraction. Read by workflow/handlers/perception_blocks.py.
      - EDUBOTICS_TAG_EDGE_TOL_FRAC=${EDUBOTICS_TAG_EDGE_TOL_FRAC:-0.5}
      # Tag-yaw precision (2026-06-24): the named grasp circular-means the tag
      # yaw over FRAMES live scene frames and rejects the reading if the angular
      # resultant R is below MIN_RESULTANT (jittery/occluded → skip the instance,
      # never grasp with a noisy wrist roll). Read by workflow/handlers/perception_blocks.py.
      - EDUBOTICS_TAG_YAW_FRAMES=${EDUBOTICS_TAG_YAW_FRAMES:-7}
      - EDUBOTICS_TAG_YAW_MIN_RESULTANT=${EDUBOTICS_TAG_YAW_MIN_RESULTANT:-0.9}
      # Named-object „Solange <Typ> sichtbar" loop: the observation pose the arm
      # retreats to between passes (out of the scene-cam view; 5 comma-separated
      # joint radians, empty = HOME), and the generous empty-WINDOW (terminate only
      # after the type has been CONTINUOUSLY empty for ≥ WHILE_EMPTY_SECONDS AND
      # across ≥ WHILE_EMPTY_FRAMES consecutive detections). Read by
      # workflow/handlers/motion.py + workflow/interpreter.py.
      - EDUBOTICS_OBSERVE_POSE=${EDUBOTICS_OBSERVE_POSE:-}
      - EDUBOTICS_WHILE_EMPTY_FRAMES=${EDUBOTICS_WHILE_EMPTY_FRAMES:-2}
      - EDUBOTICS_WHILE_EMPTY_SECONDS=${EDUBOTICS_WHILE_EMPTY_SECONDS:-5.0}
      # Flicker-spin guard (break after this many consecutive no-progress passes),
      # wall-clock cap (seconds), and the settle delay after the retreat before
      # re-detecting. Read by workflow/interpreter.py.
      - EDUBOTICS_WHILE_STALL_PASSES=${EDUBOTICS_WHILE_STALL_PASSES:-3}
      - EDUBOTICS_WHILE_MAX_SECONDS=${EDUBOTICS_WHILE_MAX_SECONDS:-120}
      - EDUBOTICS_WHILE_SETTLE_S=${EDUBOTICS_WHILE_SETTLE_S:-0.2}
      # Recycled-object reclaim: a claimed/skipped object continuously ABSENT for
      # ≥ this many seconds and then put back is grabbed again. Read by
      # workflow/handlers/perception_blocks.py.
      - EDUBOTICS_RECLAIM_ABSENT_S=${EDUBOTICS_RECLAIM_ABSENT_S:-1.5}
      # Follower-only (Roboter Studio) flag. NOTE: the server does NOT read
      # this env var — leader_appears_active() (collision_monitor.py) keys
      # SOLELY on /leader/joint_states freshness (the env would be stale after
      # the mid-session LeaderToggle recreates only open_manipulator). Kept
      # forwarded for informational parity with open_manipulator only.
      - EDUBOTICS_FOLLOWER_ONLY=${EDUBOTICS_FOLLOWER_ONLY:-0}
      # Robot-type profile id (ArmProfile registry). Hardset by the Windows
      # GUI before "Umgebung starten"; read ONCE by physical_ai_server at
      # __init__ (robot_profiles.resolve) to pick capabilities + the data
      # robot_type ("omx_f"). omx_full = both arms (default, today's
      # behavior); omx_follower = Roboter-Studio-only kit. Absent/unknown
      # values fall back to omx_full (one-variable rollback).
      - EDUBOTICS_ROBOT_TYPE=${EDUBOTICS_ROBOT_TYPE:-omx_full}
      # WS4 (2026-06-17) scene-cam single-shot extrinsic: the known
      # board-on-table placement (base frame, metres). The student lays the
      # ChArUco flat at this reference; the scene extrinsic + z_table derive
      # from it. Read by workflow/calibration_manager.py at import time, so
      # these MUST stay forwarded (ci.yml::env-forwarding-guard). Defaults
      # (18 cm in front of base, centred, table = base plane) fit the typical
      # OMX-F classroom station — see tools/classroom_kit_README.md.
      - EDUBOTICS_BOARD_ORIGIN_X_M=${EDUBOTICS_BOARD_ORIGIN_X_M:-0.18}
      - EDUBOTICS_BOARD_ORIGIN_Y_M=${EDUBOTICS_BOARD_ORIGIN_Y_M:-0.075}
      - EDUBOTICS_BOARD_TABLE_Z_M=${EDUBOTICS_BOARD_TABLE_Z_M:-0.0}
      # Yaw of the ChArUco board frame about base +Z (0 when the L-jig holds it
      # square to the base — the default). For a jig that holds the board rotated.
      - EDUBOTICS_BOARD_YAW_DEG=${EDUBOTICS_BOARD_YAW_DEG:-0.0}
      # Scene-extrinsic orientation sanity gate: the workspace band the camera's
      # optical axis must hit (forward of the robot, roughly centred), so a
      # grossly misplaced board is rejected. Generous defaults; relax per-rig for
      # an unusual camera mount.
      - EDUBOTICS_EXTRINSIC_REGION_X_MIN=${EDUBOTICS_EXTRINSIC_REGION_X_MIN:-0.08}
      - EDUBOTICS_EXTRINSIC_REGION_X_MAX=${EDUBOTICS_EXTRINSIC_REGION_X_MAX:-0.46}
      - EDUBOTICS_EXTRINSIC_REGION_Y_ABS=${EDUBOTICS_EXTRINSIC_REGION_Y_ABS:-0.18}
      # P3a: one extrinsic "Bild erfassen" click internally bursts this many
      # camera reads of the fixed board and averages the solvePnP poses (sensor-
      # jitter reduction, ~sqrt(N)). =1 reverts to the exact single-shot path.
      # INTERVAL spaces the reads past the ~25 fps frame period. Read by
      # workflow/calibration_manager.py.
      - EDUBOTICS_EXTRINSIC_BURST_FRAMES=${EDUBOTICS_EXTRINSIC_BURST_FRAMES:-8}
      - EDUBOTICS_EXTRINSIC_BURST_INTERVAL_S=${EDUBOTICS_EXTRINSIC_BURST_INTERVAL_S:-0.06}
      # DEV (2026-06-24): force a full recalibration (intrinsics + extrinsic +
      # touch-off) on EVERY EduBotics restart, because the bench setup changes
      # constantly during development. The server reads this ONCE at startup; the
      # /calibration/status gate reports not-calibrated until the student re-runs
      # the full wizard this boot (then it latches for the session, re-asserts next
      # restart). Set to 0/false/no/off for the classroom (calibration persists).
      # Read by physical_ai_server.py — MUST stay forwarded (env-forwarding-guard).
      - EDUBOTICS_FORCE_RECALIBRATION=${EDUBOTICS_FORCE_RECALIBRATION:-1}
      # #1 (2026-06-19): per-rig intrinsic calibration is MANDATORY — the
      # factory-default-intrinsics seeding (the old EDUBOTICS_FACTORY_* knobs)
      # was REMOVED. A guessed focal length scales every projected XY, so no
      # guessed K ships; the student runs the 12-frame ChArUco intrinsic step.
      # Generic grasp: conservative descend clearance above the measured table
      # plane, and a fixed tool-roll (j5) for the gripper. Rig-tunable.
      - EDUBOTICS_GRASP_CLEARANCE_M=${EDUBOTICS_GRASP_CLEARANCE_M:-0.012}
      # Release height (m) above the destination surface for `ablegen bei` (drop_at)
      # so the held object is dropped from a safe height that clears a low
      # container rim instead of pressing the gripper down to ~table level.
      - EDUBOTICS_DROP_HEIGHT_M=${EDUBOTICS_DROP_HEIGHT_M:-0.05}
      # Top-down jaw constant (deg). The OMX-F jaws separate along EE-Y, so the
      # geometrically-correct value is 90 (0 would pinch the perpendicular axis);
      # it is the additive const in the live named-object grasp roll AND the fixed
      # roll the legacy pickup/drop_at/move_to use. Rig-validated by the P0
      # jaw-check. Read by workflow/handlers/motion.py.
      - EDUBOTICS_GRASP_ROLL_DEG=${EDUBOTICS_GRASP_ROLL_DEG:-90.0}
      # Grasp-success check (named-object grasp): after the gripper closes, the
      # achieved gripper angle (follower joint 5) tells HELD from EMPTY — an
      # achieved angle ≤ the held threshold means the jaws closed empty (missed).
      # The default is EMPTY on purpose: an empty value means "unset" to
      # motion.py, which then derives the threshold PER OBJECT (last commanded
      # close + margin). Setting a literal value here (e.g. -0.35) restores the
      # fixed global threshold everywhere — that is the documented rollback. A
      # baked non-empty default would permanently disable the per-object path
      # (the v2.12.x dead-code scar). GRASP_RETRY re-tries the detect→grasp that
      # many times before skipping the instance; GRASP_SETTLE_S settles the
      # servo before the readback. Read by workflow/handlers/motion.py.
      - EDUBOTICS_GRASP_HELD_MAX_RAD=${EDUBOTICS_GRASP_HELD_MAX_RAD:-}
      - EDUBOTICS_GRASP_RETRY=${EDUBOTICS_GRASP_RETRY:-1}
      - EDUBOTICS_GRASP_SETTLE_S=${EDUBOTICS_GRASP_SETTLE_S:-0.3}
      # Teleop force/collision e-stop (Rule §2 software guard, teleop-only). Read by the
      # collision monitor in safety/collision_monitor.py + collision_detector.py. The follower
      # is MIXED-MODEL: dxl11-13 (XL430-W250) expose 'Present Load', dxl14-15 (XL330-M288)
      # expose 'Present Current' — the monitor normalizes each to a 0..1 EFFORT fraction, so the
      # thresholds below are fractions (NOT Amps). Defaults are conservative and safe even unset;
      # an operator refines them per-rig with calibrate_collision_currents.py. ENABLED=0 is the
      # one-variable rollback (full disable; the extra Dynamixel state reads stay harmless).
      # MUST stay listed here (left of '=') or ci.yml::env-forwarding-guard fails.
      - EDUBOTICS_COLLISION_ENABLED=${EDUBOTICS_COLLISION_ENABLED:-1}
      - EDUBOTICS_COLLISION_EFFORT_J1=${EDUBOTICS_COLLISION_EFFORT_J1:-0.30}
      - EDUBOTICS_COLLISION_EFFORT_J2=${EDUBOTICS_COLLISION_EFFORT_J2:-0.65}
      - EDUBOTICS_COLLISION_EFFORT_J3=${EDUBOTICS_COLLISION_EFFORT_J3:-0.40}
      - EDUBOTICS_COLLISION_EFFORT_J4=${EDUBOTICS_COLLISION_EFFORT_J4:-0.30}
      - EDUBOTICS_COLLISION_EFFORT_J5=${EDUBOTICS_COLLISION_EFFORT_J5:-0.30}
      - EDUBOTICS_COLLISION_VELOCITY_GATE=${EDUBOTICS_COLLISION_VELOCITY_GATE:-0.05}
      - EDUBOTICS_COLLISION_DEBOUNCE_MS=${EDUBOTICS_COLLISION_DEBOUNCE_MS:-150}
      - EDUBOTICS_COLLISION_RESUME_TOL_RAD=${EDUBOTICS_COLLISION_RESUME_TOL_RAD:-0.30}
      - EDUBOTICS_COLLISION_GPIO_TOPIC=${EDUBOTICS_COLLISION_GPIO_TOPIC:-/gpio_command_controller/gpio_states}
      - EDUBOTICS_COLLISION_USE_OVERLOAD_BIT=${EDUBOTICS_COLLISION_USE_OVERLOAD_BIT:-1}
    volumes:
      # This container does inference/recording on ROS topics; it does NOT
      # talk to raw USB. /dev:/dev + privileged were unnecessary attack
      # surface — dropped. /dev/shm is needed for DDS shared-memory
      # transport between containers.
      - /dev/shm:/dev/shm
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ai_workspace:/workspace
      - huggingface_cache:/root/.cache/huggingface
      - edubotics_calib:/root/.cache/edubotics
      - /var/run/robotis/agent_sockets/physical_ai_server:/var/run/agent
      - ./physical_ai_server/.s6-keep:/etc/s6-overlay/s6-rc.d/user/contents.d/physical_ai_server:ro
    mem_limit: 6g
    pids_limit: 1024
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/127.0.0.1/9090) 2>/dev/null' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  physical_ai_manager:
    container_name: physical_ai_manager
    image: ${REGISTRY:-ghcr.io/svendanilborodun}/physical-ai-manager:${IMAGE_TAG:-latest}
    depends_on:
      physical_ai_server:
        # Hold nginx until rosbridge is listening, so the first page load
        # has a live ROS connection rather than a black recording view.
        condition: service_healthy
    networks:
      - ros_net
    ports:
      - "127.0.0.1:80:80"
    restart: "no"
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      # Use 127.0.0.1 explicitly — busybox wget in nginx:alpine resolves
      # `localhost` to ::1 first (NSS hosts file order) and does not
      # fall back to IPv4 on connection refused. nginx in this image
      # listens IPv4-only (`listen 80;` with no `listen [::]:80;`), so
      # `wget http://localhost/...` from inside the container always
      # gets "Connection refused" → unhealthy. Cosmetic only — the
      # published port worked the whole time — but a perpetual
      # "unhealthy" flag masks real failures.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/version.json || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  ai_workspace:
  # HuggingFace cache can grow to tens of GB per student (each LeRobot
  # model + dataset is 5-15 GB). Without a cap, a runaway download loop
  # fills the distro VHDX and `docker compose down -v` fails. The cap is
  # advisory — docker's `local` driver doesn't enforce size — but it
  # documents the intent and pairs with a cleanup command in the GUI.
  # Set EDUBOTICS_HF_CACHE_SIZE to override.
  huggingface_cache:
    driver: local
  # Per-machine Roboter Studio calibration data: ChArUco intrinsics for the
  # gripper + scene cameras, dual-method (PARK/TSAI) hand-eye transforms,
  # and the HSV color profile. Survives `docker compose down`; only an
  # explicit `docker volume rm edubotics_calib` (or factory reset) wipes it
  # — desired, since re-calibration is a 15-minute teacher activity.
  edubotics_calib:
    driver: local
