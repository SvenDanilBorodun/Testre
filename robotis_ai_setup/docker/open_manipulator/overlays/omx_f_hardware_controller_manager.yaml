/**:
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      # EduBotics teleop collision e-stop: read-only broadcaster that surfaces the
      # arm-joint Present Current + Hardware Error Status (declared in
      # omx_f.ros2_control.xacro) on ~/gpio_states as control_msgs/DynamicJointState
      # at the CM update_rate (100 Hz). It claims NO command interface, so it cannot
      # drive the servos and does not touch the Goal Position command path (Rule §2).
      gpio_command_controller:
        type: gpio_controllers/GpioCommandController

/**:
  arm_controller:
    ros__parameters:
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - gripper_joint_1

      interface_name: position

      command_interfaces:
        - position

      state_interfaces:
        - position
        - velocity

      allow_partial_joints_goal: true

      # Per-joint limits on commanded velocity and acceleration. Without
      # these a bad trajectory (e.g. a diverging policy asking for
      # positions = [3.0] with time_from_start = 0.05s ⇒ ~60 rad/s) is
      # forwarded to the Dynamixels unchecked and the servos stall /
      # overheat. Values are conservative and suit typical manipulation.
      #
      # 2026-05-18: bumped `trajectory` tolerances aggressively. Initial
      # bump 0.15→0.40 wasn't enough — the gripper trigger joint can sit
      # at -0.70 rad on the leader (the held trigger position) while the
      # follower starts at ~0.00 rad (gripper open), a 0.70 rad delta
      # the controller couldn't accept. Further bumping to 2.0 rad puts
      # the in-flight check effectively off; safety still comes from the
      # Dynamixel firmware current limits and from the `goal` tolerance
      # below, which catches a controller that never reaches its target.
      # `goal: 0.05` left untouched for joints — final position must be
      # close; the gripper `goal: 0.50` accepts the trigger-vs-open
      # offset at end of every micro-trajectory the leader broadcasts.
      constraints:
        stopped_velocity_tolerance: 0.05  # rad/s
        goal_time: 5.0  # slack on overall trajectory timing (was 1.0)
        joint1: { trajectory: 2.0, goal: 0.10 }
        joint2: { trajectory: 2.0, goal: 0.10 }
        joint3: { trajectory: 2.0, goal: 0.10 }
        joint4: { trajectory: 2.0, goal: 0.10 }
        joint5: { trajectory: 2.0, goal: 0.10 }
        gripper_joint_1: { trajectory: 2.0, goal: 0.50 }

/**:
  gpio_command_controller:
    ros__parameters:
      type: gpio_controllers/GpioCommandController
      # State-only: the collision monitor in physical_ai_server reads these over
      # /gpio_command_controller/gpio_states. NO command_interfaces block — claiming
      # a command interface here would conflict with arm_controller's Goal Position
      # and could write the servos. The gripper (dxl16) is intentionally absent: it is
      # an XL430-class servo whose control table lacks a Present Current register
      # (declaring it would hard-fail hardware init) and it is already current-limited
      # in Op Mode 5, so it needs no software force monitoring.
      gpios:
        - dxl11
        - dxl12
        - dxl13
        - dxl14
        - dxl15
      state_interfaces:
        dxl11:
          - interfaces:
            - Present Current
            - Present Velocity
            - Hardware Error Status
        dxl12:
          - interfaces:
            - Present Current
            - Present Velocity
            - Hardware Error Status
        dxl13:
          - interfaces:
            - Present Current
            - Present Velocity
            - Hardware Error Status
        dxl14:
          - interfaces:
            - Present Current
            - Present Velocity
            - Hardware Error Status
        dxl15:
          - interfaces:
            - Present Current
            - Present Velocity
            - Hardware Error Status
