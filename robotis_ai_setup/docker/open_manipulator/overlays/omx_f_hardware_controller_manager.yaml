/**:
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      # EduBotics teleop collision e-stop: read-only broadcaster that surfaces each
      # arm joint's native force signal + Hardware Error Status (declared in
      # omx_f.ros2_control.xacro) on ~/gpio_states as control_msgs/DynamicJointState
      # at the CM update_rate (100 Hz). MODEL-AWARE: 'Present Load' for the XL430-W250
      # base joints (dxl11-13), 'Present Current' for the XL330-M288 wrist joints
      # (dxl14-15) — the two models expose different addr-126 registers. It claims NO
      # command interface, so it cannot drive the servos and does not touch the Goal
      # Position command path (Rule §2).
      gpio_command_controller:
        type: gpio_controllers/GpioCommandController

/**:
  arm_controller:
    ros__parameters:
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - gripper_joint_1

      interface_name: position

      command_interfaces:
        - position

      state_interfaces:
        - position
        - velocity

      allow_partial_joints_goal: true

      # ⚠️ CORRECTED 2026-07-26 — the paragraph that used to sit here described
      # a protection that DOES NOT EXIST. It claimed "per-joint limits on
      # commanded velocity and acceleration, without these a bad trajectory is
      # forwarded to the Dynamixels unchecked". There is **no `joint_limits`
      # block anywhere in these overlays** (grep: zero hits) — what follows is
      # `constraints:`, which are ABORT TOLERANCES, not limits. They do not
      # bound a commanded velocity; they decide when the controller gives up on
      # a trajectory it is already executing.
      #
      # So a diverging policy asking for positions = [3.0] at
      # time_from_start = 0.05 s IS still forwarded unchecked. The actual safety
      # floor is the Dynamixel current limit (see CLAUDE.md Rule §2), NOT
      # anything in this file. Do not re-add a claim of velocity limiting here
      # without adding the `joint_limits` block to go with it.
      #
      # 2026-05-18: bumped `trajectory` tolerances aggressively. Initial
      # bump 0.15→0.40 wasn't enough — the gripper trigger joint can sit
      # at -0.70 rad on the leader (the held trigger position) while the
      # follower starts at ~0.00 rad (gripper open), a 0.70 rad delta
      # the controller couldn't accept. Further bumping to 2.0 rad puts
      # the in-flight check effectively off; safety still comes from the
      # Dynamixel firmware current limits and from the `goal` tolerance
      # below, which catches a controller that never reaches its target.
      # `goal: 0.05` left untouched for joints — final position must be
      # close; the gripper `goal: 0.50` accepts the trigger-vs-open
      # offset at end of every micro-trajectory the leader broadcasts.
      constraints:
        stopped_velocity_tolerance: 0.05  # rad/s
        goal_time: 5.0  # slack on overall trajectory timing (was 1.0)
        joint1: { trajectory: 2.0, goal: 0.10 }
        joint2: { trajectory: 2.0, goal: 0.10 }
        joint3: { trajectory: 2.0, goal: 0.10 }
        joint4: { trajectory: 2.0, goal: 0.10 }
        joint5: { trajectory: 2.0, goal: 0.10 }
        gripper_joint_1: { trajectory: 2.0, goal: 0.50 }

/**:
  gpio_command_controller:
    ros__parameters:
      type: gpio_controllers/GpioCommandController
      # State-only: the collision monitor in physical_ai_server reads these over
      # /gpio_command_controller/gpio_states. NO command_interfaces block — claiming
      # a command interface here would conflict with arm_controller's Goal Position
      # and could write the servos. Each joint requests ONLY the force register its
      # servo model actually has (XL430-W250 dxl11-13 -> Present Load; XL330-M288
      # dxl14-15 -> Present Current); requesting a register the model lacks hard-fails
      # hardware init (InitDxlReadItems "Cannot find control item"). The gripper
      # (dxl16) is intentionally absent: it is already current-limited in Op Mode 5,
      # so it needs no software force monitoring.
      gpios:
        - dxl11
        - dxl12
        - dxl13
        - dxl14
        - dxl15
      state_interfaces:
        dxl11:
          - interfaces:
            - Present Load
            - Present Velocity
            - Hardware Error Status
        dxl12:
          - interfaces:
            - Present Load
            - Present Velocity
            - Hardware Error Status
        dxl13:
          - interfaces:
            - Present Load
            - Present Velocity
            - Hardware Error Status
        dxl14:
          - interfaces:
            - Present Current
            - Present Velocity
            - Hardware Error Status
        dxl15:
          - interfaces:
            - Present Current
            - Present Velocity
            - Hardware Error Status
